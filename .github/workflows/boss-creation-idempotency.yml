name: Guardian Creation Idempotency

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate duplicate Guardian protection
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ServerScriptService/Services/BossService.lua")
          text = path.read_text(encoding="utf-8")
          required = [
              'local bossName = uniqueName or "CrystalGuardian"',
              'local existing = parent:FindFirstChild(bossName)',
              'if existing:IsA("Model") and existing:GetAttribute("BossId") == "CrystalGuardian" then',
              'return existing',
              'existing:Destroy()',
              'if not PlayerService.ShuttingDown and parent.Parent and not parent:FindFirstChild(bossName) then',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("Guardian creation idempotency guard missing: " + ", ".join(missing))
          print("Guardian creation idempotency and reserved-name collision contract validated against runtime implementation.")