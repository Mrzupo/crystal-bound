name: Combat Validation Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/combat-rate-limit-before-validation"]
  pull_request:

jobs:
  validate-combat-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate combat bounds and request gating
        shell: python
        run: |
          from pathlib import Path

          hitbox = Path("src/ReplicatedStorage/Modules/Combat/HitboxService.lua").read_text(encoding="utf-8")
          damage = Path("src/ServerScriptService/Services/DamageService.lua").read_text(encoding="utf-8")
          validators = Path("src/ReplicatedStorage/Modules/Combat/DamageValidators.lua").read_text(encoding="utf-8")
          combat = Path("src/ServerScriptService/Services/CombatService.lua").read_text(encoding="utf-8")

          problems = []
          if "math.clamp(number, 0, 1000)" not in hitbox:
              problems.append("Hitbox radius cap must remain 1000")
          if "if not maxRange or maxRange <= 0 or maxRange > 1000 then return false end" not in damage:
              problems.append("DamageService must reject non-positive or range above 1000")
          if "request.Amount > 0" not in validators:
              problems.append("DamageValidators must reject zero and negative damage")
          if "local MAX_RANGE = 1000" not in validators or "request.Range > MAX_RANGE" not in validators:
              problems.append("DamageValidators must centrally bound attacker range")
          if "DamageTypes.Environmental" not in validators:
              problems.append("DamageValidators must explicitly gate Environmental damage")
          for marker in (
              "local function boundedPositive",
              "local safeRange = boundedPositive(config.Range, 0.1, 1000)",
              "local safeCooldown = boundedPositive(config.Cooldown, 0.05, 60)",
              "local safeBaseDamage = boundedPositive(config.Damage, 0.1, 1000)",
              "local function validNonNegativeInteger",
              "if xpGain == nil or moneyGain == nil then return end",
              "targetModel:SetAttribute(\"DeathRewarded\", true)",
              "local requestNow = os.clock()",
              "if requestNow < (nextRequest[player] or 0) then return end",
              "nextRequest[player] = requestNow + REQUEST_INTERVAL",
              "if not VALID_ACTIONS[action] then return end",
          ):
              if marker not in combat:
                  problems.append(f"CombatService missing runtime boundary marker: {marker}")

          if problems:
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("Combat validation, request bounds, defeat-reward config gates and pre-validation rate limiting validated.")
