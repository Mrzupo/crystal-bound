name: Crystal Ability Range Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configured Gale splash range
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          service = Path('src/ServerScriptService/Services/CrystalAbilityService.lua').read_text(encoding='utf-8')
          config = Path('src/ReplicatedStorage/Config/CrystalConfig.lua').read_text(encoding='utf-8')
          match = re.search(r'GALE\s*=\s*\{\s*Name\s*=\s*"Gale Strike"\s*,\s*Damage\s*=\s*([0-9.]+)\s*,\s*Range\s*=\s*([0-9.]+)', config)
          if not match:
              raise SystemExit('CrystalConfig must define Gale Strike damage and range')
          configured_range = float(match.group(2))
          if configured_range <= 0 or configured_range > 1000:
              raise SystemExit('Gale ability range must be within 0..1000')
          for marker in [
              'GetEnemyModels(targetRoot.Position, safeRange, targetModel)',
              'local playerToTarget = (targetRoot.Position - playerRoot.Position).Magnitude',
              'local splashDamageRange = math.min(1000, safeRange + playerToTarget)',
              'Range = splashDamageRange',
          ]:
              if marker not in service:
                  raise SystemExit('Gale centered splash range contract missing: ' + marker)
          if 'GetEnemyModels(centerRoot.Position, 12, targetModel)' in service:
              raise SystemExit('Gale ability must not hardcode a 12-stud splash radius')
          print(f'Crystal ability range contract validated: configured Gale range={configured_range}.')
          PY
