name: Achievement Canonical Source Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-achievement-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate centralized achievement definitions, reward ownership and economy bounds
        shell: python
        run: |
          from pathlib import Path
          import re
          player_data = Path("src/ReplicatedStorage/Modules/PlayerData.lua").read_text(encoding="utf-8")
          menu = Path("src/StarterPlayer/StarterPlayerScripts/AchievementMenu.client.lua").read_text(encoding="utf-8")
          system = Path("src/ReplicatedStorage/Modules/AchievementSystem.lua").read_text(encoding="utf-8")
          economy = Path("src/ReplicatedStorage/Config/EconomyConfig.lua").read_text(encoding="utf-8")
          server_root = Path("src/ServerScriptService")
          for marker in ("GetOrdered", "IsValidTitle", "AchievementSystem.Get"):
              if marker not in system:
                  raise SystemExit(f"AchievementSystem missing canonical API: {marker}")
          if "AchievementSystem = require(script.Parent.AchievementSystem)" not in player_data:
              raise SystemExit("PlayerData must consume AchievementSystem")
          if "AchievementSystem = require(ReplicatedStorage.Modules.AchievementSystem)" not in menu:
              raise SystemExit("AchievementMenu must consume AchievementSystem")
          forbidden = ("FIRST_BLOOD =", "CRYSTAL_KEEPER =", "MASTER_OF_ONE =", "GUARDIAN_SLAYER =", "ANCIENT_EXPLORER =", "LEVEL_20 =")
          duplicate_locations = []
          for path in (Path("src/ReplicatedStorage/Modules/PlayerData.lua"), Path("src/StarterPlayer/StarterPlayerScripts/AchievementMenu.client.lua")):
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      duplicate_locations.append(f"{path}: {marker}")
          if duplicate_locations:
              raise SystemExit("Hard-coded achievement definition remnants: " + ", ".join(duplicate_locations))

          if "canonicalTitles" not in system or "for _, achievementId in ipairs(profile.Achievements)" not in system:
              raise SystemExit("AchievementSystem must derive Titles from earned Achievement IDs")
          if "profile.Titles = canonicalTitles" not in system:
              raise SystemExit("AchievementSystem must replace persisted Titles with canonical achievement-derived titles")

          max_money_match = re.search(r"MaxMoney\s*=\s*(\d+)", economy)
          max_money = int(max_money_match.group(1)) if max_money_match else 1000000000
          rewards = [int(value) for value in re.findall(r"RewardMoney\s*=\s*(\d+)", system)]
          if not rewards or any(value < 0 or value > max_money for value in rewards):
              raise SystemExit("Achievement RewardMoney values must be within 0..EconomyConfig.MaxMoney")

          reward_owners = []
          marker = "EconomyService.AddMoney(profile, definition.RewardMoney or 0)"
          for path in server_root.rglob("*.lua"):
              if marker in path.read_text(encoding="utf-8"):
                  reward_owners.append(str(path))
          if len(reward_owners) != 1 or reward_owners[0] != "src/ServerScriptService/Services/PlayerService.lua":
              raise SystemExit(f"Achievement Money rewards must have exactly one server owner; found {reward_owners}")

          print("Achievement canonical source, title integrity, reward ownership and economy bounds validated.")
