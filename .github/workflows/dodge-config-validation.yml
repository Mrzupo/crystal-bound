name: Dodge Config Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-dodge-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate centralized dodge configuration and lifecycle
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/DodgeConfig.lua").read_text(encoding="utf-8")
          service = Path("src/ServerScriptService/Services/DodgeService.lua").read_text(encoding="utf-8")
          for marker in ("Cooldown =", "Invulnerability =", "Boost =", "MaxDirectionMagnitude ="):
              if marker not in config:
                  raise SystemExit(f"DodgeConfig missing {marker}")
          for marker in ("DodgeConfig.Cooldown", "DodgeConfig.Invulnerability", "DodgeConfig.Boost", "DodgeConfig.MaxDirectionMagnitude"):
              if marker not in service:
                  raise SystemExit(f"DodgeService missing centralized config usage: {marker}")
          numbers = [float(value) for value in re.findall(r'=\s*(-?\d+(?:\.\d+)?)', config)]
          if any(value <= 0 for value in numbers):
              raise SystemExit("DodgeConfig values must all be positive")

          lifecycle = [
              'local playerConnections = setmetatable({}, { __mode = "k" })',
              'local invulnerabilityTokens = setmetatable({}, { __mode = "k" })',
              'local function disconnectPlayer(player)',
              'local function invalidateInvulnerability(player)',
              'local token = invulnerabilityTokens[player]',
              'if connection and connection.Connected then connection:Disconnect() end',
              'invalidateInvulnerability(player)',
              'invulnerabilityTokens[player] == token',
              'disconnectPlayer(player)',
              'Players.PlayerRemoving:Connect(function(player)',
          ]
          for marker in lifecycle:
              if marker not in service:
                  raise SystemExit(f"DodgeService delayed-task lifecycle cleanup missing: {marker}")
          print("DodgeConfig, CharacterAdded cleanup and stale invulnerability-task token contract validated.")