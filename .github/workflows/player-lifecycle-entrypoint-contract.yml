name: Player Lifecycle Entrypoint Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Player lifecycle owners and Bootstrap load guard
        shell: python
        run: |
          from pathlib import Path
          project = Path("default.project.json").read_text(encoding="utf-8")
          lifecycle = Path("src/ServerScriptService/PlayerLifecycle.server.lua").read_text(encoding="utf-8")
          service = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          bootstrap = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")

          if '"PlayerLifecycle": {"$path": "src/ServerScriptService/PlayerLifecycle.server.lua"}' not in project:
              raise SystemExit("default.project.json must load PlayerLifecycle.server.lua")
          if "Players.PlayerRemoving:Connect" not in lifecycle:
              raise SystemExit("PlayerLifecycle must bind PlayerRemoving")
          if "local ok = PlayerService.Remove(player)" not in lifecycle:
              raise SystemExit("PlayerLifecycle must unconditionally delegate final persistence to PlayerService.Remove")
          if "GetProfile(player)" in lifecycle:
              raise SystemExit("PlayerLifecycle must not gate Remove() behind GetProfile(); shutdown hides gameplay profiles intentionally")
          if "function PlayerService.Remove(player)" not in service:
              raise SystemExit("PlayerService.Remove must remain the canonical remove owner")

          for marker in (
              'local cleanupUnloadedPlayer(player)',
              'PlayerService.CharacterConnections[player] = nil',
              'PlayerService.HumanoidConnections[player] = nil',
              'if PlayerService.Profiles[player] == nil then',
          ):
              if marker not in lifecycle:
                  raise SystemExit("PlayerLifecycle unloaded-profile cleanup guard missing: " + marker)

          for marker in (
              'local loadingPlayers = setmetatable({}, { __mode = "k" })',
              'if loadingPlayers[player] then return false end',
              'loadingPlayers[player] = true',
              'local success, profile, reason = xpcall(function()',
              'loadingPlayers[player] = nil',
              'local syncSuccess, syncError = xpcall(function()',
          ):
              if marker not in bootstrap:
                  raise SystemExit("Bootstrap player-load lifecycle guard missing: " + marker)
          if bootstrap.count('Players.PlayerAdded:Connect(function(player)') != 1:
              raise SystemExit("Bootstrap must have exactly one canonical PlayerAdded owner")
          if bootstrap.count('for _, player in ipairs(Players:GetPlayers()) do') < 1:
              raise SystemExit("Bootstrap must also process already-present players")
          print("Player lifecycle entrypoint, unloaded-profile cleanup, shutdown-safe remove delegation, single PlayerAdded owner and Bootstrap load-guard cleanup validated.")