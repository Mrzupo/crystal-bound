name: PvE damage range contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit attacker range in DodgeService
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ServerScriptService/Services/DodgeService.lua')
          text = path.read_text(encoding='utf-8')
          required = [
              'local safeRange',
              'if not safeRange or safeRange ~= safeRange or safeRange == math.huge or safeRange == -math.huge or safeRange <= 0 then',
              'Range = safeRange',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('PvE damage range contract missing: ' + ', '.join(missing))
          print('PvE damage range contract OK')
          PY
