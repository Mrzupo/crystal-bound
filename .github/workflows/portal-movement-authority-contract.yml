name: Portal Movement Authority Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server portal movement integration
        shell: python
        run: |
          from pathlib import Path

          guard = Path('src/ServerScriptService/StatusSpeedGuardV2.server.lua').read_text(encoding='utf-8')
          bootstrap = Path('src/ServerScriptService/Bootstrap.server.lua').read_text(encoding='utf-8')
          world_theme = Path('src/ServerScriptService/WorldTheme.server.lua').read_text(encoding='utf-8')
          movement = Path('src/ReplicatedStorage/Config/MovementConfig.lua').read_text(encoding='utf-8')

          required_guard = [
              'PortalMovementGraceUntil',
              'PortalExpectedDestination',
              'PORTAL_ARRIVAL_TOLERANCE',
              'local function isValidPortalArrival(player, root, now)',
              'local function consumePortalArrival(player)',
          ]
          missing = [marker for marker in required_guard if marker not in guard]
          if missing:
              raise SystemExit('missing portal movement guard markers: ' + ', '.join(missing))

          required_theme = [
              'local portalCandidates = setmetatable({}, { __mode = "k" })',
              'local portalCooldowns = setmetatable({}, { __mode = "k" })',
              'local lastPositions = setmetatable({}, { __mode = "k" })',
              'local portalCooldownDuration = 1',
              'local function rememberPosition(player)',
              'local function tryArmArrival(player, character, destination, beforePosition, requiredLevel)',
              'local displacement = (root.Position - beforePosition).Magnitude',
              'local snapshot = lastPositions[player]',
              'portalCandidates[player] = {',
              'portalCooldowns[player] then return end',
              'task.defer(function()',
              'player:SetAttribute("PortalMovementGraceUntil", os.clock() + portalGrace)',
          ]
          missing = [marker for marker in required_theme if marker not in world_theme]
          if missing:
              raise SystemExit('WorldTheme portal arrival/cooldown/snapshot guard missing: ' + ', '.join(missing))

          for marker in (
              'TidePortal = { Destination = Vector3.new(120, 4, 0)',
              'StarterPortal = { Destination = Vector3.new(48, 4, 0)',
              'WindPortal = { Destination = Vector3.new(280, 4, 0)',
              'TideReturnPortal = { Destination = Vector3.new(210, 4, 0)',
              'AncientPortal = { Destination = Vector3.new(440, 4, 0)',
              'WindReturnPortal = { Destination = Vector3.new(380, 4, 0)',
          ):
              if marker not in world_theme:
                  raise SystemExit('portal destination missing from WorldTheme authority: ' + marker)

          for marker in (
              'createPortal(starterIsland,"TidePortal",Vector3.new(52,5,0),Vector3.new(120,4,0)',
              'createPortal(tideIsland,"StarterPortal",Vector3.new(118,5,0),Vector3.new(48,4,0',
              'createPortal(tideIsland,"WindPortal",Vector3.new(218,5,0),Vector3.new(280,4,0',
              'createPortal(windIsland,"TideReturnPortal",Vector3.new(278,5,0),Vector3.new(210,4,0',
              'createPortal(windIsland,"AncientPortal",Vector3.new(390,5,0),Vector3.new(440,4,0',
              'createPortal(ancientIsland,"WindReturnPortal",Vector3.new(440,5,50),Vector3.new(380,4,0',
          ):
              if marker not in bootstrap:
                  raise SystemExit('Bootstrap portal definition drifted: ' + marker)

          if 'WorldConfig.Islands.TIDE.Level' not in world_theme or 'WorldConfig.Islands.WIND.Level' not in world_theme or 'WorldConfig.Islands.ANCIENT.Level' not in world_theme:
              raise SystemExit('WorldTheme portal authority must consume canonical WorldConfig level gates')
          if 'root.CFrame=CFrame.new(destination)' not in bootstrap and 'root.CFrame = CFrame.new(destination)' not in bootstrap:
              raise SystemExit('Bootstrap portal teleport path is missing')
          if 'GraceDuration =' not in movement or 'PortalArrivalTolerance =' not in movement:
              raise SystemExit('MovementConfig must expose canonical portal movement bounds')

          print('Portal movement authority, cooldown parity, pre-touch snapshot and observed-arrival grace validated.')
