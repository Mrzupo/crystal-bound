name: Session Autosave Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate periodic autosave ownership
        shell: python
        run: |
          from pathlib import Path

          heartbeat = Path("src/ServerScriptService/SessionHeartbeat.server.lua").read_text(encoding="utf-8")
          player_service = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          if "AUTOSAVE_INTERVAL = 60" not in heartbeat:
              raise SystemExit("SessionHeartbeat must define a bounded periodic autosave interval")
          if "PlayerService.Save(player)" not in heartbeat:
              raise SystemExit("SessionHeartbeat must route autosaves through PlayerService.Save")
          if "function PlayerService.Save(player)" not in player_service:
              raise SystemExit("PlayerService must own autosave operations")
          if "if not acquireOperation(player) then return false end" not in player_service:
              raise SystemExit("PlayerService.Save must serialize autosave with other profile operations")
          print("Session autosave ownership contract validated.")
