name: Session Autosave Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/session-autosave-contract-clean"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate periodic autosave ownership
        shell: python
        run: |
          from pathlib import Path

          heartbeat = Path("src/ServerScriptService/SessionHeartbeat.server.lua").read_text(encoding="utf-8")
          player_service = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          if "AUTOSAVE_INTERVAL = 60" not in heartbeat:
              raise SystemExit("SessionHeartbeat must define a bounded periodic autosave interval")
          if "PlayerService.Save(player)" not in heartbeat:
              raise SystemExit("SessionHeartbeat must route autosaves through PlayerService.Save")
          if "function PlayerService.Save(player)" not in player_service:
              raise SystemExit("PlayerService must own autosave operations")
          if "function saveConsistently(player, profile)" not in player_service:
              raise SystemExit("PlayerService must expose the revision-settled save path")
          if "local snapshotRevision = PlayerService.ProfileRevisions[player] or 0" not in player_service:
              raise SystemExit("PlayerService.saveConsistently must snapshot the profile revision before persistence")
          if "if (PlayerService.ProfileRevisions[player] or 0) == snapshotRevision then return true end" not in player_service:
              raise SystemExit("PlayerService.saveConsistently must accept only an unchanged revision")
          if "warn((\"Crystal Bound: profile changed during all %d save-settle passes for %s; retry required.\")" not in player_service:
              raise SystemExit("PlayerService.saveConsistently must report an unsettled final save rather than success")

          start = player_service.index("local function saveConsistently(player, profile)")
          end = player_service.index("function PlayerService.RefreshSession(player)", start)
          settle_block = player_service[start:end]
          if "return false" not in settle_block:
              raise SystemExit("PlayerService.saveConsistently must fail after exhausting settle attempts")
          if "SAVE_SETTLE_ATTEMPTS =" not in player_service:
              raise SystemExit("PlayerService.saveConsistently must retain a bounded settle-attempt budget")
          if "if not acquireOperation(player) then return false end" not in player_service:
              raise SystemExit("PlayerService.Save must serialize autosave with other profile operations")
          print("Session autosave ownership, revision-settle detection and final failure semantics validated.")
