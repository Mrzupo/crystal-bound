name: Crystal Bound Ability Boundary Audit

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-crystal-ability-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server ability service boundary
        shell: python
        run: |
          from pathlib import Path

          combat = Path("src/ServerScriptService/Services/CombatService.lua").read_text(encoding="utf-8")
          ability = Path("src/ServerScriptService/Services/CrystalAbilityService.lua")
          ability_text = ability.read_text(encoding="utf-8") if ability.is_file() else ""
          mastery = Path("src/ReplicatedStorage/Modules/CrystalMastery.lua").read_text(encoding="utf-8")
          bootstrap = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")
          rojo = Path("default.project.json").read_text(encoding="utf-8")

          problems = []
          if not ability.is_file():
              problems.append("CrystalAbilityService.lua is missing")
          if "CrystalAbilityService" not in combat:
              problems.append("CombatService must depend on CrystalAbilityService")
          if "function CrystalAbilityService.Execute" not in ability_text:
              problems.append("CrystalAbilityService.Execute is missing")
          if "function CrystalMastery.Upgrade" not in mastery:
              problems.append("CrystalMastery.Upgrade is missing")
          if "CrystalMastery.Upgrade(profile, crystalId)" not in bootstrap:
              problems.append("Bootstrap must use CrystalMastery.Upgrade")
          if "mastery.Level += 1" in bootstrap:
              problems.append("Bootstrap must not mutate mastery level directly")
          if "CrystalAbilityService" not in rojo:
              problems.append("CrystalAbilityService is missing from default.project.json")
          if "if crystalId == \"TIDE\"" in combat or "elseif crystalId == \"GALE\"" in combat:
              problems.append("Crystal-specific special branches must live in CrystalAbilityService")

          if problems:
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)

          print("Crystal ability/mastery service boundary validated.")
