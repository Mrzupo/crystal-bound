name: Player Data Reconciliation Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate persisted player-data normalization boundaries
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/ReplicatedStorage/Modules/PlayerData.lua').read_text(encoding='utf-8')

          required = [
              'local function CrystalSystemExists(value)',
              'data.Level = clampInt(data.Level, 1, XPConfig.MaxLevel, defaults.Level)',
              'data.Experience = clampInt(data.Experience, 0, XPConfig.MaxExperience, defaults.Experience)',
              'data.Money = clampInt(data.Money, EconomyConfig.MinMoney, EconomyConfig.MaxMoney, defaults.Money)',
              'local inventory = {}',
              'InventoryConfig.GetItemConfig(itemId)',
              'data.ActiveQuests = normalizeList(data.ActiveQuests, isQuestId)',
              'data.CompletedQuests = normalizeList(data.CompletedQuests, isQuestId)',
              'data.QuestProgress = normalizedProgress',
              'data.UnlockedIslands = normalizeList(data.UnlockedIslands, isIslandId)',
              'local function isBountyEnemy(value)',
              'for _, definition in ipairs(DailyBountyConfig.Goals) do',
              'data.DailyBounty.Claimed = data.DailyBounty.Claimed == true',
              'if not isBountyEnemy(data.DailyBounty.EnemyType) then',
              'data.SessionId = type(data.SessionId) == "string" and data.SessionId or ""',
              'data.SessionLockedAt = clampInt(data.SessionLockedAt, 0, 4102444800, 0)',
              'data.Version = defaults.Version',
              'data.LegacyVersion = oldVersion',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('PlayerData reconciliation boundary missing: ' + ', '.join(missing))

          if 'if not completedSet[questId] and #filteredActive == 0' not in text:
              raise SystemExit('Active quest reconciliation must prevent completed/duplicate active state')
          if 'data.DailyBounty.RewardMoney = clampInt(data.DailyBounty.RewardMoney, 0, EconomyConfig.MaxMoney' not in text:
              raise SystemExit('Daily bounty reward must be bounded by EconomyConfig.MaxMoney')
          if 'jobId ~= "" and token ~= "" and sessionTimestamp > 0' not in text:
              raise SystemExit('Malformed SessionLock data must be rejected during reconciliation')

          print('Persisted player-data reconciliation contract validated.')
