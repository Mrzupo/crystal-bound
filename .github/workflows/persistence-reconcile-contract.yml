name: Persistence Reconcile Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate profile reconciliation boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/ReplicatedStorage/Modules/PlayerData.lua').read_text(encoding='utf-8')
          required = [
              'data.Level = clampInt(data.Level, 1, XPConfig.MaxLevel',
              'data.Money = clampInt(data.Money, EconomyConfig.MinMoney, EconomyConfig.MaxMoney',
              'data.CrystalMastery = normalizedMastery',
              'data.Inventory = normalizeInventory(data.Inventory)',
              'data.ActiveQuests = filteredActive',
              'data.UnlockedIslands = normalizeList(data.UnlockedIslands',
              'data.SessionLock = { JobId = jobId, Timestamp = sessionTimestamp }',
              'data.Version = defaults.Version',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('missing persistence reconcile contract: ' + ', '.join(missing))

          crystal_required = [
              'local function hasCompleteCrystalConfig(value)',
              'required >= 1 and required % 1 == 0',
              'type(CrystalConfig.Definitions[value]) == "table"',
              'type(CrystalConfig.BasicAttack[value]) == "table"',
              'type(CrystalConfig.Abilities[value]) == "table"',
              'type(CrystalConfig.Passives[value]) == "table"',
              'data.Crystals.Owned = normalizeList(data.Crystals.Owned, hasCompleteCrystalConfig)',
              'if not hasCompleteCrystalConfig(data.Crystals.Equipped)',
              'for crystalId in pairs(CrystalConfig.UnlockLevels) do',
              'if hasCompleteCrystalConfig(crystalId) then',
              'normalizedMastery[crystalId] = mastery',
          ]
          missing = [marker for marker in crystal_required if marker not in text]
          if missing:
              raise SystemExit('missing persisted complete Crystal normalization contract: ' + ', '.join(missing))
          print('Persistence reconcile and complete Crystal normalization contracts validated.')
          PY
