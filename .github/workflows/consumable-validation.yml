name: Consumable Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Health Potion server contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/ServerScriptService/UseItemRemote.server.lua').read_text(encoding='utf-8')
          required = [
              'local potion = ConsumableConfig.HealthPotion',
              'if type(itemId) ~= "string" or itemId ~= potion.ItemId then return end',
              'USE_INTERVAL = 0.2',
              'if player:GetAttribute("ProfileLoaded") ~= true then return end',
              'InventoryService.HasItem(profile, itemId, 1)',
              'humanoid.Health >= humanoid.MaxHealth',
              'InventoryService.RemoveItem(profile, itemId, 1)',
              'PlayerService.Heal(player, healAmount)',
              'if applied <= 0 then',
              'InventoryService.AddItem(profile, itemId, 1)',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('missing consumable guard: ' + ', '.join(missing))
          if re.search(r'\.(?:Health|MaxHealth)\s*=', text):
              raise SystemExit('UseItemRemote must not directly mutate Humanoid Health/MaxHealth')
          if 'math.clamp(healAmount, 0.1, 1000)' not in text:
              raise SystemExit('Health Potion heal amount must remain runtime bounded')
          print('Health Potion server contract validated with canonical PlayerService healing and loaded-profile readiness.')
          PY