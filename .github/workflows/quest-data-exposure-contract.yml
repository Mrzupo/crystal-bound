name: Quest Data Exposure Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate detached quest-data snapshots
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")
          block = text.split("remotes.GetQuestData.OnServerInvoke", 1)[1].split("local function ensureWorldFolders", 1)[0]
          required = [
              "Active = profile.ActiveQuests",
              "Completed = profile.CompletedQuests",
              "Progress = profile.QuestProgress",
              "Definitions = QuestSystem.GetDefinitions()",
              "return deepCopy({",
          ]
          forbidden = ["SessionLock", "SessionId", "Operations"]
          missing = [marker for marker in required if marker not in block]
          leaked = [marker for marker in forbidden if marker in block]
          if missing:
              raise SystemExit("GetQuestData snapshot contract missing: " + ", ".join(missing))
          if leaked:
              raise SystemExit("GetQuestData exposes internal profile state: " + ", ".join(leaked))
          print("Quest data exposure contract validated.")
