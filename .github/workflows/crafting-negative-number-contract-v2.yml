name: Crafting Negative Number Contract V2

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/crafting-negative-contract-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signed CraftingConfig numeric coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/CraftingConfig.lua").read_text(encoding="utf-8")
          outputs = [float(value) for value in re.findall(r"\bAmount\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)]
          if not outputs or any(value <= 0 or value % 1 != 0 for value in outputs):
              raise SystemExit("Crafting recipe output Amount values must be positive integers")

          input_sections = re.findall(r"Inputs\s*=\s*\{(.*?)\}", config, re.S)
          input_amounts = []
          for section in input_sections:
              input_amounts.extend(float(value) for value in re.findall(r"[A-Za-z0-9_]+\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", section))
          if not input_amounts or any(value <= 0 or value % 1 != 0 for value in input_amounts):
              raise SystemExit("Crafting recipe input amounts must be positive integers")

          max_per = re.search(r"MaxPerCraft\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)
          if not max_per or not 1 <= float(max_per.group(1)) <= 100:
              raise SystemExit("Crafting MaxPerCraft must be an integer within 1..100")
          if float(max_per.group(1)) % 1 != 0:
              raise SystemExit("Crafting MaxPerCraft must be an integer")

          print("CraftingConfig signed-number coverage rejects negative and fractional recipe quantities instead of skipping them.")
