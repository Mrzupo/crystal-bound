name: Player Load Rejoin Race Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate per-UserId load generation, session token and shutdown gate
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          store = Path("src/ReplicatedStorage/Modules/SafeProfileStore.lua").read_text(encoding="utf-8")
          bootstrap = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")
          required = (
              "LoadingByUserId = {}",
              "ShuttingDown = false",
              "function PlayerService.BeginShutdown()",
              "function PlayerService.GetPendingLoadCount()",
              "local loadToken = {}",
              "PlayerService.LoadingByUserId[userId] = loadToken",
              "local function isCurrentLoad()",
              "if not isCurrentLoad() then",
              "Superseded profile load",
              "Superseded profile initialization",
              "if PlayerService.ShuttingDown then return nil, \"Server is shutting down\" end",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("Player load rejoin/shutdown contract missing: " + ", ".join(missing))

          if text.count("local released = SafeProfileStore.Release(player)") < 3:
              raise SystemExit("Every successful-but-superseded load exit must release its own session lock")
          if "LoadingByUserId[userId] = nil" not in text:
              raise SystemExit("Player load lifecycle must clear per-UserId load state")

          for marker in (
              'local sessionTokens = setmetatable({}, { __mode = "k" })',
              'local function getSessionToken(player)',
              'local sameSession = lock and lock.JobId == SESSION_ID and lock.Token == token',
              'lock.Token ~= token',
              'Token = token',
          ):
              if marker not in store:
                  raise SystemExit("SafeProfileStore same-server rejoin token guard missing: " + marker)

          if 'local function loadPlayer(player)' not in bootstrap or 'for _, player in ipairs(Players:GetPlayers()) do' not in bootstrap:
              raise SystemExit("Bootstrap must retain one canonical startup loader plus existing-player catch-up")
          if 'PlayerLoadCatchup' in bootstrap:
              raise SystemExit("Redundant PlayerLoadCatchup loader must remain removed")

          print("Per-UserId player load generation, superseded-lock release, same-server session token and shutdown contract validated.")
