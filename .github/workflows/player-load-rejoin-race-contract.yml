name: Player Load Rejoin Race Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate per-UserId in-flight load guard, exact release tokens and shutdown gate
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          store = Path("src/ReplicatedStorage/Modules/SafeProfileStore.lua").read_text(encoding="utf-8")
          bootstrap = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")

          required = (
              "LoadingByUserId = {},",
              "ShuttingDown = false,",
              "local loadToken = {}",
              "PlayerService.LoadingByUserId[userId] = loadToken",
              "local function isCurrentLoad()",
              "local function clearCurrentLoad()",
              "if PlayerService.LoadingByUserId[userId] then",
              "return nil, \"Profile load already in progress\"",
              "local function releaseLoadedToken()",
              "profile and type(profile.SessionLock) == \"table\" and profile.SessionLock.Token",
              "SafeProfileStore.Release(player, token)",
              "Superseded profile load",
              "Superseded profile initialization",
              "if PlayerService.ShuttingDown then return nil, \"Server is shutting down\" end",
              "local loadSuccess, profile, reason = xpcall(function()",
              "return SafeProfileStore.Load(player)",
              "if not loadSuccess then",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("Player load rejoin/shutdown contract missing: " + ", ".join(missing))

          if text.count("local released = releaseLoadedToken()") < 5:
              raise SystemExit("All post-load abort paths must release the specific profile-load token")
          if text.count("clearCurrentLoad()") < 5:
              raise SystemExit("All normal and exceptional in-flight load exits must clear LoadingByUserId")
          if "LoadingByUserId[userId] = nil" not in text:
              raise SystemExit("Player load lifecycle must clear per-UserId load state")

          if "local sessionTokens = setmetatable({}, { __mode = \"k\" })" not in store:
              raise SystemExit("SafeProfileStore must keep active per-Player session tokens weak-keyed")
          for marker in (
              'local function getSessionToken(player)',
              'local function newLoadToken()',
              'local token = newLoadToken()',
              'sessionTokens[player] = token',
              'function SafeProfileStore.Release(player, expectedToken)',
              'local token = expectedToken or getSessionToken(player)',
              'lock.Token == token',
          ):
              if marker not in store:
                  raise SystemExit("SafeProfileStore session-token guard missing: " + marker)

          for marker in (
              'local reconcileOk, profileOrError = xpcall(function()',
              'return PlayerData.Reconcile(result)',
              'if not reconcileOk or type(profileOrError) ~= "table" then',
              'local released = SafeProfileStore.Release(player, token)',
          ):
              if marker not in store:
                  raise SystemExit("SafeProfileStore load/reconcile ownership marker missing: " + marker)

          if 'local loadingPlayers = setmetatable({}, { __mode = "k" })' not in bootstrap:
              raise SystemExit("Bootstrap must maintain per-Player startup-load deduplication state")
          if 'if loadingPlayers[player] then return false end' not in bootstrap:
              raise SystemExit("Bootstrap must reject duplicate startup loads for the same Player instance")
          if 'Players.PlayerAdded:Connect(function(player)' not in bootstrap:
              raise SystemExit("Bootstrap must keep one canonical PlayerAdded load owner")

          if "Profile load already in progress" not in text:
              raise SystemExit("A second concurrent load for the same UserId must be explicitly rejected, not superseded")

          print("Per-UserId in-flight load rejection, exception-safe cleanup, exact load-token release, session-token isolation, load-side reconciliation and startup deduplication validated.")
