name: Quest Completion Ownership

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure QuestSystem completion remains service-owned
        shell: python
        run: |
          from pathlib import Path

          root = Path("src")
          owners = []
          for path in root.rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if "QuestSystem.Complete(" in text:
                  owners.append(str(path))
          expected = ["src/ServerScriptService/Services/QuestService.lua"]
          if owners != expected:
              raise SystemExit(f"QuestSystem.Complete must have exactly one server owner; found {owners}")

          service = (root / "ServerScriptService/Services/QuestService.lua").read_text(encoding="utf-8")
          for marker in (
              "QuestSystem.IsActive(profile, questId)",
              "QuestSystem.Complete(profile, questId)",
              "XPService.AddXP(profile, rewardXP)",
              "EconomyService.AddMoney(profile, rewardMoney)",
              "FIRST_FIGHT = true",
              "GUARDIAN_TRIAL = true",
          ):
              if marker not in service:
                  raise SystemExit(f"QuestService completion owner missing {marker}")

          special_owners = {
              "FIRST_FIGHT": root / "ServerScriptService/Services/CombatService.lua",
              "GUARDIAN_TRIAL": root / "ServerScriptService/Services/BossService.lua",
          }
          for quest_id, owner_path in special_owners.items():
              owner_text = owner_path.read_text(encoding="utf-8")
              if f'"{quest_id}"' not in owner_text:
                  raise SystemExit(f"{quest_id} must retain its canonical server trigger owner: {owner_path}")

          for path in root.rglob("*.lua"):
              if path in special_owners.values() or path == root / "ServerScriptService/Services/QuestService.lua":
                  continue
              text = path.read_text(encoding="utf-8")
              for quest_id in special_owners:
                  if f'"{quest_id}"' in text and "QuestService.Complete" in text:
                      raise SystemExit(f"Unexpected server-triggered quest completion owner for {quest_id}: {path}")

          print("Quest completion ownership and server-triggered special quest ownership validated.")
