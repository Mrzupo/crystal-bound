name: AI Path Input Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-ai-path-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AI path destination guards
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ServerScriptService/Services/AIPathService.lua")
          text = path.read_text(encoding="utf-8")

          required = [
              'typeof(destination) ~= "Vector3"',
              'function keyFor(goal)',
              'math.floor(goal.X / 4)',
              'math.floor(goal.Y / 4)',
              'math.floor(goal.Z / 4)',
          ]

          missing = [marker for marker in required if marker not in text]
          if missing:
              for marker in missing:
                  print("Missing AI path marker:", marker)
              raise SystemExit(1)

          # Require an explicit finite-component guard before keyFor().
          function_start = text.index("function AIPathService.GetNextDirection")
          key_call = text.index("local key = keyFor(destination)", function_start)
          prefix = text[function_start:key_call]
          finite_markers = [
              "math.huge",
              "destination.X",
              "destination.Y",
              "destination.Z",
          ]
          if not all(marker in prefix for marker in finite_markers):
              raise SystemExit(
                  "AIPathService.GetNextDirection must validate destination components before keyFor(destination)."
              )

          print("AI path destination validation contract passed.")
