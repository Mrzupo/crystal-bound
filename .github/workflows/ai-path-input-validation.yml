name: AI Path Input Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-ai-path-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AI path destination guard baseline
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ServerScriptService/Services/AIPathService.lua")
          text = path.read_text(encoding="utf-8")

          required = [
              'typeof(destination) ~= "Vector3"',
              'function keyFor(goal)',
              'math.floor(goal.X / 4)',
              'math.floor(goal.Y / 4)',
              'math.floor(goal.Z / 4)',
          ]

          missing = [marker for marker in required if marker not in text]
          if missing:
              for marker in missing:
                  print("Missing AI path marker:", marker)
              raise SystemExit(1)

          # Keep this contract aligned with the current implementation.
          # A finite-component guard is a future hardening target, not a
          # claim about current runtime behavior.
          print("AI path input baseline validated.")
