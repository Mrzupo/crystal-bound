name: AI Path Input Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-ai-path-input:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate AI path destination guard, cache lifecycle and rate limit
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ServerScriptService/Services/AIPathService.lua")
          text = path.read_text(encoding="utf-8")

          required = [
              'return type(value) == "number" and value == value and value ~= math.huge and value ~= -math.huge',
              'function isFiniteVector3(value)',
              'finiteNumber(value.X)',
              'finiteNumber(value.Y)',
              'finiteNumber(value.Z)',
              'if not isLiveModel(model) or not isFiniteVector3(destination) then return nil end',
              'function keyFor(goal)',
              'math.floor(goal.X / 4)',
              'math.floor(goal.Y / 4)',
              'math.floor(goal.Z / 4)',
              'local cache = setmetatable({}, { __mode = "k" })',
              'local RECOMPUTE_INTERVAL = 0.5',
              'function isLiveModel(model)',
              'if not isLiveModel(model) then',
              'path:ComputeAsync(rootPosition, destination)',
              'cache[model] = nil',
              'return isLiveModel(model) and (waypoint.Position - rootPosition) or nil',
              'function AIPathService.Clear(model)',
          ]

          missing = [marker for marker in required if marker not in text]
          if missing:
              for marker in missing:
                  print("Missing AI path marker:", marker)
              raise SystemExit(1)

          print("AI path finite-input, live-model, weak-cache, post-yield race, rate-limit and cleanup contract passed.")
