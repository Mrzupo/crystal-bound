name: AI Path Input Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-ai-path-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AI path destination guard, cache lifecycle and rate limit
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ServerScriptService/Services/AIPathService.lua")
          text = path.read_text(encoding="utf-8")

          required = [
              'typeof(value) == "number"',
              'function isFiniteVector3(value)',
              'finiteNumber(value.X)',
              'finiteNumber(value.Y)',
              'finiteNumber(value.Z)',
              'typeof(destination) ~= "Vector3"',
              'function keyFor(goal)',
              'math.floor(goal.X / 4)',
              'math.floor(goal.Y / 4)',
              'math.floor(goal.Z / 4)',
              'local cache = setmetatable({}, { __mode = "k" })',
              'local RECOMPUTE_INTERVAL = 0.5',
              'function AIPathService.Clear(model)',
              'cache[model] = nil',
          ]

          missing = [marker for marker in required if marker not in text]
          if missing:
              for marker in missing:
                  print("Missing AI path marker:", marker)
              raise SystemExit(1)

          print("AI path finite-input, weak-cache, rate-limit and cleanup contract passed.")
