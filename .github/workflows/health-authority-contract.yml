name: Health Authority Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-health-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single server Humanoid health mutation owner
        shell: python
        run: |
          import re
          from pathlib import Path

          health_write = re.compile(r'\.(?:Health|MaxHealth)\s*=')
          client_writers = []
          server_writers = []
          for path in Path("src/StarterPlayer").rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if health_write.search(text):
                  client_writers.append(str(path))
          for path in Path("src/ServerScriptService").rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if health_write.search(text):
                  server_writers.append(str(path))

          if client_writers:
              raise SystemExit('Client scripts must not directly write Humanoid Health/MaxHealth: ' + ', '.join(client_writers))
          allowed_owner = 'src/ServerScriptService/Services/PlayerService.lua'
          unexpected = [path for path in server_writers if path != allowed_owner]
          if unexpected:
              raise SystemExit('Direct server Health/MaxHealth writes escaped PlayerService: ' + ', '.join(unexpected))

          player_service = Path(allowed_owner).read_text(encoding="utf-8")
          if "function PlayerService.Heal(player, amount)" not in player_service:
              raise SystemExit("PlayerService must expose the canonical server heal path")
          if "humanoid.MaxHealth =" not in player_service or "humanoid.Health =" not in player_service:
              raise SystemExit("PlayerService must remain the canonical server owner for Health/MaxHealth writes")
          ability = Path("src/ServerScriptService/Services/CrystalAbilityService.lua").read_text(encoding="utf-8")
          if "PlayerService.Heal(player, healAmount)" not in ability:
              raise SystemExit("Tide healing must route through PlayerService.Heal")
          print('Health authority contract validated: PlayerService is the sole direct server Health/MaxHealth writer.')
