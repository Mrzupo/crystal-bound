name: Health Authority Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-health-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate player health authority and NPC initialization boundaries
        shell: python
        run: |
          import re
          from pathlib import Path

          health_write = re.compile(r'\.(?:Health|MaxHealth)\s*=')
          client_writers = []
          server_writers = []
          for path in Path("src/StarterPlayer").rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if health_write.search(text):
                  client_writers.append(str(path))
          for path in Path("src/ServerScriptService").rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if health_write.search(text):
                  server_writers.append(str(path))

          if client_writers:
              raise SystemExit('Client scripts must not directly write Humanoid Health/MaxHealth: ' + ', '.join(client_writers))
          allowed_server_writers = {
              'src/ServerScriptService/Services/PlayerService.lua',
              'src/ServerScriptService/Services/NPCService.lua',
              'src/ServerScriptService/Services/BossService.lua',
          }
          unexpected = [path for path in server_writers if path not in allowed_server_writers]
          if unexpected:
              raise SystemExit('Direct server Health/MaxHealth writes escaped canonical owners: ' + ', '.join(unexpected))

          player_service = Path('src/ServerScriptService/Services/PlayerService.lua').read_text(encoding='utf-8')
          if 'function PlayerService.Heal(player, amount)' not in player_service:
              raise SystemExit('PlayerService must expose the canonical player heal path')
          if 'humanoid.MaxHealth =' not in player_service or 'humanoid.Health =' not in player_service:
              raise SystemExit('PlayerService must remain a direct player Health/MaxHealth owner')

          for relative, init_markers in {
              'src/ServerScriptService/Services/NPCService.lua': ('humanoid.MaxHealth = health', 'humanoid.Health = health'),
              'src/ServerScriptService/Services/BossService.lua': ('humanoid.MaxHealth = health', 'humanoid.Health = health'),
          }.items():
              text = Path(relative).read_text(encoding='utf-8')
              if any(marker not in text for marker in init_markers):
                  raise SystemExit(f'{relative} must initialize NPC health through the bounded health variable')
              if len(health_write.findall(text)) != 2:
                  raise SystemExit(f'{relative} must not gain additional runtime Health/MaxHealth writes outside spawn initialization')

          ability = Path('src/ServerScriptService/Services/CrystalAbilityService.lua').read_text(encoding='utf-8')
          if 'PlayerService.Heal(player, healAmount)' not in ability:
              raise SystemExit('Tide healing must route through PlayerService.Heal')
          if health_write.search(ability):
              raise SystemExit('CrystalAbilityService must not directly write Humanoid Health/MaxHealth')

          consumable = Path('src/ServerScriptService/UseItemRemote.server.lua').read_text(encoding='utf-8')
          if 'PlayerService.Heal(player, healAmount)' not in consumable:
              raise SystemExit('Consumable healing must route through PlayerService.Heal')
          if health_write.search(consumable):
              raise SystemExit('UseItemRemote must not directly write Humanoid Health/MaxHealth')

          print('Health authority validated: PlayerService owns player health changes; NPCService/BossService only initialize NPC health.')
