name: Crystal Bound Combat Presentation Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-combat-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate combat presentation contract
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          root = Path(".")
          project = json.loads((root / "default.project.json").read_text(encoding="utf-8"))
          tree = project["tree"]
          remotes = tree["ReplicatedStorage"]["Remotes"]
          server = tree["ServerScriptService"]
          starter = tree["StarterPlayer"]["StarterPlayerScripts"]

          problems = []

          if remotes.get("CombatFeedback", {}).get("$className") != "RemoteEvent":
              problems.append("CombatFeedback must be a RemoteEvent in default.project.json")
          if server.get("CombatFeedbackRemote", {}).get("$path") != "src/ServerScriptService/CombatFeedbackRemote.server.lua":
              problems.append("CombatFeedbackRemote server bootstrap is not mapped")
          if starter.get("CombatPresentation", {}).get("$path") != "src/StarterPlayer/StarterPlayerScripts/CombatPresentation.client.lua":
              problems.append("CombatPresentation mapping is incorrect")

          required_files = [
              "src/ServerScriptService/Services/CombatService.lua",
              "src/ServerScriptService/CombatFeedbackRemote.server.lua",
              "src/StarterPlayer/StarterPlayerScripts/CombatPresentation.client.lua",
              "src/StarterPlayer/StarterPlayerScripts/CrystalAnimationController.client.lua",
              "src/StarterPlayer/StarterPlayerScripts/CrystalVFXController.client.lua",
              "src/ReplicatedStorage/Config/CrystalAnimationConfig.lua",
          ]
          for relative in required_files:
              if not (root / relative).is_file():
                  problems.append(f"Missing combat presentation file: {relative}")

          config = (root / "src/ReplicatedStorage/Config/CrystalAnimationConfig.lua").read_text(encoding="utf-8")
          expected_assets = {
              "EMBER": {"Basic": "EMBER_Basic", "Ability": "EMBER_FlameBurst"},
              "TIDE": {"Basic": "TIDE_Basic", "Ability": "TIDE_TidalPulse"},
              "GALE": {"Basic": "GALE_Basic", "Ability": "GALE_GaleStrike"},
          }
          asset_names = []
          sound_names = []
          for crystal, actions in expected_assets.items():
              if not re.search(rf"\b{crystal}\s*=\s*\{{", config):
                  problems.append(f"Missing presentation config for {crystal}")
              for action, asset_name in actions.items():
                  block = re.search(rf"{action}\s*=\s*\{{(.*?)\n\s*\},", config, re.DOTALL)
                  if not block:
                      problems.append(f"Missing {crystal} {action} presentation block")
                      continue
                  body = block.group(1)
                  if f'AssetName = "{asset_name}"' not in body:
                      problems.append(f"Unexpected {crystal} {action} AssetName")
                  if f'SoundAssetName = "{asset_name}"' not in body:
                      problems.append(f"Unexpected {crystal} {action} SoundAssetName")
                  asset_names.append(asset_name)
                  sound_names.append(asset_name)

          if len(asset_names) != len(set(asset_names)):
              problems.append("Animation AssetName values must be unique")
          if len(sound_names) != len(set(sound_names)):
              problems.append("SoundAssetName values must be unique")

          animations_path = tree["ReplicatedStorage"]["Assets"]["Animations"]
          sounds_path = tree["ReplicatedStorage"]["Assets"]["Sounds"]
          if not isinstance(animations_path, dict) or not isinstance(sounds_path, dict):
              problems.append("ReplicatedStorage.Assets.Animations and Sounds must remain mapped folders")

          combat_service = (root / "src/ServerScriptService/Services/CombatService.lua").read_text(encoding="utf-8")
          presentation = (root / "src/StarterPlayer/StarterPlayerScripts/CombatPresentation.client.lua").read_text(encoding="utf-8")
          animation = (root / "src/StarterPlayer/StarterPlayerScripts/CrystalAnimationController.client.lua").read_text(encoding="utf-8")
          vfx = (root / "src/StarterPlayer/StarterPlayerScripts/CrystalVFXController.client.lua").read_text(encoding="utf-8")

          if "CombatFeedback" not in combat_service:
              problems.append("CombatService must publish confirmed CombatFeedback")
          if "CombatRequest" in presentation:
              problems.append("CombatPresentation must not submit CombatRequest")
          if ":TakeDamage(" in presentation or ":TakeDamage(" in animation or ":TakeDamage(" in vfx:
              problems.append("Client combat presentation must never call TakeDamage")
          if "LastHitCritical" in combat_service or "LastHitCrystal" in combat_service or "LastAttackerUserId" in combat_service:
              problems.append("CombatService must not use mutable NPC LastHit presentation attributes")

          if problems:
              print("Combat presentation contract problems:")
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)

          print("Combat presentation contract validated.")
