name: Daily Bounty Config Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-bounty-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared daily bounty config
        shell: python
        run: |
          import re
          from pathlib import Path
          config = Path("src/ReplicatedStorage/Config/DailyBountyConfig.lua").read_text(encoding="utf-8")
          economy = Path("src/ReplicatedStorage/Config/EconomyConfig.lua").read_text(encoding="utf-8")
          service = Path("src/ServerScriptService/Services/DailyBountyService.lua").read_text(encoding="utf-8")
          profile = Path("src/ReplicatedStorage/Modules/PlayerData.lua").read_text(encoding="utf-8")
          for marker in ("Goals", "Emberling", "Tidecrawler", "Galewisp", "CrystalBat", "AncientGolem"):
              if marker not in config:
                  raise SystemExit(f"DailyBountyConfig missing {marker}")
          rewards = [int(value) for value in re.findall(r"RewardMoney\s*=\s*(\d+)", config)]
          goals = [int(value) for value in re.findall(r"Goal\s*=\s*(\d+)", config)]
          max_money_match = re.search(r"MaxMoney\s*=\s*(\d+)", economy)
          max_money = int(max_money_match.group(1)) if max_money_match else 1000000000
          if not rewards or any(value <= 0 for value in rewards):
              raise SystemExit("Daily bounty rewards must be positive")
          if any(value > max_money for value in rewards):
              raise SystemExit("Daily bounty reward exceeds EconomyConfig.MaxMoney")
          if not goals or any(value <= 0 or value > 100 for value in goals):
              raise SystemExit("Daily bounty goals must be within 1..100")
          if "BountyConfig" not in service:
              raise SystemExit("DailyBountyService must consume shared BountyConfig")
          if "DailyBountyConfig" not in profile:
              raise SystemExit("PlayerData must consume shared DailyBountyConfig")

      - name: Validate bounty service canonicalizes persisted reward fields
        shell: python
        run: |
          from pathlib import Path
          service = Path("src/ServerScriptService/Services/DailyBountyService.lua").read_text(encoding="utf-8")
          required = (
              "local function findDefinition(enemyType)",
              "definition = findDefinition(profile.DailyBounty.EnemyType)",
              "profile.DailyBounty.Goal =",
              "profile.DailyBounty.RewardMoney =",
              "definition.RewardMoney",
          )
          for marker in required:
              if marker not in service:
                  raise SystemExit(f"DailyBountyService missing canonicalization marker: {marker}")
          print("Daily bounty persistence canonicalization validated.")
