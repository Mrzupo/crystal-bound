name: Player Progression Write Ownership

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Level and Experience mutation owners
        shell: python
        run: |
          from pathlib import Path

          root = Path("src")
          allowed = {
              "ServerScriptService/Services/XPService.lua",
              "ReplicatedStorage/Modules/PlayerData.lua",
          }
          tokens = (
              "profile.Level =",
              "profile.Experience =",
          )
          violations = []
          for path in root.rglob("*.lua"):
              relative = str(path.relative_to(root))
              text = path.read_text(encoding="utf-8")
              if any(token in text for token in tokens) and relative not in allowed:
                  violations.append(relative)
          if violations:
              raise SystemExit("Progression writes outside canonical owners: " + ", ".join(violations))
          print("Level/Experience write ownership validated.")
