name: Crystal Ability Context Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/tide-ability-context-contract"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate defense-in-depth ability context
        shell: python
        run: |
          from pathlib import Path

          service = Path("src/ServerScriptService/Services/CrystalAbilityService.lua").read_text(encoding="utf-8")
          combat = Path("src/ServerScriptService/Services/CombatService.lua").read_text(encoding="utf-8")
          config = Path("src/ReplicatedStorage/Config/CrystalConfig.lua").read_text(encoding="utf-8")
          pc = Path("src/StarterPlayer/StarterPlayerScripts/ClientBootstrap.client.lua").read_text(encoding="utf-8")
          mobile = Path("src/StarterPlayer/StarterPlayerScripts/TouchControls.client.lua").read_text(encoding="utf-8")

          required = [
              "local CrystalSystem = require",
              "CrystalSystem.Exists(crystalId)",
              "profile.Crystals.Equipped ~= crystalId",
              "CrystalSystem.Owns(profile, crystalId)",
              "targetModel:GetAttribute(\"Enemy\") ~= true",
              "(targetRoot.Position - playerRoot.Position).Magnitude > safeRange",
              "if crystalId == \"TIDE\" then",
              "local applied = PlayerService.Heal(player, healAmount)",
              "Success = true",
          ]
          missing = [marker for marker in required if marker not in service]
          if missing:
              raise SystemExit("Crystal ability context guard missing: " + ", ".join(missing))

          for marker in [
              'local isTideSelfAbility = action == "Ability" and crystalId == "TIDE"',
              'local safeCooldown = boundedPositive(config.Cooldown, 0.05, 60)',
              'if not isTideSelfAbility and (not safeRange or not safeBaseDamage) then return end',
              'CrystalAbilityService.Execute(player, profile, crystalId, nil, nil, nil)',
              'if not abilityResult.Success then return end',
              'cooldowns[player][action] = now + safeCooldown',
          ]:
              if marker not in combat:
                  raise SystemExit("CombatService TIDE self-ability context missing: " + marker)

          if 'TIDE = { Name = "Tidal Pulse"' not in config or 'HealAmount = 30' not in config:
              raise SystemExit('CrystalConfig must retain the targetless TIDE heal semantics')

          for text, name in ((pc, "ClientBootstrap"), (mobile, "TouchControls")):
              if 'if action == "Ability" and crystalId == "TIDE" then' not in text:
                  raise SystemExit(f"{name} must allow TIDE Ability without an enemy target")
              if 'combatRemote:FireServer("Ability", nil)' not in text:
                  raise SystemExit(f"{name} must send targetless TIDE Ability requests")

          print("Crystal ability ownership/range context, targetless TIDE self-heal semantics and dedicated cooldown path validated.")