name: Status Effect Lifecycle Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate status-effect cancellation and cleanup
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/Services/StatusEffectService.lua").read_text(encoding="utf-8")
          required = [
              'local active = setmetatable({}, { __mode = "k" })',
              'local function getPlayer(humanoid)',
              'local function isPlayerProfileLoaded(humanoid)',
              'return player == nil or player:GetAttribute("ProfileLoaded") == true',
              'local token = {}',
              'state.Slow == token',
              'state.Burn ~= token',
              'function StatusEffectService.Clear(humanoid)',
              'state.Slow = nil',
              'state.SlowMultiplier = nil',
              'state.Burn = nil',
              'active[humanoid] = nil',
              'not isPlayerProfileLoaded(humanoid)',
              'if not isShuttingDown() and isPlayerProfileLoaded(humanoid) and humanoid.Parent and humanoid.Health > 0 and state.BaseWalkSpeed then',
              'if humanoid.Parent and state.Slow == token then',
              'if isShuttingDown() or not humanoid.Parent or humanoid.Health <= 0 or state.Burn ~= token or not isPlayerProfileLoaded(humanoid) then break end',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("missing status-effect lifecycle/readiness markers: " + ", ".join(missing))
          print("Status effect cancellation, loaded-player readiness, death/destroy guards and cleanup contract validated.")
