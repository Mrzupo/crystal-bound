name: Quest Reward Config Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate quest rewards before state commit
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/ServerScriptService/Services/QuestService.lua").read_text(encoding="utf-8")
          for marker in (
              'local function finiteNonNegativeInteger(value)',
              'local rewardXP = finiteNonNegativeInteger(definition.XP)',
              'local rewardMoney = finiteNonNegativeInteger(definition.Money)',
              'if rewardXP == nil or rewardMoney == nil then',
              'if not QuestSystem.Complete(profile, questId) then return false end',
          ):
              if marker not in text:
                  raise SystemExit(f"Quest reward validation marker missing: {marker}")
          if text.index('local rewardXP = finiteNonNegativeInteger(definition.XP)') > text.index('if not QuestSystem.Complete(profile, questId) then return false end'):
              raise SystemExit("Quest reward config must be validated before completion is committed")
          print("Quest reward configuration is validated before completion state mutation.")
