name: Portal Level Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portal gates use canonical WorldConfig levels
        shell: python
        run: |
          from pathlib import Path
          import re

          world = Path('src/ReplicatedStorage/Config/WorldConfig.lua').read_text(encoding='utf-8')
          bootstrap = Path('src/ServerScriptService/Bootstrap.server.lua').read_text(encoding='utf-8')
          theme = Path('src/ServerScriptService/WorldTheme.server.lua').read_text(encoding='utf-8')
          world_markers = [
              'local worldIslands = WorldConfig.Islands',
              'local starterConfig, tideConfig, windConfig, ancientConfig = worldIslands.STARTER, worldIslands.TIDE, worldIslands.WIND, worldIslands.ANCIENT',
          ]
          for marker in world_markers:
              if marker not in bootstrap:
                  raise SystemExit(f'Bootstrap must consume canonical WorldConfig: {marker}')
          required_portals = {
              'TidePortal': 'tideConfig.Level',
              'StarterPortal': 'starterConfig.Level',
              'WindPortal': 'windConfig.Level',
              'TideReturnPortal': 'tideConfig.Level',
              'AncientPortal': 'ancientConfig.Level',
              'WindReturnPortal': 'windConfig.Level',
          }
          for portal, level_expr in required_portals.items():
              if portal not in bootstrap or level_expr not in bootstrap:
                  raise SystemExit(f'{portal} must use canonical WorldConfig level {level_expr}')
          if 'tostring(requiredLevel or 1)' not in bootstrap:
              raise SystemExit('Portal UI must derive the displayed gate from the server-side requiredLevel argument')

          destinations = {
              'TidePortal': (120, 4, 0),
              'StarterPortal': (48, 4, 0),
              'WindPortal': (280, 4, 0),
              'TideReturnPortal': (210, 4, 0),
              'AncientPortal': (440, 4, 0),
              'WindReturnPortal': (380, 4, 0),
          }

          def has_vector3(text, values):
              pattern = r'Vector3\.new\(\s*' + r'\s*,\s*'.join(re.escape(str(v)) for v in values) + r'\s*\)'
              return re.search(pattern, text) is not None

          for portal, values in destinations.items():
              if not has_vector3(bootstrap, values):
                  raise SystemExit(f'{portal} Bootstrap destination drift: missing numeric Vector3 {values}')
              if not has_vector3(theme, values):
                  raise SystemExit(f'{portal} WorldTheme destination drift: missing numeric Vector3 {values}')

          print('World/portal canonical level and destination consistency contract validated.')