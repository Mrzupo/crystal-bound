name: Shop Negative Contract V2

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/shop-negative-contract-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signed ShopConfig numeric coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/ShopConfig.lua").read_text(encoding="utf-8")
          prices = [float(value) for value in re.findall(r"Price\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)]
          limits = [float(value) for value in re.findall(r"MaxPerPurchase\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)]
          if not prices or any(value <= 0 or value % 1 != 0 for value in prices):
              raise SystemExit("ShopConfig prices must be positive integers")
          if not limits or any(value <= 0 or value % 1 != 0 for value in limits):
              raise SystemExit("ShopConfig MaxPerPurchase values must be positive integers")
          print("ShopConfig signed-number coverage rejects negative and fractional price/limit values.")
