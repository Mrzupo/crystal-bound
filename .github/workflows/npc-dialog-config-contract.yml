name: NPC Dialog Config Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/npc-dialog-hardening-current"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server-authorized NPC dialog options
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Modules/NPCDialogConfig.lua").read_text(encoding="utf-8")
          remote = Path("src/ServerScriptService/NPCDialogRemote.server.lua").read_text(encoding="utf-8")
          bridge = Path("src/ServerScriptService/NPCMenuBridge.server.lua").read_text(encoding="utf-8")
          menu = Path("src/StarterPlayer/StarterPlayerScripts/NPCDialogMenu.client.lua").read_text(encoding="utf-8")
          inventory = Path("src/StarterPlayer/StarterPlayerScripts/InventoryMenu.client.lua").read_text(encoding="utf-8")

          for npc in ("CrystalKeeper", "MaterialTrader"):
              if npc not in config:
                  raise SystemExit(f"Missing canonical NPC dialog config: {npc}")

          option_ids = set(re.findall(r'Id = "([A-Z_]+)"', config))
          allowed = {"QUEST", "CRYSTAL", "SHOP", "INVENTORY", "CRAFT"}
          if option_ids != allowed:
              raise SystemExit(f"Unexpected NPC dialog option IDs: {sorted(option_ids)}")

          for marker in (
              'local config = DialogConfig.Get(npcId)',
              'if not config or not isNearCanonicalNPC(player, npcId) then return nil end',
              'npc:GetAttribute("Interactable") ~= true',
              'Players.PlayerRemoving:Connect(function(player)',
          ):
              if marker not in remote:
                  raise SystemExit(f"NPCDialogRemote authority marker missing: {marker}")

          for marker in (
              'model:GetAttribute("Interactable") == true',
              'model:IsDescendantOf(Workspace.NPCs)',
              'isNearModel(player, model)',
              'player:SetAttribute("OpenNPCDialog", npcId)',
          ):
              if marker not in bridge:
                  raise SystemExit(f"NPC menu bridge authority marker missing: {marker}")

          if 'optionId == "CRYSTAL" or optionId == "INVENTORY"' not in menu:
              raise SystemExit('NPCDialogMenu must keep INVENTORY mapped to the combined crystal/inventory menu')
          if 'player:SetAttribute("OpenCrystalMenu", os.clock())' not in menu:
              raise SystemExit('NPCDialogMenu must open the combined crystal/inventory menu through OpenCrystalMenu')
          if 'Inventory & Crystals' not in inventory:
              raise SystemExit('InventoryMenu must remain the combined Inventory & Crystals presentation')

          print("NPC dialog configuration, canonical interactable identity, interaction-distance guards and combined inventory/crystal alias validated.")
