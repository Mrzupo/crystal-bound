name: Player Load Lifecycle Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical profile load ownership and startup drain
        shell: python
        run: |
          from pathlib import Path
          player_service = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          bootstrap = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")
          project = Path("default.project.json").read_text(encoding="utf-8")
          required = [
              'if not player.Parent then',
              'local released = SafeProfileStore.Release(player)',
              'player left while profile loading',
              'player left during profile initialization',
              'local function clearCurrentLoad()',
              'if isCurrentLoad() then PlayerService.LoadingByUserId[userId] = nil end',
              'local loadSuccess, profile, reason = xpcall(function()',
              'return SafeProfileStore.Load(player)',
              'if not loadSuccess then',
              'local reconcileSuccess, reconciledProfile = xpcall(function()',
              'return PlayerData.Reconcile(profile)',
              'if not reconcileSuccess or type(reconciledProfile) ~= "table" then',
              'second profile reconciliation failed',
          ]
          missing = [marker for marker in required if marker not in player_service]
          if missing:
              raise SystemExit("missing PlayerService load lifecycle guard: " + ", ".join(missing))

          profiles_assignment = player_service.index('PlayerService.Profiles[player] = profile')
          first_guard = player_service.index('if PlayerService.ShuttingDown or not player.Parent then')
          if first_guard > profiles_assignment:
              raise SystemExit("PlayerService must check player.Parent before installing the loaded profile")
          second_guard = player_service.index('if PlayerService.ShuttingDown or not player.Parent then', profiles_assignment)
          if second_guard < profiles_assignment:
              raise SystemExit("PlayerService must re-check player.Parent after installing the profile")

          profiles_load_block = player_service[player_service.index('function PlayerService.Load'):player_service.index('function PlayerService.Sync')]
          if profiles_load_block.count('LoadingByUserId[userId] = nil') < 3:
              raise SystemExit('Load path must clear the current UserId in-flight marker on normal and exceptional exits')
          if 'local loadSuccess, profile, reason = xpcall(function()' not in profiles_load_block:
              raise SystemExit('SafeProfileStore.Load must be wrapped so unexpected throws cannot strand LoadingByUserId')

          if 'local loadingPlayers = setmetatable({}, { __mode = "k" })' not in bootstrap:
              raise SystemExit("Bootstrap must maintain per-Player startup-load deduplication state")
          if 'if loadingPlayers[player] then return false end' not in bootstrap:
              raise SystemExit("Bootstrap must reject duplicate startup loads for the same Player instance")
          if 'loadingPlayers[player] = true' not in bootstrap:
              raise SystemExit("Bootstrap must mark a Player as loading before calling PlayerService.Load")
          if 'local function loadPlayer(player)' not in bootstrap or 'Players.PlayerAdded:Connect(function(player)' not in bootstrap:
              raise SystemExit("Bootstrap must keep one canonical PlayerAdded load owner")
          if 'for _, player in ipairs(Players:GetPlayers()) do' not in bootstrap or 'task.spawn(loadPlayer, player)' not in bootstrap:
              raise SystemExit("Bootstrap must load players already present when the world finishes initializing")
          if 'if player.Parent then player:Kick(' not in bootstrap:
              raise SystemExit("Bootstrap must not Kick a player after the player has already left")
          if 'PlayerLoadCatchup' in bootstrap or 'PlayerLoadCatchup' in project:
              raise SystemExit("Redundant PlayerLoadCatchup loader must remain removed")
          if Path('src/ServerScriptService/PlayerLoadCatchup.server.lua').exists():
              raise SystemExit("Redundant PlayerLoadCatchup file must remain removed")

          print("Canonical PlayerAdded ownership, startup drain, per-player deduplication and load/leave/exception race guards validated.")
