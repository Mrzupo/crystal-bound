name: Player Load Lifecycle Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate load/leave race guard
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          required = [
              'if not player.Parent then',
              'local released = SafeProfileStore.Release(player)',
              'player left while profile loading',
              'player left during profile initialization',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("missing PlayerService load lifecycle guard: " + ", ".join(missing))

          profiles_assignment = text.index('PlayerService.Profiles[player] = profile')
          first_guard = text.index('if not player.Parent then')
          if first_guard > profiles_assignment:
              raise SystemExit("PlayerService must check player.Parent before installing the loaded profile")

          second_guard = text.index('if not player.Parent then', profiles_assignment)
          if second_guard < profiles_assignment:
              raise SystemExit("PlayerService must re-check player.Parent after installing the profile")

          print("Player load/leave race contract validated.")
