name: Menu Attribute Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/npc-dialog-client-stale-response", "agent/quest-menu-stale-response", "agent/achievement-menu-stale-response"]
  pull_request:

jobs:
  validate-menu-attributes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared menu attributes and client stale-response lifecycle guards
        shell: python
        run: |
          from pathlib import Path
          root = Path("src")
          files = {
              "dialog": root / "StarterPlayer/StarterPlayerScripts/NPCDialogMenu.client.lua",
              "quest": root / "StarterPlayer/StarterPlayerScripts/QuestMenu.client.lua",
              "touch": root / "StarterPlayer/StarterPlayerScripts/TouchMenus.client.lua",
              "bridge": root / "ServerScriptService/NPCMenuBridge.server.lua",
              "shop": root / "StarterPlayer/StarterPlayerScripts/ShopMenu.client.lua",
              "crystal": root / "StarterPlayer/StarterPlayerScripts/InventoryMenu.client.lua",
              "craft": root / "StarterPlayer/StarterPlayerScripts/CraftingMenu.client.lua",
              "achievement": root / "StarterPlayer/StarterPlayerScripts/AchievementMenu.client.lua",
          }
          text = {key: path.read_text(encoding="utf-8") for key, path in files.items()}
          attributes = [
              "OpenQuestMenu",
              "OpenShopMenu",
              "OpenCrystalMenu",
              "OpenCraftingMenu",
              "OpenAchievementMenu",
              "OpenNPCDialog",
          ]
          problems = []
          for attribute in attributes:
              if attribute not in text["touch"] and attribute != "OpenNPCDialog":
                  problems.append(f"TouchMenus missing {attribute}")
              if attribute == "OpenNPCDialog" and attribute not in text["bridge"]:
                  problems.append("NPCMenuBridge missing OpenNPCDialog")

          if 'local MENU_ATTRIBUTES = {' not in text["bridge"] or 'clearMenus(player)' not in text["bridge"]:
              problems.append("NPCMenuBridge must centralize and clear menu attributes")
          if 'local MENU_ATTRIBUTES = {' not in text["touch"] or 'player:SetAttribute(attribute, nil)' not in text["touch"]:
              problems.append("TouchMenus must centralize and clear menu attributes")
          if 'local MENU_ATTRIBUTES = {' not in text["dialog"] or 'clearMenuState()' not in text["dialog"]:
              problems.append("NPCDialogMenu must centralize and clear menu attributes")

          bridge_markers = (
              'local function openDialog(player, npcId, character)',
              'player.Character == character and character.Parent',
              'openDialog(player, model.Name, character)',
              'local playerCharacterConnections = setmetatable({}, { __mode = "k" })',
              'local function bindPlayer(player)',
              'playerCharacterConnections[player] = player.CharacterAdded:Connect(function(character)',
              'disconnectPlayer(player)',
              'Players.PlayerRemoving:Connect(function(player)',
          )
          for marker in bridge_markers:
              if marker not in text["bridge"]:
                  problems.append(f"NPCMenuBridge lifecycle marker missing: {marker}")

          dialog_guards = (
              'local dialogRequestGeneration = 0',
              'local DIALOG_RETRY_DELAY = 0.25',
              'local openDialog',
              'local function scheduleDialogRetry(npcId, character, generation)',
              'openDialog(npcId, character, generation)',
              'generation ~= dialogRequestGeneration',
              'player.Character ~= character',
              'not character.Parent',
              'player:GetAttribute("OpenNPCDialog") ~= npcId',
              'player.CharacterAdded:Connect(function()',
              'player.CharacterRemoving:Connect(function()',
              'local generation = dialogRequestGeneration',
              'dialogRequestGeneration += 1',
          )
          for marker in dialog_guards:
              if marker not in text["dialog"]:
                  problems.append(f"NPCDialogMenu stale-response/retry guard missing: {marker}")

          quest_guards = (
              'local loadGeneration = 0',
              'loadGeneration += 1',
              'local generation = loadGeneration',
              'local character = player.Character',
              'generation ~= loadGeneration',
              'player.Character ~= character',
              'player:GetAttribute("OpenQuestMenu") ~= expectedOpenState',
              'player.CharacterAdded:Connect(function()',
              'player.CharacterRemoving:Connect(function()',
              'local function scheduleCurrentGenerationReload(staleGeneration)',
              'if open and staleGeneration ~= loadGeneration then',
              'if not data or type(data) ~= "table" or not open then return end',
          )
          for marker in quest_guards:
              if marker not in text["quest"]:
                  problems.append(f"QuestMenu stale-response/retry guard missing: {marker}")

          achievement_guards = (
              'local refreshGeneration = 0',
              'local refreshInFlight = false',
              'local ACHIEVEMENT_RETRY_DELAY = 0.25',
              'local refresh',
              'local function invalidateRefresh()',
              'local function scheduleAchievementRetry(staleGeneration)',
              'local generation = refreshGeneration',
              'local character = player.Character',
              'generation ~= refreshGeneration',
              'player.Character ~= character',
              'player:GetAttribute("OpenAchievementMenu") ~= expectedOpenState',
              'player.CharacterAdded:Connect(function()',
              'player.CharacterRemoving:Connect(function()',
          )
          for marker in achievement_guards:
              if marker not in text["achievement"]:
                  problems.append(f"AchievementMenu stale-response/retry guard missing: {marker}")

          menu_guards = {
              "shop": "OpenShopMenu",
              "crystal": "OpenCrystalMenu",
              "craft": "OpenCraftingMenu",
              "achievement": "OpenAchievementMenu",
          }
          for name, attribute in menu_guards.items():
              if f'player:GetAttributeChangedSignal("{attribute}")' not in text[name]:
                  problems.append(f"{name} menu must listen for {attribute}")
              if f'player:GetAttribute("{attribute}") == nil then return end' not in text[name]:
                  problems.append(f"{name} menu must not open when {attribute} is cleared")
              if f'player:SetAttribute("{attribute}", nil)' not in text[name]:
                  problems.append(f"{name} menu must clear {attribute} on close")

          if problems:
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("Menu attribute, Character-bound deferred-open, stale NPC/Quest/Achievement responses, retry paths, respawn cleanup and close-state contract validated.")
