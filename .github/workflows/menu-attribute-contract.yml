name: Menu Attribute Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-menu-attributes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared menu attributes and close-state cleanup
        shell: python
        run: |
          from pathlib import Path
          root = Path("src")
          files = {
              "dialog": root / "StarterPlayer/StarterPlayerScripts/NPCDialogMenu.client.lua",
              "touch": root / "StarterPlayer/StarterPlayerScripts/TouchMenus.client.lua",
              "bridge": root / "ServerScriptService/NPCMenuBridge.server.lua",
              "quest": root / "StarterPlayer/StarterPlayerScripts/QuestMenu.client.lua",
              "shop": root / "StarterPlayer/StarterPlayerScripts/ShopMenu.client.lua",
              "crystal": root / "StarterPlayer/StarterPlayerScripts/InventoryMenu.client.lua",
              "craft": root / "StarterPlayer/StarterPlayerScripts/CraftingMenu.client.lua",
              "achievement": root / "StarterPlayer/StarterPlayerScripts/AchievementMenu.client.lua",
          }
          text = {key: path.read_text(encoding="utf-8") for key, path in files.items()}
          attributes = [
              "OpenQuestMenu",
              "OpenShopMenu",
              "OpenCrystalMenu",
              "OpenCraftingMenu",
              "OpenAchievementMenu",
              "OpenNPCDialog",
          ]
          problems = []
          for attribute in attributes:
              if attribute not in text["touch"] and attribute != "OpenNPCDialog":
                  problems.append(f"TouchMenus missing {attribute}")
              if attribute in {"OpenQuestMenu", "OpenShopMenu", "OpenCrystalMenu", "OpenCraftingMenu", "OpenAchievementMenu"} and attribute not in text["dialog"]:
                  problems.append(f"NPCDialogMenu missing {attribute}")
              if attribute == "OpenNPCDialog" and attribute not in text["bridge"]:
                  problems.append("NPCMenuBridge missing OpenNPCDialog")

          if 'local MENU_ATTRIBUTES = {' not in text["bridge"]:
              problems.append("NPCMenuBridge must centralize menu attributes")
          if 'clearMenus(player)' not in text["bridge"]:
              problems.append("NPCMenuBridge must clear existing menu state before opening a dialog")
          if 'local MENU_ATTRIBUTES = {' not in text["touch"]:
              problems.append("TouchMenus must centralize menu attributes")
          if 'player:SetAttribute(attribute, nil)' not in text["touch"]:
              problems.append("TouchMenus must clear existing menu state before opening a menu")
          if 'local MENU_ATTRIBUTES = {' not in text["dialog"]:
              problems.append("NPCDialogMenu must centralize menu attributes")
          if 'clearMenuState()' not in text["dialog"]:
              problems.append("NPCDialogMenu must clear existing menu state before dialog/target transitions")

          close_requirements = {
              "quest": 'player:SetAttribute("OpenQuestMenu", nil)',
              "shop": 'player:SetAttribute("OpenShopMenu", nil)',
              "crystal": 'player:SetAttribute("OpenCrystalMenu", nil)',
              "craft": 'player:SetAttribute("OpenCraftingMenu", nil)',
              "achievement": 'player:SetAttribute("OpenAchievementMenu", nil)',
          }
          for name, marker in close_requirements.items():
              if marker not in text[name]:
                  problems.append(f"{name} menu must clear its Open* attribute on local close")

          if problems:
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("Menu attribute and close-state contract validated.")
