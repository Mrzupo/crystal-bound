name: Menu Attribute Contract

on:
  push:
  pull_request:

jobs:
  validate-menu-attributes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared menu attributes and lifecycle-safe prompt binding
        shell: python
        run: |
          from pathlib import Path
          root = Path('src')
          files = {
              'dialog': root / 'StarterPlayer/StarterPlayerScripts/NPCDialogMenu.client.lua',
              'touch': root / 'StarterPlayer/StarterPlayerScripts/TouchMenus.client.lua',
              'bridge': root / 'ServerScriptService/NPCMenuBridge.server.lua',
              'quest': root / 'StarterPlayer/StarterPlayerScripts/QuestMenu.client.lua',
              'shop': root / 'StarterPlayer/StarterPlayerScripts/ShopMenu.client.lua',
              'crystal': root / 'StarterPlayer/StarterPlayerScripts/InventoryMenu.client.lua',
              'craft': root / 'StarterPlayer/StarterPlayerScripts/CraftingMenu.client.lua',
              'achievement': root / 'StarterPlayer/StarterPlayerScripts/AchievementMenu.client.lua',
          }
          text = {key: path.read_text(encoding='utf-8') for key, path in files.items()}
          problems = []
          for attribute in ('OpenQuestMenu','OpenShopMenu','OpenCrystalMenu','OpenCraftingMenu','OpenAchievementMenu','OpenNPCDialog'):
              owner = 'bridge' if attribute == 'OpenNPCDialog' else 'touch'
              if attribute not in text[owner]: problems.append(f'{owner} missing {attribute}')
          for marker in (
              'local function isCanonicalNPC(model)', 'local function isNearModel(player, model)',
              'local waitingPromptConnections = setmetatable({}, { __mode = "k" })',
              'local function clearWaitingPrompt(prompt)', 'waitingPromptConnections[prompt] = model:GetAttributeChangedSignal("Interactable"):Connect',
              'if not isCanonicalNPC(model) then', 'prompt:SetAttribute("CrystalBoundMenuBound", true)',
              'if PlayerService.ShuttingDown then return end', 'player:GetAttribute("ProfileLoaded") ~= true',
              'player.Character == character and character.Parent',
          ):
              if marker not in text['bridge']:
                  problems.append('NPCMenuBridge missing readiness marker: ' + marker)
          if 'prompt:SetAttribute("CrystalBoundMenuBound", true)' in text['bridge']:
              bind_pos = text['bridge'].find('prompt:SetAttribute("CrystalBoundMenuBound", true)')
              canonical_pos = text['bridge'].find('if not isCanonicalNPC(model) then')
              if bind_pos < canonical_pos:
                  problems.append('NPCMenuBridge must not mark prompts bound before canonical NPC validation')
          for name, attribute in {
              'quest':'OpenQuestMenu','shop':'OpenShopMenu','crystal':'OpenCrystalMenu','craft':'OpenCraftingMenu','achievement':'OpenAchievementMenu'
          }.items():
              if f'player:GetAttributeChangedSignal("{attribute}")' not in text[name]: problems.append(f'{name} must listen for {attribute}')
              if f'player:SetAttribute("{attribute}", nil)' not in text[name]: problems.append(f'{name} must clear {attribute} on close')
          if problems:
              for problem in problems: print(' - ' + problem)
              raise SystemExit(1)
          print('Menu attributes, NPC readiness, deferred Character binding and stale prompt protection validated.')
