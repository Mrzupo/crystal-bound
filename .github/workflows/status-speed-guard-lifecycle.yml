name: Status Speed Guard Lifecycle

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate connection cleanup, server-owned slow state and movement enforcement
        run: |
          python - <<'PY'
          from pathlib import Path
          guard = Path('src/ServerScriptService/StatusSpeedGuardV2.server.lua').read_text(encoding='utf-8')
          effects = Path('src/ServerScriptService/Services/StatusEffectService.lua').read_text(encoding='utf-8')
          required = [
              'local connections = setmetatable({}, { __mode = "k" })',
              'local humanoidConnections = setmetatable({}, { __mode = "k" })',
              'local positionState = setmetatable({}, { __mode = "k" })',
              'Players.PlayerRemoving:Connect(cleanup)',
              'if connection.Connected then connection:Disconnect() end',
              'local expected = math.max(MIN_WALK_SPEED, base)',
              'if math.abs(humanoid.WalkSpeed - expected) > SPEED_EPSILON then',
              'humanoid:GetPropertyChangedSignal("WalkSpeed"):Connect(function()',
              'if player.Character ~= character then return end',
              'disconnectHumanoid(player)',
              'local displacement = (root.Position - snapshot.Position).Magnitude',
              'root.CFrame = CFrame.new(snapshot.Position)',
              'positionState[player] = {',
              'player:SetAttribute("PortalMovementGraceUntil", 0)',
              'player:SetAttribute("PortalExpectedDestination", nil)',
              'if not humanoid or humanoid.Health <= 0 or not root then',
              'resetPositionState(player)',
              'refresh(player)',
              'local StatusEffectService = require(script.Parent.Services.StatusEffectService)',
              'local slow = StatusEffectService.GetSlowMultiplier(humanoid)',
              'player:GetAttribute("ProfileLoaded") ~= true',
              'player:GetAttributeChangedSignal("ProfileLoaded")',
              'task.defer(function()\n\t\t\twatchCharacter(player, character)',
          ]
          missing = [token for token in required if token not in guard]
          if missing:
              raise SystemExit('StatusSpeedGuardV2 contract missing: ' + ', '.join(missing))
          if 'if player:GetAttribute("ProfileLoaded") == true then\n\t\trefresh(player)' in guard:
              raise SystemExit('CharacterAdded must not refresh movement authority from the stale pre-respawn ProfileLoaded state')
          if 'humanoid:GetAttribute("CrystalBoundSlowMultiplier")' in guard:
              raise SystemExit('StatusSpeedGuardV2 must not trust Humanoid slow attributes for gameplay authority')

          effect_markers = [
              'function StatusEffectService.GetSlowMultiplier(humanoid)',
              'local slow = state and state.SlowMultiplier',
              'state.SlowMultiplier = multiplier',
              'state.SlowMultiplier = nil',
          ]
          missing_effects = [token for token in effect_markers if token not in effects]
          if missing_effects:
              raise SystemExit('StatusEffectService server-owned slow state contract missing: ' + ', '.join(missing_effects))

          print('Status speed guard lifecycle, ProfileLoaded readiness, deferred respawn refresh and server-owned slow authority validated.')
          PY