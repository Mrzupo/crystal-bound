name: Status Speed Guard Lifecycle

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate connection cleanup, baseline and movement enforcement
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/ServerScriptService/StatusSpeedGuardV2.server.lua').read_text(encoding='utf-8')
          required = [
              'local connections = setmetatable({}, { __mode = "k" })',
              'local humanoidConnections = setmetatable({}, { __mode = "k" })',
              'local positionState = setmetatable({}, { __mode = "k" })',
              'Players.PlayerRemoving:Connect(cleanup)',
              'if connection.Connected then connection:Disconnect() end',
              'local expected = math.max(MIN_WALK_SPEED, base)',
              'if math.abs(humanoid.WalkSpeed - expected) > SPEED_EPSILON then',
              'humanoid:GetPropertyChangedSignal("WalkSpeed"):Connect(function()',
              'if player.Character ~= character then return end',
              'disconnectHumanoid(player)',
              'local displacement = (root.Position - snapshot.Position).Magnitude',
              'root.CFrame = CFrame.new(snapshot.Position)',
              'positionState[player] = {',
              'player:SetAttribute("PortalMovementGraceUntil", 0)',
              'player:SetAttribute("PortalExpectedDestination", nil)',
              'if not humanoid or humanoid.Health <= 0 or not root then',
              'resetPositionState(player)',
              'refresh(player)',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('StatusSpeedGuardV2 contract missing: ' + ', '.join(missing))
          if 'and humanoid:GetAttribute("CrystalBoundSlowMultiplier") ~= nil' in text:
              raise SystemExit('StatusSpeedGuardV2 must enforce baseline speed even without a slow effect')
          print('Status speed guard lifecycle, baseline enforcement, missing-root snapshot reset, movement correction and respawn cleanup validated.')
          PY
