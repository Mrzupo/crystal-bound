name: Contract Path Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-contract-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow file-read paths
        shell: python
        run: |
          import re
          from pathlib import Path

          repo = Path(".")
          problems = []
          path_pattern = re.compile(r'Path\(\s*["\']((?:src|\.github)/[^"\']+?\.(?:lua|json|md|yml|yaml))["\']\s*\)\.(?:read_text|read_bytes|open)\b')
          open_pattern = re.compile(r'open\(\s*["\']((?:src|\.github)/[^"\']+?\.(?:lua|json|md|yml|yaml))["\']')

          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              text = workflow.read_text(encoding="utf-8")
              for pattern in (path_pattern, open_pattern):
                  for path in sorted(set(pattern.findall(text))):
                      if "{" in path or "}" in path:
                          continue
                      if not (repo / path).is_file():
                          problems.append(f"{workflow}: missing workflow-read path {path}")

          if problems:
              print("Contract path problems:")
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("All workflow file-read paths exist; template and negative existence assertions are ignored intentionally.")