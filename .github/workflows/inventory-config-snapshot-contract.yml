name: Inventory Config Snapshot Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate detached InventoryConfig item reads
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ReplicatedStorage/Config/InventoryConfig.lua").read_text(encoding="utf-8")
          if "local function copyItem(item)" not in text:
              raise SystemExit("InventoryConfig must define a detached item-copy helper")
          if "function InventoryConfig.GetItemConfig(id) return copyItem(Items[id]) end" not in text:
              raise SystemExit("InventoryConfig.GetItemConfig must return a detached item snapshot")
          if "function InventoryConfig.GetMaxStackSize(id)" not in text:
              raise SystemExit("InventoryConfig must expose a canonical MaxStackSize getter")
          if "InventoryConfig.DefaultMaxStackSize" not in text or "math.clamp(math.floor(raw or InventoryConfig.DefaultMaxStackSize), 1, 1000)" not in text:
              raise SystemExit("InventoryConfig.GetMaxStackSize must normalize stack size through the canonical default and bounds")
          print("InventoryConfig detached item reads and canonical MaxStackSize normalization validated.")
