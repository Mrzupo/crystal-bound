name: Inventory Config Snapshot Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate detached InventoryConfig item reads
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ReplicatedStorage/Config/InventoryConfig.lua").read_text(encoding="utf-8")
          if "local function copyItem(item)" not in text:
              raise SystemExit("InventoryConfig must define a detached item-copy helper")
          if "function InventoryConfig.GetItemConfig(id) return copyItem(Items[id]) end" not in text:
              raise SystemExit("InventoryConfig.GetItemConfig must return a detached item snapshot")
          if "function InventoryConfig.GetMaxStackSize(id) return (Items[id] and Items[id].MaxStackSize)" not in text:
              raise SystemExit("InventoryConfig must keep MaxStackSize reads canonical")
          print("InventoryConfig detached item-read contract validated.")
