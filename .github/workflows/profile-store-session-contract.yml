name: Profile Store Session Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate session-lock ownership invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path('src/ReplicatedStorage/Modules/SafeProfileStore.lua').read_text(encoding='utf-8')
          required = [
              'local sessionTokens = setmetatable({}, { __mode = "k" })',
              'local function getSessionToken(player)',
              'local function newLoadToken()',
              'local token = newLoadToken()',
              'local token = getSessionToken(player)',
              'local sameSession = lock and lock.JobId == SESSION_ID and lock.Token == token',
              'if lock and not sameSession and age < SESSION_TIMEOUT then',
              'data.SessionLock = { JobId = SESSION_ID, Token = token, Timestamp = timestamp() }',
              'sessionTokens[player] = token',
              'if type(lock) ~= "table" or lock.JobId ~= SESSION_ID or lock.Token ~= token then',
              'payload.SessionLock = { JobId = SESSION_ID, Token = token, Timestamp = timestamp() }',
              'function SafeProfileStore.Release(player, expectedToken)',
              'local token = expectedToken or getSessionToken(player)',
              'lock.Token == token',
              'current.SessionLock = nil',
              'claimed = false',
              'invalidStoredValue = false',
              'saved = false',
              'refreshed = false',
              'released = false',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Profile-store session contract missing: ' + ', '.join(missing))

          callback_checks = {
              'Load': ('return store:UpdateAsync(key, function(current)', 'claimed = false', 'invalidStoredValue = false'),
              'Save': ('return store:UpdateAsync(key, function(current)', 'saved = false'),
              'Refresh': ('return store:UpdateAsync(key, function(current)', 'refreshed = false'),
              'Release': ('return store:UpdateAsync(key, function(current)', 'released = false'),
          }
          for operation, markers in callback_checks.items():
              start = text.index('function SafeProfileStore.' + operation)
              end = text.find('function SafeProfileStore.', start + 10)
              block = text[start:] if end == -1 else text[start:end]
              callback_at = block.index('return store:UpdateAsync(key, function(current)')
              callback_tail = block[callback_at:callback_at + 240]
              for marker in markers[1:]:
                  if marker not in callback_tail:
                      raise SystemExit(f'{operation} must reset callback state on every UpdateAsync invocation: {marker}')

          timeout_match = re.search(r'SESSION_TIMEOUT\s*=\s*(\d+)', text)
          if not timeout_match:
              raise SystemExit('Profile session timeout must remain explicit')
          timeout = int(timeout_match.group(1))
          heartbeat_text = Path('src/ServerScriptService/SessionHeartbeat.server.lua').read_text(encoding='utf-8')
          heartbeat_match = re.search(r'HEARTBEAT_INTERVAL\s*=\s*(\d+)', heartbeat_text)
          if not heartbeat_match:
              raise SystemExit('Session heartbeat interval must remain explicit')
          heartbeat = int(heartbeat_match.group(1))
          if timeout <= heartbeat * 2:
              raise SystemExit(f'SESSION_TIMEOUT ({timeout}) must exceed two heartbeat intervals ({heartbeat * 2})')

          if 'local profile = PlayerData.Reconcile(result)' not in text or 'local payload = PlayerData.Reconcile(clone(profile))' not in text:
              raise SystemExit('Load/Save must reconcile persisted profile data at the storage boundary')

          print('Profile-store active-token isolation, speculative-load token separation, token-specific release and UpdateAsync callback retry-state isolation validated.')
