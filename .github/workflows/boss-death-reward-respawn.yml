name: Boss Death Reward Respawn Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/boss-death-respawn-reward-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate boss death cleanup is independent from reward eligibility
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/ServerScriptService/Services/BossService.lua").read_text(encoding="utf-8")
          died_start = text.index("humanoid.Died:Connect(function()")
          died_block = text[died_start:]
          for marker in (
              "local validProgressionReward =",
              "if validProgressionReward then",
              "DamageService.ClearTarget(model)",
              "task.delay(1.5, function()",
              "task.delay(respawn + 1.5, function()",
              "BossService.CreateGuardian(position, parent, bossName)",
          ):
              if marker not in died_block:
                  raise SystemExit("Boss death lifecycle marker missing: " + marker)
          if "if not validProgressionReward then return end" in died_block:
              raise SystemExit("Boss death must not return before cleanup/respawn when rewards are unavailable")
          if "local validDrop" not in died_block:
              raise SystemExit("Boss optional loot must remain independently validated")
          print("Boss reward eligibility cannot suppress death cleanup or respawn.")
