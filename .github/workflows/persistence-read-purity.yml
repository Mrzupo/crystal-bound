name: Persistence Read Purity

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/persistence-read-purity-v1"]
  pull_request:

jobs:
  validate-read-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate side-effect-free persistence readers
        shell: python
        run: |
          from pathlib import Path

          bounty = Path("src/ServerScriptService/Services/DailyBountyService.lua").read_text(encoding="utf-8")
          mastery = Path("src/ReplicatedStorage/Modules/CrystalMastery.lua").read_text(encoding="utf-8")
          xp = Path("src/ServerScriptService/Services/XPService.lua").read_text(encoding="utf-8")
          economy = Path("src/ServerScriptService/Services/EconomyService.lua").read_text(encoding="utf-8")

          bounty_start = bounty.index("function DailyBountyService.Get(profile)")
          bounty_block = bounty[bounty_start:]
          if "DailyBountyService.Refresh(profile)" in bounty_block:
              raise SystemExit("DailyBountyService.Get must not call mutating Refresh")
          if "local function readSnapshot(profile)" not in bounty:
              raise SystemExit("DailyBountyService must provide a detached read snapshot path")
          if "function DailyBountyService.Refresh(profile)" not in bounty or "function DailyBountyService.AddProgress(" not in bounty:
              raise SystemExit("DailyBounty mutation owners are missing")

          readers = (
              ("Get", "function CrystalMastery.Get(profile, crystalId)", "function CrystalMastery.GetRequiredXP"),
              ("GetBonuses", "function CrystalMastery.GetBonuses(profile, crystalId)", "function CrystalMastery.GetUpgradeCost"),
              ("GetUpgradeCost", "function CrystalMastery.GetUpgradeCost(profile, crystalId)", "function CrystalMastery.Upgrade"),
          )
          for name, start_marker, end_marker in readers:
              start = mastery.index(start_marker)
              end = mastery.index(end_marker, start)
              block = mastery[start:end]
              if "ensure(profile, crystalId)" in block:
                  raise SystemExit(f"CrystalMastery.{name} must not call mutating ensure()")
              if "profile.CrystalMastery =" in block:
                  raise SystemExit(f"CrystalMastery.{name} must not initialize persisted mastery state")

          if "local function readMastery(profile, crystalId)" not in mastery:
              raise SystemExit("CrystalMastery must centralize side-effect-free mastery reads")
          if "function CrystalMastery.AddXP" not in mastery or "function CrystalMastery.Upgrade" not in mastery:
              raise SystemExit("CrystalMastery explicit mutation owners are missing")
          if "InventoryConfig.GetItemConfig(itemId)" not in mastery:
              raise SystemExit("CrystalMastery upgrade-cost reads must validate canonical inventory material IDs")

          for text, name, readers in (
              (xp, "XPService", [("GetLevel", "function XPService.GetLevel(profile)", "function XPService.GetXP"), ("GetXP", "function XPService.GetXP(profile)", "function XPService.GetRequiredXP")]),
              (economy, "EconomyService", [("GetMoney", "function EconomyService.GetMoney(profile)", "function EconomyService.CanAfford"), ("CanAfford", "function EconomyService.CanAfford(profile, amount)", "function EconomyService.GetSellPrice")]),
          ):
              for reader_name, start_marker, end_marker in readers:
                  start = text.index(start_marker)
                  end = text.index(end_marker, start)
                  block = text[start:end]
                  if "profile.Level =" in block or "profile.Experience =" in block or "profile.Money =" in block:
                      raise SystemExit(f"{name}.{reader_name} must not mutate persisted profile state")

          if "function XPService.AddXP" not in xp or "function EconomyService.AddMoney" not in economy:
              raise SystemExit("Explicit XP/Economy mutation owners are missing")

          print("Persistence read purity validated for DailyBounty, CrystalMastery, XP and Economy.")
