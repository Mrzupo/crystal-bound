name: Quest Availability Autosave Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/quest-availability-autosave-retry-current"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unavailable profile returns nil and QuestMenu retries
        shell: python
        run: |
          from pathlib import Path

          server = Path("src/ServerScriptService/QuestAvailability.server.lua").read_text(encoding="utf-8")
          client = Path("src/StarterPlayer/StarterPlayerScripts/QuestMenu.client.lua").read_text(encoding="utf-8")
          if "local profile = PlayerService.GetProfile(player)" not in server:
              raise SystemExit("Quest availability must use PlayerService.GetProfile")
          if "if not profile then return nil end" not in server:
              raise SystemExit("Unavailable profile must return nil so QuestMenu can distinguish temporary gating from a valid empty list")
          if "if not profile then return {} end" in server:
              raise SystemExit("Quest availability must not return a valid empty table while the profile is unavailable")
          for marker in ("local retryQueued = false", "local RETRY_DELAY = 0.25", "if open and not retryQueued then", "if open then loadData(true) end"):
              if marker not in client:
                  raise SystemExit(f"QuestMenu retry marker missing: {marker}")
          print("Quest availability returns nil during profile/autosave gating and QuestMenu retries while open.")
