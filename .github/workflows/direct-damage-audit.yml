name: Crystal Bound Direct Damage Audit

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  audit-direct-damage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject non-central TakeDamage calls
        shell: python
        run: |
          from pathlib import Path

          root = Path("src")
          allowed = Path("src/ServerScriptService/Services/DamageService.lua")
          violations = []

          for path in root.rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if ":TakeDamage(" in text and path != allowed:
                  violations.append(str(path))

          if violations:
              print("Direct Humanoid:TakeDamage() calls outside DamageService are forbidden:")
              for path in sorted(violations):
                  print(f" - {path}")
              raise SystemExit(1)

          damage_service = allowed.read_text(encoding="utf-8")
          if ":TakeDamage(" not in damage_service:
              raise SystemExit("DamageService must remain the sole direct TakeDamage owner")

          print("Direct damage audit passed.")
