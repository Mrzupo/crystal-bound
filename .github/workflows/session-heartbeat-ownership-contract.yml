name: Session Heartbeat Ownership Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate serialized heartbeat ownership
        shell: python
        run: |
          from pathlib import Path

          heartbeat = Path("src/ServerScriptService/SessionHeartbeat.server.lua").read_text(encoding="utf-8")
          player_service = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          if "PlayerService.RefreshSession(player)" not in heartbeat:
              raise SystemExit("SessionHeartbeat must route refresh through PlayerService.RefreshSession")
          if "SafeProfileStore.Refresh" in heartbeat:
              raise SystemExit("SessionHeartbeat must not call SafeProfileStore.Refresh directly")
          if "PlayerService.BeginShutdown()" not in heartbeat:
              raise SystemExit("SessionHeartbeat shutdown must tell PlayerService to stop new loads")
          if "PlayerService.GetPendingLoadCount()" not in heartbeat:
              raise SystemExit("SessionHeartbeat shutdown must drain pending profile loads")
          if "function PlayerService.RefreshSession(player)" not in player_service:
              raise SystemExit("PlayerService must own session refresh operations")
          if "if not acquireOperation(player) then return false end" not in player_service:
              raise SystemExit("RefreshSession must acquire the PlayerService operation lock")
          if player_service.count('if not PlayerService.Profiles[player] or PlayerService.Closing[player] then') < 4:
              raise SystemExit("PlayerService must re-check profile/closing state after waits and before persistent operations")
          if "SafeProfileStore.Refresh(player)" not in player_service:
              raise SystemExit("RefreshSession must delegate to SafeProfileStore.Refresh")
          if "function PlayerService.Save(player)" not in player_service:
              raise SystemExit("PlayerService must own autosave operations")
          if "return saveConsistently(player, profile)" not in player_service:
              raise SystemExit("Save must use the consistent snapshot/save path")
          if "function PlayerService.BeginShutdown()" not in player_service:
              raise SystemExit("PlayerService must expose a shutdown gate")
          if "function PlayerService.GetPendingLoadCount()" not in player_service:
              raise SystemExit("PlayerService must expose pending-load accounting")
          print("Session heartbeat, autosave, post-lock close-state recheck and shutdown ownership contract validated.")
