name: Crystal Config Contract

on:
  push:
  pull_request:

jobs:
  validate-crystal-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CrystalConfig semantic bounds
        shell: python
        run: |
          from pathlib import Path
          import math
          import re

          config = Path('src/ReplicatedStorage/Config/CrystalConfig.lua').read_text(encoding='utf-8')
          system = Path('src/ReplicatedStorage/Modules/CrystalSystem.lua').read_text(encoding='utf-8')
          ability = Path('src/ServerScriptService/Services/CrystalAbilityService.lua').read_text(encoding='utf-8')
          inventory = Path('src/StarterPlayer/StarterPlayerScripts/InventoryMenu.client.lua').read_text(encoding='utf-8')
          bootstrap = Path('src/ServerScriptService/Bootstrap.server.lua').read_text(encoding='utf-8')

          for section in ('Definitions', 'UnlockLevels', 'BasicAttack', 'Abilities', 'Passives'):
              if section not in config:
                  raise SystemExit(f'Missing CrystalConfig section: {section}')
          for crystal in ('EMBER', 'TIDE', 'GALE'):
              for section in ('Definitions', 'BasicAttack', 'Abilities', 'Passives'):
                  if f'{crystal} =' not in config:
                      raise SystemExit(f'Missing {crystal} entry in {section}')

          numeric = r'-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?'
          bounds = {
              'Damage': (0, 1000), 'Range': (0.1, 1000), 'Cooldown': (0.05, 60),
              'HealAmount': (0, 1000), 'UnlockLevels': (1, 1000),
              'DamageMultiplier': (0.1, 10), 'WalkSpeedBonus': (0, 20), 'MaxHealthBonus': (0, 1000),
          }
          for field, (minimum, maximum) in bounds.items():
              for raw in re.findall(rf'\b{re.escape(field)}\s*=\s*({numeric})', config):
                  value = float(raw)
                  if not math.isfinite(value) or value < minimum or value > maximum:
                      raise SystemExit(f'Crystal {field} outside bounds: {value}')

          passive_blocks = re.findall(r'[A-Z]+\s*=\s*\{\s*DamageMultiplier\s*=\s*([^,]+),\s*WalkSpeedBonus\s*=\s*([^,]+),\s*MaxHealthBonus\s*=\s*([^}]+)\}', config, re.S)
          if len(passive_blocks) != 3:
              raise SystemExit('CrystalConfig must define exactly three canonical passive records')
          if 'local function validUnlockLevel(id)' not in system or 'local function hasDefinition(id)' not in system or 'local function hasCombatConfig(id)' not in system:
              raise SystemExit('CrystalSystem strict config boundary is missing')
          if 'raw % 1 ~= 0' not in system:
              raise SystemExit('CrystalSystem unlock validation must reject fractional levels')
          if 'CrystalConfig.Abilities.TIDE' not in ability or 'HealAmount' not in ability:
              raise SystemExit('CrystalAbilityService must consume canonical TIDE configuration')
          if 'local unlockLevels = crystalConfig.UnlockLevels' not in inventory:
              raise SystemExit('InventoryMenu must consume canonical UnlockLevels')
          if 'CrystalConfig.UnlockLevels' not in bootstrap:
              raise SystemExit('Bootstrap must consume canonical UnlockLevels')
          if 'local unlockLevels = {' in inventory or 'local crystalRequirements = {' in bootstrap:
              raise SystemExit('Crystal unlock levels must not be duplicated in client/server UI/bootstrap code')

          print('CrystalConfig signed numeric bounds, canonical unlock ownership and ability config usage validated.')
