name: Crystal Config Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-crystal-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CrystalConfig contract
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/CrystalConfig.lua").read_text(encoding="utf-8")
          inventory_ui = Path("src/StarterPlayer/StarterPlayerScripts/InventoryMenu.client.lua").read_text(encoding="utf-8")
          bootstrap = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")
          system = Path("src/ReplicatedStorage/Modules/CrystalSystem.lua").read_text(encoding="utf-8")
          player_data = Path("src/ReplicatedStorage/Modules/PlayerData.lua").read_text(encoding="utf-8")
          ability_service = Path("src/ServerScriptService/Services/CrystalAbilityService.lua").read_text(encoding="utf-8")
          required = {
              "Definitions": ("EMBER =", "TIDE =", "GALE ="),
              "UnlockLevels": ("EMBER = 1", "TIDE = 3", "GALE = 5"),
              "BasicAttack": ("EMBER =", "TIDE =", "GALE ="),
              "Abilities": ("EMBER =", "TIDE =", "GALE ="),
              "Passives": ("EMBER =", "TIDE =", "GALE ="),
          }

          problems = []
          for section, markers in required.items():
              if section not in config:
                  problems.append(f"CrystalConfig is missing section {section}")
                  continue
              for marker in markers:
                  if marker not in config:
                      problems.append(f"CrystalConfig {section} is missing marker {marker}")

          for crystal in ("EMBER", "TIDE", "GALE"):
              for section in ("Definitions", "BasicAttack", "Abilities", "Passives"):
                  marker = f"{crystal} ="
                  if marker not in config:
                      problems.append(f"CrystalConfig {section} missing {crystal}")

          for field, values in re.findall(r"\b(Damage|Range|Cooldown|HealAmount|UnlockLevels)\s*=\s*([0-9]+(?:\.[0-9]+)?)", config):
              value = float(values)
              if field == "Damage" and not 0 <= value <= 1000:
                  problems.append(f"Crystal {field} outside 0..1000: {value}")
              elif field == "Range" and not 0.1 <= value <= 1000:
                  problems.append(f"Crystal {field} outside 0.1..1000: {value}")
              elif field == "Cooldown" and not 0.05 <= value <= 60:
                  problems.append(f"Crystal {field} outside 0.05..60: {value}")
              elif field == "HealAmount" and not 0 <= value <= 1000:
                  problems.append(f"Crystal {field} outside 0..1000: {value}")
              elif field == "UnlockLevels" and not 1 <= value <= 1000:
                  problems.append(f"Crystal {field} outside 1..1000: {value}")

          tide_block = re.search(r'TIDE\s*=\s*\{(?P<body>.*?)\n\s*\}', config, re.S)
          if not tide_block or not re.search(r'HealAmount\s*=\s*([0-9]+(?:\.[0-9]+)?)', tide_block.group("body")):
              problems.append("CrystalConfig TIDE ability must define HealAmount")
          if "CrystalConfig.Abilities.TIDE" not in ability_service:
              problems.append("CrystalAbilityService must consume shared TIDE ability config")
          if "HealAmount" not in ability_service:
              problems.append("CrystalAbilityService must consume configured HealAmount")

          if "local unlockLevels = crystalConfig.UnlockLevels" not in inventory_ui:
              problems.append("InventoryMenu must consume shared CrystalConfig.UnlockLevels")
          if "CrystalConfig.UnlockLevels" not in bootstrap:
              problems.append("Bootstrap must consume shared CrystalConfig.UnlockLevels")
          if "local unlockLevels = {" in inventory_ui:
              problems.append("InventoryMenu must not hardcode an unlock table")
          if "local crystalRequirements = {" in bootstrap:
              problems.append("Bootstrap must not hardcode a crystal unlock table")
          for marker in (
              "local function validUnlockLevel(id)",
              "local function hasDefinition(id)",
              "local function hasCombatConfig(id)",
              "and hasDefinition(id) and hasCombatConfig(id)",
              "raw % 1 ~= 0",
          ):
              if marker not in system:
                  problems.append(f"CrystalSystem missing strict config boundary: {marker}")
          if "required >= 1 and required % 1 == 0" not in player_data:
              problems.append("PlayerData must reject malformed persisted UnlockLevels")

          if problems:
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)

          print("CrystalConfig contract validated, including strict complete-config IDs and semantic numeric bounds.")
