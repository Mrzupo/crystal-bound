name: Combat Reward Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/combat-reward-autosave-sync-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical enemy reward source, autosave-safe sync, idempotency and attacker identity
        shell: python
        run: |
          from pathlib import Path

          enemy = Path('src/ReplicatedStorage/Config/EnemyConfig.lua').read_text(encoding='utf-8')
          combat = Path('src/ServerScriptService/Services/CombatService.lua').read_text(encoding='utf-8')
          damage = Path('src/ServerScriptService/Services/DamageService.lua').read_text(encoding='utf-8')
          if 'TrainingDummy = ' not in enemy or 'Drop = nil' not in enemy:
              raise SystemExit('TrainingDummy must remain explicitly non-dropping')
          for marker in (
              'local enemyConfig = EnemyConfig.Types[enemyType]',
              'if type(enemyConfig) ~= "table" then return end',
              'local xpGain = validNonNegativeInteger(enemyConfig.XP)',
              'local moneyGain = validNonNegativeInteger(enemyConfig.Money)',
              'local itemId = enemyConfig and enemyConfig.Drop',
              'targetModel:SetAttribute("DeathRewarded", true)',
              'local _, earnedMoney = EconomyService.AddMoney(profile, moneyGain)',
              'giveLoot(player, profile, targetModel, enemyConfig)',
              'CrystalMastery.AddXP(profile, crystalId, math.floor(xpGain * 0.5))',
          ):
              if marker not in combat:
                  raise SystemExit(f'CombatService canonical reward marker missing: {marker}')
          forbidden = (
              'action == "Ability" and 40 or 25',
              'action == "Ability" and 20 or 10',
              'math.max(10, math.floor(xpGain * 0.5))',
              '({ EMBER = "EmberShard", TIDE = "TidePearl", GALE = "GaleFeather" })',
              'currentMoney + moneyGain > EconomyConfig.MaxMoney',
              'Spend some Money before claiming enemy rewards.',
          )
          for marker in forbidden:
              if marker in combat:
                  raise SystemExit(f'Obsolete or implicit reward path still present: {marker}')

          fire_start = combat.index('local function fireProgress')
          fire_end = combat.index('local function completeQuest', fire_start)
          fire_block = combat[fire_start:fire_end]
          for marker in (
              'PlayerService.ShuttingDown',
              'PlayerService.Closing[player]',
              'local profile = PlayerService.Profiles[player]',
              'PlayerService.Sync(player, true)',
          ):
              if marker not in fire_block:
                  raise SystemExit(f'Combat reward autosave-safe sync marker missing: {marker}')
          if 'PlayerService.GetProfile(player)' in fire_block:
              raise SystemExit('Combat reward sync must not rely on GetProfile while autosave is active')

          for marker in (
              'targetModel:GetAttribute("DeathRewarded") == true',
              'targetModel:SetAttribute("DeathRewarded", true)',
              'local function rewardDefeat',
              'DamageService.ClearTarget(targetModel)',
          ):
              if marker not in combat:
                  raise SystemExit(f'Combat reward idempotency/cleanup marker missing: {marker}')

          if combat.index('targetModel:SetAttribute("DeathRewarded", true)') > combat.index('XPService.AddXP(profile, xpGain)'):
              raise SystemExit('DeathRewarded must be committed before reward mutations to prevent double payout')

          if combat.index('local _, earnedMoney = EconomyService.AddMoney(profile, moneyGain)') > combat.index('giveLoot(player, profile, targetModel, enemyConfig)'):
              raise SystemExit('Economy mutation must occur before loot/message completion in the reward transaction')

          for marker in (
              'lastAttackers[targetModel] = { Kind = "Player", Instance = attacker, UserId = attacker.UserId }',
              'Players:GetPlayerByUserId(record.UserId) == player',
              'model:IsDescendantOf(npcFolder)',
              'local previousAttacker = lastAttackers[targetModel]',
              'rememberAttacker(targetModel, request.Attacker)',
              'humanoid:TakeDamage(amount)',
              'if applied <= 0 and request.Attacker then',
          ):
              if marker not in damage:
                  raise SystemExit(f'DamageService reward attribution guard missing: {marker}')
          print('Canonical combat reward source, autosave-safe reward synchronization, wallet-cap-safe payout, idempotency, attacker-session, mastery-XP linkage, lethal-hit ordering and attribution cleanup validated.')
