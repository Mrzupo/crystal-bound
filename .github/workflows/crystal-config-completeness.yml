name: Crystal Config Completeness

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Crystal source completeness
        shell: python
        run: |
          import re
          from pathlib import Path

          text = Path("src/ReplicatedStorage/Config/CrystalConfig.lua").read_text(encoding="utf-8")

          def block(name):
              match = re.search(rf'{re.escape(name)}\s*=\s*\{{(.*?)\n\t\}},', text, re.S)
              if not match:
                  raise SystemExit(f"CrystalConfig missing block: {name}")
              return match.group(1)

          def table_keys(name):
              return set(re.findall(r'^\s*([A-Z][A-Z0-9_]*)\s*=\s*\{', block(name), re.M))

          def scalar_keys(name):
              return set(re.findall(r'^\s*([A-Z][A-Z0-9_]*)\s*=\s*-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?\s*,?$', block(name), re.M))

          definitions = table_keys("Definitions")
          unlock_levels = scalar_keys("UnlockLevels")
          basic_attack = table_keys("BasicAttack")
          abilities = table_keys("Abilities")
          passives = table_keys("Passives")

          if not definitions:
              raise SystemExit("CrystalConfig Definitions must expose at least one canonical Crystal")

          sources = {
              "UnlockLevels": unlock_levels,
              "BasicAttack": basic_attack,
              "Abilities": abilities,
              "Passives": passives,
          }
          for name, values in sources.items():
              if values != definitions:
                  raise SystemExit(f"CrystalConfig source drift for {name}: expected {sorted(definitions)}, found {sorted(values)}")

          print("CrystalConfig canonical Definitions, UnlockLevels, BasicAttack, Abilities and Passives completeness validated.")