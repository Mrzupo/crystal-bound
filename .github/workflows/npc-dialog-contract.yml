name: NPC Dialog Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-dialog-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server-owned NPC dialog
        shell: python
        run: |
          from pathlib import Path
          server = Path("src/ServerScriptService/NPCDialogRemote.server.lua").read_text(encoding="utf-8")
          client = Path("src/StarterPlayer/StarterPlayerScripts/NPCDialogMenu.client.lua").read_text(encoding="utf-8")
          config = Path("src/ReplicatedStorage/Modules/NPCDialogConfig.lua").read_text(encoding="utf-8")
          checks = [
              ("server proximity check", "isNearNPC(player, npcId)"),
              ("server config lookup", "local config = DialogConfig.Get(npcId)"),
              ("server options from config", "Options = config.Options"),
              ("client invokes server function", "dialogRequest:InvokeServer(npcId)"),
              ("client renders returned options", "for index, option in ipairs(data.Options or {}) do"),
              ("dialog config has known option IDs", 'Id = "QUEST"'),
          ]
          texts = [server, server, server, client, client, config]
          failures = [name for (name, marker), text in zip(checks, texts) if marker not in text]
          if failures:
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)
          print("NPC dialog contract validated.")
