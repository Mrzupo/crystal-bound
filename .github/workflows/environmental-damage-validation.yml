name: Environmental Damage Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate attacker-less damage boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          damage = Path('src/ServerScriptService/Services/DamageService.lua').read_text(encoding='utf-8')
          status = Path('src/ServerScriptService/Services/StatusEffectService.lua').read_text(encoding='utf-8')
          arena = Path('src/ServerScriptService/BossArena.server.lua').read_text(encoding='utf-8')
          if 'if request.DamageType == DamageTypes.Environmental then' not in damage or 'return request.Attacker == nil' not in damage:
              raise SystemExit('DamageService missing strict attacker-less Environmental gate')
          if 'DamageType = DamageTypes.Environmental' not in status:
              raise SystemExit('StatusEffectService environmental damage path missing explicit type')
          required_arena = (
              'DodgeService.ApplyDamage(player, humanoid, damage, nil, "Environmental", 0)',
              'local damage = math.clamp(finiteNumber(config.Damage, 0), 0, 1000)',
              'local halfExtent = math.clamp(finiteNumber(config.HalfExtent, 23), 0, 1000)',
          )
          for marker in required_arena:
              if marker not in arena:
                  raise SystemExit(f'BossArena environmental hazard marker missing: {marker}')
          print('Environmental damage boundaries validated.')
          PY
