name: Session Lock Type Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/session-lock-type-fail-closed"]
  pull_request:

jobs:
  validate-session-lock-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate malformed SessionLock types fail closed
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/ReplicatedStorage/Modules/SafeProfileStore.lua").read_text(encoding="utf-8")
          required = [
              "local malformedSessionLock = false",
              "if data.SessionLock ~= nil and type(data.SessionLock) ~= \"table\" then",
              "malformedSessionLock = true",
              "return current",
              "if malformedSessionLock then",
              "return nil, \"Invalid SessionLock data\"",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit("SessionLock type fail-closed contract missing: " + ", ".join(missing))
          print("Malformed non-table SessionLock values fail closed and cannot be claimed by a new session.")
