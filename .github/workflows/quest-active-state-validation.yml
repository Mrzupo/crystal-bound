name: Quest Active State Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-active-quest contract
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/ReplicatedStorage/Modules/QuestSystem.lua").read_text(encoding="utf-8")
          if "#(profile.ActiveQuests or {}) > 0" not in text:
              raise SystemExit("QuestSystem must reject starting a second active quest")
          if "Finish your active quest first." not in text:
              raise SystemExit("QuestSystem must expose the active-quest rejection message")

      - name: Validate QuestService is the only completion authority
        shell: python
        run: |
          from pathlib import Path
          root = Path("src/ServerScriptService")
          violations = []
          for path in root.rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if "QuestSystem.Complete(" in text and str(path) != "src/ServerScriptService/Services/QuestService.lua":
                  violations.append(str(path))
          if violations:
              print("Direct QuestSystem.Complete calls outside QuestService:")
              for path in violations:
                  print(f" - {path}")
              raise SystemExit(1)
          print("Quest completion authority contract validated.")
