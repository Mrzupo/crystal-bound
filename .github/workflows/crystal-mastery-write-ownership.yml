name: Crystal Mastery Write Ownership

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CrystalMastery mutation owners and ownership guards
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("src")
          patterns = [
              re.compile(r'profile\.CrystalMastery\s*='),
              re.compile(r'profile\.CrystalMastery\[[^\]]+\]\s*='),
          ]
          allowed = {
              "ReplicatedStorage/Modules/CrystalMastery.lua",
              "ReplicatedStorage/Modules/PlayerData.lua",
          }
          violations = []
          for path in root.rglob("*.lua"):
              relative = str(path.relative_to(root))
              text = path.read_text(encoding="utf-8")
              if any(pattern.search(text) for pattern in patterns) and relative not in allowed:
                  violations.append(relative)
          if violations:
              raise SystemExit("CrystalMastery writes outside canonical owners: " + ", ".join(violations))

          mastery = (root / "ReplicatedStorage/Modules/CrystalMastery.lua").read_text(encoding="utf-8")
          for marker in (
              'local function ownsCrystal(profile, crystalId)',
              'not validCrystalId(crystalId) or not ownsCrystal(profile, crystalId)',
              'type(profile) ~= "table" or not validCrystalId(crystalId) or not ownsCrystal(profile, crystalId)',
          ):
              if marker not in mastery:
                  raise SystemExit("CrystalMastery ownership guard missing: " + marker)

          print("CrystalMastery write ownership and profile-ownership guards validated.")
