name: Module Dependency Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unsafe PlayerService/StatusEffectService top-level require cycle
        shell: python
        run: |
          from pathlib import Path

          player = Path('src/ServerScriptService/Services/PlayerService.lua').read_text(encoding='utf-8')
          status = Path('src/ServerScriptService/Services/StatusEffectService.lua').read_text(encoding='utf-8')

          player_header = player.split('local PlayerService = {', 1)[0]
          status_header = status.split('local StatusEffectService = {}', 1)[0]

          allowed_dependency = 'local StatusEffectService = require(script.Parent.StatusEffectService)'
          reverse_dependency = 'local PlayerService = require(script.Parent.PlayerService)'

          if allowed_dependency not in player_header:
              raise SystemExit('PlayerService must retain its current StatusEffectService dependency until a safe lazy-module refactor is implemented')
          if reverse_dependency in status_header:
              raise SystemExit('StatusEffectService must not top-level require PlayerService; that would create a circular module-init dependency')
          if 'local active = setmetatable({}, { __mode = "k" })' not in status:
              raise SystemExit('StatusEffectService must retain weak Humanoid state storage')

          print('Player/StatusEffectService module-init dependency boundary validated; the current one-way require is preserved and the reverse cycle is forbidden.')
