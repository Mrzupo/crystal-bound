name: Movement Observed Speed Authority

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/movement-authority-cap-v5"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure observed movement cap stays tied to canonical authority and Dodge
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/MovementConfig.lua").read_text(encoding="utf-8")
          values = {
              key: float(value)
              for key, value in re.findall(
                  r"(BaseWalkSpeed|MaxWalkSpeedBonus|MaxObservedSpeed|ExtraDistanceTolerance)\s*=\s*([0-9.]+)",
                  config,
              )
          }
          required = ("BaseWalkSpeed", "MaxWalkSpeedBonus", "MaxObservedSpeed", "ExtraDistanceTolerance")
          missing = [key for key in required if key not in values]
          if missing:
              raise SystemExit("movement authority config missing: " + ", ".join(missing))

          dodge = Path("src/ReplicatedStorage/Config/DodgeConfig.lua").read_text(encoding="utf-8")
          dodge_match = re.search(r"Boost\s*=\s*([0-9.]+)", dodge)
          if not dodge_match:
              raise SystemExit("DodgeConfig missing Boost")
          dodge_boost = float(dodge_match.group(1))

          canonical_max = values["BaseWalkSpeed"] + values["MaxWalkSpeedBonus"]
          allowed_observed_max = canonical_max + values["ExtraDistanceTolerance"]
          if values["MaxObservedSpeed"] > allowed_observed_max:
              raise SystemExit(
                  f"MaxObservedSpeed {values['MaxObservedSpeed']} exceeds canonical max {canonical_max} "
                  f"plus tolerance {values['ExtraDistanceTolerance']}"
              )
          if values["MaxObservedSpeed"] < dodge_boost:
              raise SystemExit(
                  f"MaxObservedSpeed {values['MaxObservedSpeed']} is below configured Dodge Boost {dodge_boost}"
              )

          guard = Path("src/ServerScriptService/StatusSpeedGuardV2.server.lua").read_text(encoding="utf-8")
          for marker in ("MAX_OBSERVED_SPEED", "EXTRA_DISTANCE_TOLERANCE", "displacement > allowed"):
              if marker not in guard:
                  raise SystemExit(f"StatusSpeedGuardV2 missing movement authority marker: {marker}")

          client_writers = []
          authoritative_patterns = (
              r"\b(?:root|playerRoot|humanoidRootPart)\.AssemblyLinearVelocity\s*=",
              r"\b(?:root|playerRoot|humanoidRootPart)\.CFrame\s*=",
              r"\b(?:character|playerCharacter)\s*:\s*PivotTo\s*\(",
          )
          for path in Path("src/StarterPlayer").rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              if any(re.search(pattern, text) for pattern in authoritative_patterns):
                  client_writers.append(str(path))
          if client_writers:
              raise SystemExit("Client scripts must not write authoritative Character movement physics: " + ", ".join(client_writers))

          print("Observed movement cap is tied to canonical server authority and configured Dodge Boost; client presentation CFrame writes are allowed.")
