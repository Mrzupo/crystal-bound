name: Crafting Rate Limit Contract V2

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/crafting-rate-limit-before-validation-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Crafting rate limit is consumed before request validation
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/ServerScriptService/CraftingRemote.server.lua").read_text(encoding="utf-8")
          gate = text.index("local now = os.clock()")
          consume = text.index("NEXT_REQUEST[player] = now + REQUEST_INTERVAL", gate)
          validate = text.index('if action ~= "Craft" then return end', consume)
          if not consume < validate:
              raise SystemExit("Crafting rate-limit window must be consumed before action/profile validation")
          if "Players.PlayerRemoving:Connect(function(player)" not in text:
              raise SystemExit("Crafting rate-limit state must be cleaned on PlayerRemoving")
          print("Crafting requests consume the per-player rate-limit window before malformed action/profile validation.")
