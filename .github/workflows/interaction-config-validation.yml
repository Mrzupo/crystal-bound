name: Interaction Config Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-interaction-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate centralized NPC interaction range
        shell: python
        run: |
          from pathlib import Path
          config = Path("src/ReplicatedStorage/Config/InteractionConfig.lua").read_text(encoding="utf-8")
          for path in [
              "src/ServerScriptService/Bootstrap.server.lua",
              "src/ServerScriptService/ShopRemote.server.lua",
              "src/ServerScriptService/CraftingRemote.server.lua",
              "src/ServerScriptService/NPCDialogRemote.server.lua",
              "src/ServerScriptService/NPCMenuBridge.server.lua",
          ]:
              text = Path(path).read_text(encoding="utf-8")
              if "InteractionConfig" not in text:
                  raise SystemExit(f"{path} must consume shared InteractionConfig")
          bridge = Path("src/ServerScriptService/NPCMenuBridge.server.lua").read_text(encoding="utf-8")
          if "isNearModel" not in bridge or "and isNearModel(player, model)" not in bridge:
              raise SystemExit("NPCMenuBridge must validate prompt interaction distance server-side")
          if "NPCInteractionRange" not in config:
              raise SystemExit("InteractionConfig must define NPC interaction range")

      - name: Validate NPC dialog options map to real menu attributes
        shell: python
        run: |
          from pathlib import Path
          import re

          dialog = Path("src/ReplicatedStorage/Modules/NPCDialogConfig.lua").read_text(encoding="utf-8")
          menu = Path("src/StarterPlayer/StarterPlayerScripts/NPCDialogMenu.client.lua").read_text(encoding="utf-8")
          required_options = {"QUEST", "CRYSTAL", "SHOP", "INVENTORY", "CRAFT"}
          declared = set(re.findall(r'Id = "([A-Z_]+)"', dialog))
          missing = sorted(required_options - declared)
          if missing:
              raise SystemExit(f"NPCDialogConfig is missing required option IDs: {missing}")

          option_to_attribute = {
              "QUEST": "OpenQuestMenu",
              "CRYSTAL": "OpenCrystalMenu",
              "SHOP": "OpenShopMenu",
              "INVENTORY": "OpenCrystalMenu",
              "CRAFT": "OpenCraftingMenu",
          }
          for option, attribute in option_to_attribute.items():
              if option in declared and attribute not in menu:
                  raise SystemExit(f"NPCDialogMenu missing target attribute {attribute} for option {option}")
          print("NPC dialog option target contract validated.")
