name: Crystal Bound Remote Handler Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-remote-handlers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure unique RemoteFunction handlers
        shell: python
        run: |
          from pathlib import Path

          owners = {
              "GetPlayerData": (Path("src/ServerScriptService/Bootstrap.server.lua"), "remotes.GetPlayerData.OnServerInvoke"),
              "GetQuestData": (Path("src/ServerScriptService/Bootstrap.server.lua"), "remotes.GetQuestData.OnServerInvoke"),
              "GetAvailableQuests": (Path("src/ServerScriptService/QuestAvailability.server.lua"), "remote.OnServerInvoke"),
              "NPCDialogRequest": (Path("src/ServerScriptService/NPCDialogRemote.server.lua"), "remote.OnServerInvoke"),
          }

          problems = []
          root = Path("src")
          for name, (owner_path, marker) in owners.items():
              if not owner_path.is_file():
                  problems.append(f"{name} owner file is missing: {owner_path}")
                  continue
              text = owner_path.read_text(encoding="utf-8")
              count = text.count(marker)
              if count != 1:
                  problems.append(f"{name} must have exactly one handler marker in {owner_path}; found {count}")

          for name, (owner_path, marker) in owners.items():
              for path in root.rglob("*.lua"):
                  if path == owner_path:
                      continue
                  text = path.read_text(encoding="utf-8")
                  if name == "GetPlayerData" and "GetPlayerData.OnServerInvoke" in text:
                      problems.append(f"GetPlayerData has an unexpected secondary handler in {path}")
                  elif name == "GetQuestData" and "GetQuestData.OnServerInvoke" in text:
                      problems.append(f"GetQuestData has an unexpected secondary handler in {path}")

          if problems:
              for problem in problems:
                  print(problem)
              raise SystemExit(1)

          print("RemoteFunction handler ownership validated against canonical owner files.")