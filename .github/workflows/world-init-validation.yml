name: World Initialization Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate world initialization, decor idempotency and portal lifecycle contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import re
          decor = Path('src/ServerScriptService/WorldDecor.server.lua').read_text(encoding='utf-8')
          theme = Path('src/ServerScriptService/WorldTheme.server.lua').read_text(encoding='utf-8')
          bootstrap = Path('src/ServerScriptService/Bootstrap.server.lua').read_text(encoding='utf-8')
          world = Path('src/ReplicatedStorage/Config/WorldConfig.lua').read_text(encoding='utf-8')

          for marker in ['StarterDecorReady', 'TideDecorReady', 'WindDecorReady', 'DecorReady']:
              if marker not in decor:
                  raise SystemExit(f'missing world decor idempotency marker: {marker}')
          for marker in ['CrystalBoundDecor', 'local function clearDecor(island, markerName)', 'local function hasCount(island, name, expected)']:
              if marker not in decor:
                  raise SystemExit(f'WorldDecor partial-repair marker missing: {marker}')
          for marker in ['hasCount(starter, "TreeTrunk", 4)', 'hasCount(tide, "AncientCrystal", 9)', 'hasCount(ancient, "AncientPillar", 4)', 'hasCount(wind, "WindRock", 3)']:
              if marker not in decor:
                  raise SystemExit(f'WorldDecor structural readiness marker missing: {marker}')
          for island in ['StarterIsland', 'TideIsland', 'WindIsland', 'AncientRuins']:
              if island not in theme:
                  raise SystemExit(f'missing world theme: {island}')

          required_tracking = [
              'local PlayerService = require(script.Parent.Services.PlayerService)',
              'while islands.Parent and not PlayerService.ShuttingDown do',
              'task.wait(0.1)',
              'Players.PlayerRemoving:Connect(function(player)',
              'portalCandidates[player] = nil',
              'portalCooldowns[player] = nil',
              'portalCooldownTokens[player] = (portalCooldownTokens[player] or 0) + 1',
              'portalCooldownTokens = setmetatable({}, { __mode = "k" })',
              'local cooldownToken = (portalCooldownTokens[player] or 0) + 1',
              'portalCooldownTokens[player] == cooldownToken',
              'lastPositions[player] = nil',
              'local playerConnections = setmetatable({}, { __mode = "k" })',
              'local readyCharacters = setmetatable({}, { __mode = "k" })',
              'local function disconnectPlayer(player)',
              'playerConnections[player] = connections',
              'connections[#connections + 1] = player.CharacterAdded:Connect',
              'connections[#connections + 1] = player:GetAttributeChangedSignal("ProfileLoaded"):Connect',
              'disconnectPlayer(player)',
              'readyCharacters[player] = nil',
              'if not player or PlayerService.ShuttingDown or readyCharacters[player] ~= character or player.Character ~= character or portalCooldowns[player] then return end',
              'if not player.Parent or PlayerService.ShuttingDown or readyCharacters[player] ~= character or player.Character ~= character then return end',
              'if player.Parent and not PlayerService.ShuttingDown and readyCharacters[player] == candidate.Character and player.Character == candidate.Character then',
              'local function getLoadedProfileForPortal(player)',
          ]
          for marker in required_tracking:
              if marker not in theme:
                  raise SystemExit(f'WorldTheme lifecycle/tracking marker missing: {marker}')

          level_matches = re.findall(r'\bLevel\s*=\s*(-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)', world)
          if len(level_matches) != 4:
              raise SystemExit(f'WorldConfig must define exactly four numeric island levels; found {len(level_matches)}')
          levels = [float(value) for value in level_matches]
          if any(not math.isfinite(level) or level < 1 or level > 1000 or level % 1 != 0 for level in levels):
              raise SystemExit('WorldConfig island levels must be finite integers within 1..1000')
          if levels != sorted(levels) or len(set(levels)) != len(levels):
              raise SystemExit('WorldConfig island levels must be strictly increasing from Starter to Ancient')

          centers = [float(value) for value in re.findall(r'Center\s*=\s*Vector3\.new\(\s*(-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)\s*,', world)]
          if len(centers) != 4 or any(not math.isfinite(value) for value in centers) or centers != sorted(centers):
              raise SystemExit('WorldConfig island centers must be finite and progress monotonically along the current world axis')

          size_matches = re.findall(r'Size\s*=\s*Vector3\.new\(\s*([^,]+),\s*([^,]+),\s*([^\)]+)\)', world)
          if len(size_matches) != 4:
              raise SystemExit('WorldConfig must define exactly four island sizes')
          for raw_size in size_matches:
              values = []
              for raw in raw_size:
                  try:
                      value = float(raw.strip())
                  except ValueError:
                      raise SystemExit(f'WorldConfig island size is not numeric: {raw!r}')
                  if not math.isfinite(value) or value <= 0 or value > 2000:
                      raise SystemExit('WorldConfig island sizes must be finite, positive and <= 2000 units')
                  values.append(value)

          if 'createPortal(' not in bootstrap:
              raise SystemExit('Bootstrap must create canonical portal definitions')
          if 'portal.Touched:Connect' in bootstrap or 'root.CFrame = CFrame.new(destination)' in bootstrap:
              raise SystemExit('Bootstrap must not own portal touch/teleport authority; WorldTheme is canonical')

          print('World initialization, partial-repair decor idempotency, monotonic progression, bounded config, autosave-safe portal authority, character-bound readiness token, tokenized portal lifecycle and shutdown lifecycle validated.')
          PY
