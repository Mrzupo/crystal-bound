name: Movement Config Negative Contract V2

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/movement-config-negative-contract-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signed MovementConfig numeric coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/MovementConfig.lua").read_text(encoding="utf-8")
          fields = (
              "BaseWalkSpeed", "MinWalkSpeed", "MaxWalkSpeedBonus", "MinSlowMultiplier",
              "MaxSlowMultiplier", "MaxObservedSpeed", "ExtraDistanceTolerance",
              "GraceDuration", "PositionCheckInterval", "PortalArrivalTolerance",
          )
          values = {}
          for field in fields:
              match = re.search(rf"{field}\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)
              if not match:
                  raise SystemExit(f"MovementConfig missing numeric field: {field}")
              values[field] = float(match.group(1))

          checks = (
              ("MinWalkSpeed", 1, values["BaseWalkSpeed"]),
              ("BaseWalkSpeed", 1, 200),
              ("MaxWalkSpeedBonus", 0, 100),
              ("MinSlowMultiplier", 0.01, values["MaxSlowMultiplier"]),
              ("MaxSlowMultiplier", values["MinSlowMultiplier"], 10),
              ("MaxObservedSpeed", 16, 200),
              ("ExtraDistanceTolerance", 2, 50),
              ("GraceDuration", 0.1, 5),
              ("PositionCheckInterval", 0.05, 1),
              ("PortalArrivalTolerance", 4, 50),
          )
          for field, minimum, maximum in checks:
              if values[field] < minimum or values[field] > maximum:
                  raise SystemExit(f"MovementConfig {field} outside {minimum}..{maximum}: {values[field]}")
          if values["MinSlowMultiplier"] > values["MaxSlowMultiplier"]:
              raise SystemExit("MovementConfig slow multiplier ordering is invalid")
          if values["MinWalkSpeed"] > values["BaseWalkSpeed"]:
              raise SystemExit("MovementConfig walk speed ordering is invalid")

          print("MovementConfig signed-number coverage rejects malformed negative, inverted and fractional bounds.")
