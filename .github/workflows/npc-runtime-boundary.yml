name: NPC Runtime Boundary

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NPC AI runtime boundaries
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/ServerScriptService/Services/NPCService.lua").read_text(encoding="utf-8")
          required = [
              'local aggroRange = finiteNumber(config and config.AggroRange, 0)',
              'local attackRange = math.clamp(finiteNumber(config and config.AttackRange, 0), 0, 1000)',
              'local attackCooldown = math.clamp(finiteNumber(config and config.AttackCooldown, 1), 0.25, 60)',
              'local attackDamage = math.clamp(finiteNumber(config and config.AttackDamage, 0), 0, 1000)',
              'model:GetAttribute("AIStarted") == true',
              'model:SetAttribute("AIStarted", true)',
              'local specialCooldown = math.clamp(finiteNumber(specialConfig.Cooldown, 6), 0.25, 60)',
              'local specialRange = math.clamp(finiteNumber(specialConfig.Range, 0), 0, 1000)',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("NPC runtime boundary markers missing: " + ", ".join(missing))

          enemy_config = Path("src/ReplicatedStorage/Config/EnemyConfig.lua").read_text(encoding="utf-8")
          if "AggroRange =" not in enemy_config:
              raise SystemExit("EnemyConfig must define canonical AggroRange bounds")
          print("NPC AI idempotency and runtime configuration boundaries validated against canonical EnemyConfig.")
