name: Persistence Save Snapshot Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate callback-time profile snapshot and retry isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/ReplicatedStorage/Modules/SafeProfileStore.lua').read_text(encoding='utf-8')
          save_block = source.split('function SafeProfileStore.Save', 1)[1].split('function SafeProfileStore.Refresh', 1)[0]
          if 'local payload = PlayerData.Reconcile(clone(profile))' not in save_block:
              raise SystemExit('Save must snapshot the current profile inside UpdateAsync callback')
          prefix = save_block.split('local ok, result = retry', 1)[0]
          if 'local payload = PlayerData.Reconcile(clone(profile))' in prefix:
              raise SystemExit('Save contains a stale pre-callback payload snapshot')
          if 'saved = false' not in save_block.split('return store:UpdateAsync', 1)[0]:
              raise SystemExit('Save retry state must reset saved before every UpdateAsync attempt')

          refresh_block = source.split('function SafeProfileStore.Refresh', 1)[1].split('function SafeProfileStore.Release', 1)[0]
          if 'refreshed = false' not in refresh_block.split('return store:UpdateAsync', 1)[0]:
              raise SystemExit('Refresh retry state must reset refreshed before every UpdateAsync attempt')

          release_block = source.split('function SafeProfileStore.Release', 1)[1]
          if 'released = false' not in release_block.split('return store:UpdateAsync', 1)[0]:
              raise SystemExit('Release retry state must reset released before every UpdateAsync attempt')

          print('Persistence snapshot and retry-state isolation validated.')
          PY
