name: NPC Stale Death Callback Contract

on:
  push:
    branches:
      - "main"
      - "agent/complete-crystal-bound-foundation"
      - "agent/status-effect-stale-callback-contract"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NPC death cleanup and lifecycle guards
        shell: python
        run: |
          from pathlib import Path

          npc = Path("src/ServerScriptService/Services/NPCService.lua").read_text(encoding="utf-8")
          path = Path("src/ServerScriptService/Services/AIPathService.lua").read_text(encoding="utf-8")

          required_npc = [
              "function NPCService.StartEnemyAI(model)",
              "if model:GetAttribute(\"AIStarted\") == true then return false end",
              "while model.Parent and humanoid.Health > 0 do",
              "AIPathService.Clear(model)",
              "StatusEffectService.Clear(humanoid)",
              "humanoid.Died:Connect(function()",
              "if model.Parent then model:Destroy() end",
          ]
          missing = [marker for marker in required_npc if marker not in npc]
          if missing:
              raise SystemExit("NPC lifecycle guard missing: " + ", ".join(missing))

          required_path = [
              "local function isLiveModel(model)",
              "if not isLiveModel(model) then",
              "cache[model] = nil",
              "path:ComputeAsync(rootPosition, destination)",
              "if not ok or path.Status ~= Enum.PathStatus.Success then",
          ]
          missing = [marker for marker in required_path if marker not in path]
          if missing:
              raise SystemExit("AI path stale-result guard missing: " + ", ".join(missing))

          died = npc.index("humanoid.Died:Connect(function()")
          cleanup = npc.index("AIPathService.Clear(model)", died)
          destroy = npc.index("model:Destroy()", cleanup)
          if not (died < cleanup < destroy):
              raise SystemExit("NPC death cleanup must precede delayed destruction")

          print("NPC AI and death cleanup remain lifecycle-bound and stale path results remain rejected.")
