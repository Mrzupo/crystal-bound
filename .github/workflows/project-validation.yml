name: Crystal Bound Project Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Rojo project mapping
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path(".")
          project_path = root / "default.project.json"
          data = json.loads(project_path.read_text(encoding="utf-8"))
          tree = data.get("tree")

          if not isinstance(tree, dict):
              raise SystemExit("default.project.json: missing tree object")

          referenced = []

          def walk(node):
              if not isinstance(node, dict):
                  return
              path = node.get("$path")
              if isinstance(path, str):
                  referenced.append(path)
              for value in node.values():
                  walk(value)

          walk(tree)

          missing = []
          for path in referenced:
              if not (root / path).is_file():
                  missing.append(path)

          if missing:
              print("Missing files referenced by default.project.json:")
              for path in missing:
                  print(f" - {path}")
              raise SystemExit(1)

          print(f"Validated {len(referenced)} mapped files.")

      - name: Validate active security modules
        shell: python
        run: |
          import json
          from pathlib import Path

          project = json.loads(Path("default.project.json").read_text(encoding="utf-8"))
          server_scripts = project["tree"]["ServerScriptService"]
          expected = "src/ServerScriptService/StatusSpeedGuardV2.server.lua"
          actual = server_scripts.get("StatusSpeedGuardV2", {}).get("$path")
          if actual != expected:
              raise SystemExit(f"Rojo must load StatusSpeedGuardV2, found: {actual!r}")
          if "StatusSpeedGuard" in server_scripts:
              raise SystemExit("Legacy StatusSpeedGuard mapping must not be loaded")
          if Path("src/ReplicatedStorage/Modules/SaveSystem.lua").exists():
              raise SystemExit("Legacy unsafe SaveSystem.lua must not exist")
          print("Active security modules validated.")

      - name: Validate JSON files
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")

      - name: Validate common Luau require paths
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path("src")
          problems = []

          patterns = [
              (re.compile(r'require\(game\.ReplicatedStorage\.Config\.([A-Za-z0-9_]+)\)'), "src/ReplicatedStorage/Config/{}.lua"),
              (re.compile(r'require\(ReplicatedStorage\.Config\.([A-Za-z0-9_]+)\)'), "src/ReplicatedStorage/Config/{}.lua"),
              (re.compile(r'require\(game\.ReplicatedStorage\.Modules\.([A-Za-z0-9_]+)\)'), "src/ReplicatedStorage/Modules/{}.lua"),
              (re.compile(r'require\(ReplicatedStorage\.Modules\.([A-Za-z0-9_]+)\)'), "src/ReplicatedStorage/Modules/{}.lua"),
              (re.compile(r'require\(script\.Parent\.Services\.([A-Za-z0-9_]+)\)'), "src/ServerScriptService/Services/{}.lua"),
          ]

          for path in root.rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              for pattern, template in patterns:
                  for match in pattern.finditer(text):
                      target = Path(template.format(match.group(1)))
                      if not target.is_file():
                          problems.append(f"{path}: missing require target {target}")

          if problems:
              print("Missing common require targets:")
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)

          print("Common Luau require targets validated.")

      - name: Validate cross-file gameplay references
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path("src")
          inventory_text = (root / "ReplicatedStorage/Config/InventoryConfig.lua").read_text(encoding="utf-8")
          enemy_text = (root / "ReplicatedStorage/Config/EnemyConfig.lua").read_text(encoding="utf-8")
          boss_text = (root / "ReplicatedStorage/Config/BossConfig.lua").read_text(encoding="utf-8")
          quest_text = (root / "ReplicatedStorage/Modules/QuestSystem.lua").read_text(encoding="utf-8")
          shop_text = (root / "ServerScriptService/Services/ShopService.lua").read_text(encoding="utf-8")
          crafting_text = (root / "ServerScriptService/Services/CraftingService.lua").read_text(encoding="utf-8")
          upgrade_text = (root / "ReplicatedStorage/Config/CrystalUpgradeConfig.lua").read_text(encoding="utf-8")

          item_ids = set(re.findall(r'Id\s*=\s*"([A-Za-z0-9_]+)"', inventory_text))
          enemy_types = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*=\s*\{', enemy_text, re.MULTILINE))
          boss_types = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*=\s*\{', boss_text, re.MULTILINE))
          enemy_drops = set(re.findall(r'Drop\s*=\s*"([A-Za-z0-9_]+)"', enemy_text))
          boss_drops = set(re.findall(r'Drop\s*=\s*"([A-Za-z0-9_]+)"', boss_text))
          quest_enemy_types = set(re.findall(r'EnemyType\s*=\s*"([A-Za-z0-9_]+)"', quest_text))
          shop_items = set(re.findall(r'ItemId\s*=\s*"([A-Za-z0-9_]+)"', shop_text))
          recipe_outputs = set(re.findall(r'Output\s*=\s*"([A-Za-z0-9_]+)"', crafting_text))
          recipe_inputs = set(re.findall(r'([A-Za-z0-9_]+)\s*=\s*\d+', crafting_text.split('Inputs =', 1)[1]) if 'Inputs =' in crafting_text else [])
          upgrade_block = upgrade_text.split('BaseCosts', 1)[1] if 'BaseCosts' in upgrade_text else ''
          upgrade_items = set(re.findall(r'\{\s*([A-Za-z0-9_]+)\s*=\s*\d+\s*\}', upgrade_block))

          problems = []
          for item in sorted(enemy_drops | boss_drops | shop_items | recipe_outputs | recipe_inputs | upgrade_items):
              if item not in item_ids:
                  problems.append(f"Missing inventory item referenced by gameplay config: {item}")

          for enemy in sorted(quest_enemy_types):
              if enemy not in enemy_types and enemy not in boss_types:
                  problems.append(f"Quest references unknown enemy/boss type: {enemy}")

          if problems:
              print("Cross-file gameplay reference problems:")
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)

          print("Cross-file gameplay references validated.")

      - name: Validate Remote references
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path("src")
          project = Path("default.project.json").read_text(encoding="utf-8")
          remote_names = set(re.findall(r'"([A-Za-z0-9_]+)": \{"\$className": "Remote(?:Event|Function)"\}', project))
          patterns = [
              re.compile(r'Remotes:WaitForChild\("([A-Za-z0-9_]+)"\)'),
              re.compile(r'Remotes:FindFirstChild\("([A-Za-z0-9_]+)"\)'),
              re.compile(r'remotes:WaitForChild\("([A-Za-z0-9_]+)"\)'),
              re.compile(r'remotes:FindFirstChild\("([A-Za-z0-9_]+)"\)'),
              re.compile(r'remotes\.([A-Za-z0-9_]+)\b'),
          ]
          ignore = {"Parent", "Name", "WaitForChild", "FindFirstChild"}
          referenced = set()
          for path in root.rglob("*.lua"):
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  referenced.update(pattern.findall(text))
          missing = sorted(name for name in referenced if name not in remote_names and name not in ignore)
          if missing:
              print("Remote names referenced by Luau but not declared in default.project.json:")
              for name in missing:
                  print(f" - {name}")
              raise SystemExit(1)
          print("Remote references validated.")

      - name: Validate balancing invariants
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path("src")
          xp = (root / "ReplicatedStorage/Config/XPConfig.lua").read_text(encoding="utf-8")
          crystal = (root / "ReplicatedStorage/Config/CrystalConfig.lua").read_text(encoding="utf-8")
          mastery = (root / "ReplicatedStorage/Config/CrystalUpgradeConfig.lua").read_text(encoding="utf-8")
          enemies = (root / "ReplicatedStorage/Config/EnemyConfig.lua").read_text(encoding="utf-8")
          bosses = (root / "ReplicatedStorage/Config/BossConfig.lua").read_text(encoding="utf-8")
          economy = (root / "ReplicatedStorage/Config/EconomyConfig.lua").read_text(encoding="utf-8")

          problems = []
          max_level_match = re.search(r'MaxLevel\s*=\s*(\d+)', xp)
          if not max_level_match or int(max_level_match.group(1)) <= 0:
              problems.append("XPConfig.MaxLevel must be a positive integer")

          for label, text in (("CrystalConfig", crystal), ("CrystalUpgradeConfig", mastery)):
              numbers = [float(value) for value in re.findall(r'=\s*(-?\d+(?:\.\d+)?)', text)]
              if any(value < 0 for value in numbers):
                  problems.append(f"{label} contains a negative numeric config value")

          for label, text in (("EnemyConfig", enemies), ("BossConfig", bosses)):
              pairs = re.findall(r'(Health|XP|Money|AttackDamage|AttackCooldown|DropChance)\s*=\s*([0-9]+(?:\.[0-9]+)?)', text)
              for key, raw in pairs:
                  value = float(raw)
                  if key in {"Health", "XP", "Money", "AttackDamage", "AttackCooldown"} and value < 0:
                      problems.append(f"{label} has negative {key}")
                  if key == "DropChance" and not 0 <= value <= 1:
                      problems.append(f"{label} has invalid DropChance {value}")

          limits = re.findall(r'(MinMoney|MaxMoney)\s*=\s*([0-9]+)', economy)
          limit_map = {key: int(value) for key, value in limits}
          if "MinMoney" in limit_map and "MaxMoney" in limit_map and limit_map["MinMoney"] > limit_map["MaxMoney"]:
              problems.append("EconomyConfig MinMoney must not exceed MaxMoney")

          if problems:
              print("Balancing invariant problems:")
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("Balancing invariants validated.")
