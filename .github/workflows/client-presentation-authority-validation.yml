name: Client Presentation Authority Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-client-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CombatPresentation is cosmetic only
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/StarterPlayer/StarterPlayerScripts/CombatPresentation.client.lua")
          text = path.read_text(encoding="utf-8")
          forbidden = [
              ":TakeDamage(",
              "InventoryService",
              "EconomyService",
              "XPService",
              "PlayerService.GetProfile",
              "FireServer(\"Combat",
          ]
          problems = [needle for needle in forbidden if needle in text]
          if problems:
              for problem in problems:
                  print(f" - forbidden gameplay authority reference: {problem}")
              raise SystemExit(1)
          print("CombatPresentation authority boundary validated.")

      - name: Validate Crystal VFX requires confirmed CombatFeedback
        shell: python
        run: |
          from pathlib import Path

          vfx = Path("src/StarterPlayer/StarterPlayerScripts/CrystalVFXController.client.lua").read_text(encoding="utf-8")
          bridge = Path("src/StarterPlayer/StarterPlayerScripts/ConfirmedCombatVFXBridge.client.lua").read_text(encoding="utf-8")

          if "CrystalVFXAuthorizedAt" not in vfx or "hasServerConfirmation" not in vfx:
              raise SystemExit("CrystalVFXController must require server-confirmation state")
          if "combatFeedback.OnClientEvent" not in bridge or "vfx.Play(action, crystalId)" not in bridge:
              raise SystemExit("ConfirmedCombatVFXBridge must route server CombatFeedback into CrystalVFXController")
          if "CrystalVFXAuthorizedAction" not in bridge or "CrystalVFXAuthorizedCrystal" not in bridge:
              raise SystemExit("ConfirmedCombatVFXBridge must bind authorization to the confirmed action and Crystal")
          print("Confirmed Crystal VFX presentation boundary validated.")
