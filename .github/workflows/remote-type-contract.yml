name: Remote Type Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-remote-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate critical RemoteEvent/RemoteFunction types
        shell: python
        run: |
          import json
          from pathlib import Path

          project = json.loads(Path("default.project.json").read_text(encoding="utf-8"))
          remotes = project["tree"]["ReplicatedStorage"]["Remotes"]
          expected_events = {
              "CombatRequest", "CombatFeedback", "QuestRequest", "InventoryRequest",
              "CrystalChanged", "CrystalMasteryChanged", "CrystalUpgradeRequest",
              "DodgeRequest", "ShopRequest", "UseItemRequest", "CraftingRequest",
              "XPChanged", "LevelUp", "MoneyChanged", "InventoryChanged",
          }
          expected_functions = {"NPCDialogRequest", "GetPlayerData", "GetQuestData", "GetAvailableQuests"}

          problems = []
          for name in sorted(expected_events):
              entry = remotes.get(name)
              if not isinstance(entry, dict) or entry.get("$className") != "RemoteEvent":
                  problems.append(f"{name} must be a RemoteEvent")
          for name in sorted(expected_functions):
              entry = remotes.get(name)
              if not isinstance(entry, dict) or entry.get("$className") != "RemoteFunction":
                  problems.append(f"{name} must be a RemoteFunction")

          fail_fast_files = {
              "src/ServerScriptService/Bootstrap.server.lua": ["CombatRequest", "GetPlayerData"],
              "src/ServerScriptService/CombatFeedbackRemote.server.lua": ["CombatFeedback"],
              "src/ServerScriptService/ShopRemote.server.lua": ["ShopRequest"],
              "src/ServerScriptService/CraftingRemote.server.lua": ["CraftingRequest"],
              "src/ServerScriptService/DodgeRemote.server.lua": ["DodgeRequest"],
              "src/ServerScriptService/UseItemRemote.server.lua": ["UseItemRequest"],
              "src/ServerScriptService/NPCDialogRemote.server.lua": ["NPCDialogRequest"],
              "src/ServerScriptService/QuestAvailability.server.lua": ["GetAvailableQuests"],
          }
          for file, names in fail_fast_files.items():
              text = Path(file).read_text(encoding="utf-8")
              if 'if remote then' not in text and 'if feedback then' not in text and file != "src/ServerScriptService/Bootstrap.server.lua":
                  problems.append(f"{file} must inspect an existing Remote before binding")
              for name in names:
                  if file == "src/ServerScriptService/Bootstrap.server.lua":
                      continue
                  if name == "CombatFeedback":
                      marker = 'if not feedback:IsA("RemoteEvent") then'
                  elif name in expected_events:
                      marker = 'if not remote:IsA("RemoteEvent") then'
                  else:
                      marker = 'if not remote:IsA("RemoteFunction") then'
                  if marker not in text:
                      problems.append(f"{file} missing Remote type fail-fast for {name}")

          bootstrap = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")
          for marker in (
              'if existing.ClassName ~= className then',
              'error(("Crystal Bound: Remote %s has class %s, expected %s")',
          ):
              if marker not in bootstrap:
                  problems.append(f"Bootstrap missing Remote type fail-fast marker: {marker}")

          if problems:
              for problem in problems:
                  print(problem)
              raise SystemExit(1)
          print("Critical RemoteEvent/RemoteFunction types and all server Remote fail-fast guards validated.")
