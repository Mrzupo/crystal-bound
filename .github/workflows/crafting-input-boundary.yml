name: Crafting Input Boundary

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce integer crafting validation, overflow safety and remote request gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('src/ServerScriptService/Services/CraftingService.lua').read_text(encoding='utf-8')
          remote = Path('src/ServerScriptService/CraftingRemote.server.lua').read_text(encoding='utf-8')
          required = [
              'number == nil or number % 1 ~= 0',
              'Craft amount must be a positive integer.',
              'local outputAmount = safeProduct(recipeAmount, amount)',
              'if not outputAmount then',
              'if outputAmount > availableOutputSpace then',
          ]
          missing = [marker for marker in required if marker not in service]
          missing += [marker for marker in (
              'local NEXT_REQUEST = setmetatable({}, { __mode = "k" })',
              'if now < (NEXT_REQUEST[player] or 0) then return end',
              'NEXT_REQUEST[player] = now + REQUEST_INTERVAL',
              'if action ~= "Craft" then return end',
              'local function getCanonicalTrader()',
              'trader.Parent ~= NPC_FOLDER',
              'trader:GetAttribute("Interactable") ~= true',
          ) if marker not in remote]
          if missing:
              raise SystemExit('missing crafting input/remote boundary markers: ' + ', '.join(missing))
          if service.index('local outputAmount = safeProduct(recipeAmount, amount)') > service.index('if outputAmount > availableOutputSpace then'):
              raise SystemExit('Crafting must calculate the safe product before inventory-space comparison')
          if remote.index('NEXT_REQUEST[player] = now + REQUEST_INTERVAL') > remote.index('if action ~= "Craft" then return end'):
              raise SystemExit('CraftingRemote must consume the rate limit before validating the action')
          print('Crafting input, overflow, pre-validation rate limiting and canonical trader identity validated.')
          PY
