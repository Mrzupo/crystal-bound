name: Enemy Config Validation

on:
  push:
  pull_request:

jobs:
  validate-enemy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate EnemyConfig semantic bounds
        shell: python
        run: |
          from pathlib import Path
          import math
          import re

          config = Path('src/ReplicatedStorage/Config/EnemyConfig.lua').read_text(encoding='utf-8')
          inventory = Path('src/ReplicatedStorage/Config/InventoryConfig.lua').read_text(encoding='utf-8')
          npc = Path('src/ServerScriptService/Services/NPCService.lua').read_text(encoding='utf-8')
          combat = Path('src/ServerScriptService/Services/CombatService.lua').read_text(encoding='utf-8')

          for marker in ('function EnemyConfig.Get(typeId)', 'local source = EnemyConfig.Types[typeId]', 'return normalize(source)', 'function EnemyConfig.IsValid(typeId)'):
              if marker not in config:
                  raise SystemExit(f'Missing EnemyConfig canonical lookup marker: {marker}')
          if 'return EnemyConfig.Types.TrainingDummy' in config:
              raise SystemExit('EnemyConfig.Get must not fall back to TrainingDummy')
          if 'if not config then return false end' not in npc and 'if not config or' not in npc:
              raise SystemExit('NPCService must reject unknown enemy configuration')

          numeric = r'-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?'
          bounds = {
              'Health': (1, 1000000), 'Level': (1, 100), 'XP': (0, 1000000), 'Money': (0, 1000000),
              'Respawn': (1.5, 600), 'AggroRange': (0, 1000), 'AttackRange': (0, 1000),
              'AttackDamage': (0, 1000), 'AttackCooldown': (0.25, 60), 'DropChance': (0, 1),
              'Cooldown': (0.25, 60), 'Range': (0, 1000), 'BonusDamage': (0, 1000),
              'BurnDamage': (1, 100), 'BurnTicks': (1, 10), 'BurnInterval': (0.2, 3),
              'SlowMultiplier': (0.01, 1), 'SlowDuration': (0.1, 10), 'TeleportOffset': (0, 100), 'Radius': (0, 1000),
          }
          for field, (minimum, maximum) in bounds.items():
              for raw in re.findall(rf'\b{re.escape(field)}\s*=\s*({numeric})', config):
                  value = float(raw)
                  if not math.isfinite(value) or value < minimum or value > maximum:
                      raise SystemExit(f'Enemy {field} outside bounds: {value}')

          for enemy_id, drop in re.findall(r'\b([A-Za-z]+)\s*=\s*\{.*?Drop\s*=\s*"([^"]+)"', config, re.S):
              if f'{drop} = ' not in inventory:
                  raise SystemExit(f'Enemy drop is not registered: {enemy_id} -> {drop}')

          for marker in (
              'local specialRange =', 'distance <= specialRange',
              'math.clamp(finiteNumber(special.Range, 14), 0.1, 1000)',
              'math.clamp(finiteNumber(special.Range, 10), 0.1, 1000)',
              'math.clamp(finiteNumber(special.TeleportOffset, 4), 0, math.min(100, range))',
              'math.clamp(finiteNumber(special.Cooldown, 6), 0.25, 60)',
          ):
              if marker not in npc:
                  raise SystemExit(f'NPCService special runtime bound missing: {marker}')
          if 'EnemyConfig.Types[enemyType]' not in combat or 'InventoryService.AddItem(profile, itemId, 1)' not in combat:
              raise SystemExit('CombatService must use canonical EnemyConfig and InventoryService for enemy rewards')

          print('EnemyConfig signed finite bounds, strict lookup, canonical loot and NPC special runtime bounds validated.')
