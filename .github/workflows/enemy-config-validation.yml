name: Enemy Config Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-enemy-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate EnemyConfig combat bounds and canonical loot
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path("src/ReplicatedStorage/Config/EnemyConfig.lua").read_text(encoding="utf-8")
          inventory = Path("src/ReplicatedStorage/Config/InventoryConfig.lua").read_text(encoding="utf-8")
          npc = Path("src/ServerScriptService/Services/NPCService.lua").read_text(encoding="utf-8")
          combat = Path("src/ServerScriptService/Services/CombatService.lua").read_text(encoding="utf-8")

          required = [
              "AttackRange =",
              "AttackDamage =",
              "AttackCooldown =",
              "AggroRange =",
              "DropChance =",
              "Special =",
              "Cooldown =",
              "Range =",
              "Respawn =",
          ]
          problems = [marker for marker in required if marker not in text]
          if problems:
              for problem in problems:
                  print(f" - EnemyConfig missing field: {problem}")
              raise SystemExit(1)

          if "function EnemyConfig.Get(typeId)" not in text or "return EnemyConfig.Types[typeId]" not in text:
              raise SystemExit("EnemyConfig.Get must perform strict type lookup")
          if "return EnemyConfig.Types.TrainingDummy" in text:
              raise SystemExit("EnemyConfig.Get must not silently fall back to TrainingDummy")
          if "function EnemyConfig.IsValid(typeId)" not in text:
              raise SystemExit("EnemyConfig.IsValid must exist for canonical enemy validation")
          if "if not config then return end" not in npc:
              raise SystemExit("NPCService must reject unknown enemy configuration cleanly")

          for marker in (
              "local specialRange =",
              "distance <= specialRange",
              'math.clamp(tonumber(special.Range) or 14, 0.1, 1000)',
              'math.clamp(tonumber(special.Range) or 10, 0.1, 1000)',
              'math.clamp(tonumber(special.TeleportOffset) or 4, 0, math.min(100, range))',
              'math.clamp(tonumber(special.Cooldown) or 6, 0.25, 60)',
          ):
              if marker not in npc:
                  raise SystemExit(f"NPCService special runtime clamp/trigger missing: {marker}")

          if "EnemyConfig.Types[enemyType]" not in combat:
              raise SystemExit("CombatService rewardDefeat must use canonical EnemyConfig")
          if "InventoryService.AddItem(profile, itemId, 1)" not in combat:
              raise SystemExit("CombatService enemy loot must use InventoryService")

          for enemy_id, drop in re.findall(r"\b([A-Za-z]+)\s*=\s*\{.*?Drop = \"([^\"]+)\"", text, re.S):
              if f'{drop} = ' not in inventory:
                  raise SystemExit(f"Enemy drop is not registered in InventoryConfig: {enemy_id} -> {drop}")

          respawns = [float(value) for value in re.findall(r"Respawn = ([0-9.]+)", text)]
          for respawn in respawns:
              if respawn < 1.5:
                  raise SystemExit("Enemy Respawn must be at least 1.5 seconds to remain compatible with NPC cleanup")
              if respawn > 600:
                  raise SystemExit("Enemy Respawn exceeds the 10-minute design bound")

          numeric_fields = re.findall(r"AttackRange = ([0-9.]+).*?AttackDamage = ([0-9.]+).*?AttackCooldown = ([0-9.]+)", text)
          for attack_range, damage, cooldown in numeric_fields:
              if float(attack_range) > 1000:
                  raise SystemExit("Enemy AttackRange exceeds global 1000-unit cap")
              if float(damage) < 0 or float(damage) > 1000:
                  raise SystemExit("Enemy AttackDamage is outside 0..1000")
              if float(cooldown) < 0.1 or float(cooldown) > 60:
                  raise SystemExit("Enemy AttackCooldown is outside 0.1..60")

          special_cooldowns = [float(value) for value in re.findall(r"Special = \{\s*Cooldown = ([0-9.]+)", text)]
          for cooldown in special_cooldowns:
              if cooldown < 0.1 or cooldown > 60:
                  raise SystemExit("Enemy Special cooldown is outside 0.1..60")

          special_ranges = [float(value) for value in re.findall(r"Special = \{.*?Range = ([0-9.]+)", text, re.S)]
          for special_range in special_ranges:
              if special_range <= 0 or special_range > 1000:
                  raise SystemExit("Enemy Special Range is outside 0..1000")

          teleport_offsets = [float(value) for value in re.findall(r"TeleportOffset = ([0-9.]+)", text)]
          for offset in teleport_offsets:
              if offset < 0 or offset > 100:
                  raise SystemExit("Enemy TeleportOffset is outside 0..100")

          print("EnemyConfig combat bounds, strict lookup, lifecycle, special movement and canonical loot validated.")
