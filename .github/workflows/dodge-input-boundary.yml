name: Dodge Input Boundary

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server-side dodge input boundary
        shell: python
        run: |
          from pathlib import Path

          service = Path("src/ServerScriptService/Services/DodgeService.lua").read_text(encoding="utf-8")
          remote = Path("src/ServerScriptService/DodgeRemote.server.lua").read_text(encoding="utf-8")
          required = [
              'local function finiteNumber(value, fallback)',
              'local function validDirection(direction)',
              'typeof(direction) ~= "Vector3"',
              'not finiteComponent(direction.X)',
              'not finiteComponent(direction.Y)',
              'not finiteComponent(direction.Z)',
              'direction.Magnitude <= MAX_DIRECTION_MAGNITUDE',
              'if requested ~= nil and not validDirection(requested) then',
              'MAX_DIRECTION_MAGNITUDE = math.clamp(finiteNumber(DodgeConfig.MaxDirectionMagnitude, 1000), 1, 10000)',
              'safeRange = math.clamp(safeRange, 0.1, 1000)',
              'if not character or humanoid.Parent ~= character then return false end',
              'local function isShuttingDown()',
              'if isShuttingDown() then return false, "Server shutting down" end',
              'if player:GetAttribute("ProfileLoaded") ~= true then return false, "Profile not ready" end',
          ]
          missing = [marker for marker in required if marker not in service]
          if missing:
              raise SystemExit("missing Dodge input/target/shutdown/profile boundary markers: " + ", ".join(missing))

          for marker in [
              'local PlayerService = require(script.Parent.Services.PlayerService)',
              'if PlayerService.ShuttingDown or not PlayerService.GetProfile(player) then return end',
          ]:
              if marker not in remote:
                  raise SystemExit("DodgeRemote shutdown/profile gate missing: " + marker)

          print("Dodge server input, target identity, runtime-config, loaded-profile and shutdown/profile boundary contract validated.")
