name: Economy Reward Accounting

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate capped sale reward accounting and Money ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('src/ServerScriptService')
          text = (root / 'Services/EconomyService.lua').read_text(encoding='utf-8')
          required = [
              'local before = math.clamp(finiteNumber(profile.Money) or 0, Config.MinMoney, Config.MaxMoney)',
              'return nextMoney, nextMoney - before',
              'local beforeMoney = math.clamp(finiteNumber(profile.Money) or 0, Config.MinMoney, Config.MaxMoney)',
              'if beforeMoney + requestedEarned > Config.MaxMoney then',
              'local _, earned = EconomyService.AddMoney(profile, requestedEarned)',
              'if earned ~= requestedEarned then',
              'profile.Money = beforeMoney',
              'InventoryService.AddItem(profile, itemId, amount)',
              'return true, earned',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('missing economy reward accounting contract: ' + ', '.join(missing))

          gate = text.index('if beforeMoney + requestedEarned > Config.MaxMoney then')
          remove = text.index('if not InventoryService.RemoveItem(profile, itemId, amount) then')
          if gate > remove:
              raise SystemExit('wallet-cap gate must execute before inventory mutation')

          owners = []
          for path in root.rglob('*.lua'):
              content = path.read_text(encoding='utf-8')
              if 'profile.Money =' in content:
                  owners.append(str(path))
          if owners != ['src/ServerScriptService/Services/EconomyService.lua']:
              raise SystemExit(f'profile.Money mutation must remain EconomyService-owned; found {owners}')
          print('Economy reward accounting, wallet-cap atomicity, rollback and Money ownership contract validated.')
          PY
