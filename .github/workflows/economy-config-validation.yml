name: Economy Config Validation

on:
  push:
  pull_request:

jobs:
  validate-economy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate economy bounds and starting state
        shell: python
        run: |
          from pathlib import Path
          import math
          import re

          economy = Path('src/ReplicatedStorage/Config/EconomyConfig.lua').read_text(encoding='utf-8')
          player_data = Path('src/ReplicatedStorage/Modules/PlayerData.lua').read_text(encoding='utf-8')
          service = Path('src/ServerScriptService/Services/EconomyService.lua').read_text(encoding='utf-8')
          numeric = r'-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?'
          values = {}
          for key in ('StartingMoney', 'MinMoney', 'MaxMoney'):
              match = re.search(rf'\b{key}\s*=\s*({numeric})', economy)
              if not match:
                  raise SystemExit(f'EconomyConfig missing {key}')
              value = float(match.group(1))
              if not math.isfinite(value) or value < 0 or value > 1_000_000_000 or value % 1 != 0:
                  raise SystemExit(f'EconomyConfig {key} outside finite integer 0..1e9 bound: {value}')
              values[key] = value
          if values['MinMoney'] > values['MaxMoney'] or not values['MinMoney'] <= values['StartingMoney'] <= values['MaxMoney']:
              raise SystemExit('EconomyConfig money bounds are inconsistent')
          if 'Money = EconomyConfig.StartingMoney' not in player_data:
              raise SystemExit('PlayerData must consume EconomyConfig.StartingMoney')
          for marker in ('function nonNegativeInteger', 'amount % 1 ~= 0', 'math.clamp(before + amount, Config.MinMoney, Config.MaxMoney)'):
              if marker not in service:
                  raise SystemExit(f'EconomyService runtime boundary missing: {marker}')
          print('Economy signed numeric bounds, canonical starting money and transaction guards validated.')
