name: Boss Reward Transaction Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Guardian reward lifecycle and canonical mutation owners
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path('src/ServerScriptService/Services/BossService.lua').read_text(encoding='utf-8')
          boss = Path('src/ReplicatedStorage/Config/BossConfig.lua').read_text(encoding='utf-8')
          inventory = Path('src/ReplicatedStorage/Config/InventoryConfig.lua').read_text(encoding='utf-8')
          economy = Path('src/ReplicatedStorage/Config/EconomyConfig.lua').read_text(encoding='utf-8')
          xp = Path('src/ReplicatedStorage/Config/XPConfig.lua').read_text(encoding='utf-8')
          required = [
              'if model:GetAttribute("Rewarded") then return end',
              'local validRewardConfig =',
              'local questDefinition = QuestSystem.GetDefinition("GUARDIAN_TRIAL")',
              'local questActive = profile ~= nil and QuestSystem.IsActive(profile, "GUARDIAN_TRIAL")',
              'currentMoney + math.max(0, moneyReward or 0) + questMoney <= EconomyConfig.MaxMoney',
              'xpReward <= XPConfig.MaxExperience',
              'moneyReward <= EconomyConfig.MaxMoney',
              'InventoryConfig.GetItemConfig(dropId) ~= nil',
              'model:SetAttribute("Rewarded", true)',
              'XPService.AddXP(profile, xpReward)',
              'local _, earnedMoney = EconomyService.AddMoney(profile, moneyReward)',
              'InventoryService.AddItem(profile, dropId, 1)',
              'earnedMoney < moneyReward',
              'DamageService.ClearTarget(model)',
              'BossService.CreateGuardian(position, parent, bossName)',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Guardian reward lifecycle markers missing: ' + ', '.join(missing))
          if text.index('model:SetAttribute("Rewarded", true)') > text.index('XPService.AddXP(profile, xpReward)'):
              raise SystemExit('Guardian idempotency must be committed before reward mutation to block double processing')
          forbidden = [
              'profile.Money =',
              'profile.Inventory[dropId] =',
              'currentMoney + moneyReward > EconomyConfig.MaxMoney',
              'Spend some Money before claiming the Guardian reward.',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit('Guardian reward path still contains obsolete bypass/loss behavior: ' + marker)

          drop_match = re.search(r'Drop\s*=\s*"([A-Za-z0-9_]+)"', boss)
          if not drop_match:
              raise SystemExit('Guardian reward Drop is missing from BossConfig')
          drop_id = drop_match.group(1)
          if f'{drop_id} = ' not in inventory:
              raise SystemExit(f'Guardian reward Drop is not registered in InventoryConfig: {drop_id}')

          max_money_match = re.search(r'MaxMoney\s*=\s*(\d+)', economy)
          max_xp_match = re.search(r'MaxExperience\s*=\s*(\d+)', xp)
          max_money = int(max_money_match.group(1)) if max_money_match else 1000000000
          max_xp = int(max_xp_match.group(1)) if max_xp_match else 1000000000
          reward_match = re.search(r'XP\s*=\s*(\d+).*?Money\s*=\s*(\d+)', boss, re.S)
          if not reward_match:
              raise SystemExit('BossConfig Guardian XP/Money reward fields missing')
          if int(reward_match.group(1)) > max_xp or int(reward_match.group(2)) > max_money:
              raise SystemExit('Guardian reward config exceeds canonical progression/economy caps')

          print('Guardian reward idempotency, combined quest/boss wallet preflight, canonical mutation ownership, lifecycle cleanup, cap validation and drop registration validated.')
