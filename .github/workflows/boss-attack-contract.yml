name: Boss Attack Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate distinct Guardian phase-2 attacks and semantic bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path('src/ReplicatedStorage/Config/BossConfig.lua').read_text(encoding='utf-8')
          inventory = Path('src/ReplicatedStorage/Config/InventoryConfig.lua').read_text(encoding='utf-8')
          service = Path('src/ServerScriptService/Services/BossService.lua').read_text(encoding='utf-8')
          telegraph = Path('src/ServerScriptService/BossTelegraph.server.lua').read_text(encoding='utf-8')
          arena = Path('src/ServerScriptService/BossArena.server.lua').read_text(encoding='utf-8')

          for marker in ['Phase2 =', 'Telegraph =', 'ArenaHazard =', 'ArenaCenter =', 'AbilityCooldown =', 'AbilityRadius =', 'AbilityDamage =', 'Drop =']:
              if marker not in config:
                  raise SystemExit(f'missing Guardian config marker: {marker}')

          numeric_fields = re.findall(
              r'\b(Health|XP|Money|AttackCooldown|AttackRange|AttackDamage|AbilityCooldown|AbilityRadius|AbilityDamage|Respawn|Windup|Radius|Damage|TargetRange|Cooldown|HealthThreshold|AttackDamageMultiplier|AbilityRangeMultiplier|Interval|HalfExtent)\s*=\s*([0-9]+(?:\.[0-9]+)?)',
              config,
          )
          for field, raw in numeric_fields:
              value = float(raw)
              if field in {'Health', 'XP', 'Money', 'AttackCooldown', 'AttackRange', 'AttackDamage', 'AbilityCooldown', 'AbilityRadius', 'AbilityDamage', 'Respawn', 'Windup', 'Radius', 'Damage', 'TargetRange', 'Cooldown', 'Interval'} and value < 0:
                  raise SystemExit(f'Guardian config contains negative {field}: {value}')
              if field in {'Health', 'AttackRange', 'AbilityRadius', 'TargetRange', 'Radius', 'HalfExtent'} and value > 1000:
                  raise SystemExit(f'Guardian config {field} exceeds 1000-unit bound: {value}')
              if field in {'AttackDamage', 'AbilityDamage', 'Damage'} and value > 1000:
                  raise SystemExit(f'Guardian damage field exceeds 1000: {value}')
          phase_threshold = re.search(r'HealthThreshold\s*=\s*([0-9]+(?:\.[0-9]+)?)', config)
          if not phase_threshold or not 0 < float(phase_threshold.group(1)) < 1:
              raise SystemExit('Guardian Phase2.HealthThreshold must be within 0..1')
          multiplier = re.search(r'AbilityRangeMultiplier\s*=\s*([0-9]+(?:\.[0-9]+)?)', config)
          if not multiplier or not 0 < float(multiplier.group(1)) <= 10:
              raise SystemExit('Guardian Phase2.AbilityRangeMultiplier must be within 0..10')
          damage_multiplier = re.search(r'AttackDamageMultiplier\s*=\s*([0-9]+(?:\.[0-9]+)?)', config)
          if not damage_multiplier or not 0 < float(damage_multiplier.group(1)) <= 10:
              raise SystemExit('Guardian Phase2.AttackDamageMultiplier must be within 0..10')

          drop = re.search(r'Drop\s*=\s*"([^"]+)"', config)
          if not drop:
              raise SystemExit('Guardian Drop must be a string')
          drop_id = drop.group(1)
          if f'{drop_id} = ' not in inventory:
              raise SystemExit(f'Guardian Drop is not registered in InventoryConfig: {drop_id}')

          for marker in ['local abilityRadius =', 'phase2.AbilityRangeMultiplier', 'shockwave(root.Position, abilityRadius']:
              if marker not in service:
                  raise SystemExit(f'Guardian phase-2 ability path missing: {marker}')

          for marker in ['config.Windup', 'config.Cooldown', 'config.Radius', 'config.Damage', 'config.TargetRange', 'BossShockwave']:
              if marker not in telegraph:
                  raise SystemExit(f'Guardian telegraph path missing: {marker}')

          if 'BossConfig.CrystalGuardian.ArenaHazard' not in arena:
              raise SystemExit('BossArena must consume Guardian ArenaHazard config')
          if 'local center = bossConfig.ArenaCenter' not in arena:
              raise SystemExit('BossArena must use BossConfig.ArenaCenter')

          print('Guardian phase-2, reward, attack and semantic bounds validated.')
          PY
