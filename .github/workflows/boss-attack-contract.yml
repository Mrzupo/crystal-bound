name: Boss Attack Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Guardian configuration and lifecycle semantics
        shell: python
        run: |
          from pathlib import Path
          import math
          import re

          config = Path('src/ReplicatedStorage/Config/BossConfig.lua').read_text(encoding='utf-8')
          inventory = Path('src/ReplicatedStorage/Config/InventoryConfig.lua').read_text(encoding='utf-8')
          service = Path('src/ServerScriptService/Services/BossService.lua').read_text(encoding='utf-8')
          telegraph = Path('src/ServerScriptService/BossTelegraph.server.lua').read_text(encoding='utf-8')
          arena = Path('src/ServerScriptService/BossArena.server.lua').read_text(encoding='utf-8')

          numeric = r'-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?'
          fields = {
              'Health': (0, 1000000), 'XP': (0, 1000000000), 'Money': (0, 1000000000),
              'AttackCooldown': (0.1, 60), 'AttackRange': (0.1, 1000), 'AttackDamage': (0, 1000),
              'AbilityCooldown': (0.1, 60), 'AbilityRadius': (0, 1000), 'AbilityDamage': (0, 1000),
              'Respawn': (1.5, 600), 'Windup': (0.05, 10), 'Radius': (0.1, 1000),
              'Damage': (0, 1000), 'TargetRange': (0, 1000), 'Cooldown': (0.1, 60),
              'HealthThreshold': (0.01, 0.99), 'AttackDamageMultiplier': (0, 10),
              'AbilityRangeMultiplier': (0, 10), 'Interval': (0.1, 10), 'HalfExtent': (0, 1000),
          }
          for field, (minimum, maximum) in fields.items():
              matches = re.findall(rf'\b{re.escape(field)}\s*=\s*({numeric})', config)
              if not matches:
                  raise SystemExit(f'Missing numeric Guardian field: {field}')
              for raw in matches:
                  value = float(raw)
                  if not math.isfinite(value) or value < minimum or value > maximum:
                      raise SystemExit(f'Guardian {field} out of bounds: {value}')

          drop = re.search(r'Drop\s*=\s*"([^"]+)"', config)
          if not drop or f'{drop.group(1)} = ' not in inventory:
              raise SystemExit('Guardian Drop must reference a registered inventory item')

          for marker in (
              'local abilityRadius =', 'phase2.AbilityRangeMultiplier', 'shockwave(root.Position, abilityRadius',
              'player:GetAttribute("ProfileLoaded") == true',
          ):
              if marker not in service:
                  raise SystemExit(f'Guardian runtime marker missing: {marker}')

          for marker in (
              'local currentGuardian = NPCs:FindFirstChild("CrystalGuardian")',
              'if currentGuardian ~= guardian then return end',
              'local currentGuardianRoot = guardian:FindFirstChild("HumanoidRootPart") or guardian.PrimaryPart',
              'PlayerService.ShuttingDown',
              'PlayerService.Closing[player]',
              'player.Character ~= targetCharacter',
              'Range = attackerRange',
          ):
              if marker not in telegraph:
                  raise SystemExit(f'Guardian telegraph lifecycle marker missing: {marker}')

          for marker in (
              'local PlayerService = require(script.Parent.Services.PlayerService)',
              'local center = bossConfig.ArenaCenter',
              'math.clamp(finiteNumber(config.Interval, 0.75), 0.1, 10)',
              'if not phaseActive or PlayerService.ShuttingDown then return end',
              'while arena.Parent and not PlayerService.ShuttingDown do',
              'setPhaseHazard(false)',
          ):
              if marker not in arena:
                  raise SystemExit(f'Guardian arena lifecycle marker missing: {marker}')

          print('Guardian signed numeric bounds, optional drop registration, telegraph identity/lifecycle and arena shutdown authority validated.')
