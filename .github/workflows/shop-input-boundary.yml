name: Shop Input Boundary

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce integer purchase and canonical trader validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/ServerScriptService/Services/ShopService.lua').read_text(encoding='utf-8')
          remote = Path('src/ServerScriptService/ShopRemote.server.lua').read_text(encoding='utf-8')
          required = [
              'number == nil or number % 1 ~= 0',
              'Purchase amount must be a positive integer.',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('missing shop input boundary markers: ' + ', '.join(missing))
          for marker in (
              'local function getCanonicalTrader()',
              'trader.Parent ~= folder',
              'trader:GetAttribute("Interactable") ~= true',
              'local ok, message = ShopService.Buy(profile, itemId, amount, InventoryService, EconomyService)',
          ):
              if marker not in remote:
                  raise SystemExit('missing ShopRemote canonical trader marker: ' + marker)
          print('Shop input boundary and canonical trader identity validated.')
          PY
