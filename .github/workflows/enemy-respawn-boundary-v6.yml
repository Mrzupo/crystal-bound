name: Enemy Respawn Boundary V6

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate respawn stays above corpse cleanup boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path("src/ReplicatedStorage/Config/EnemyConfig.lua").read_text(encoding="utf-8")
          npc = Path("src/ServerScriptService/Services/NPCService.lua").read_text(encoding="utf-8")

          get_match = re.search(r"result\.Respawn = math\.clamp\(finiteNumber\(source\.Respawn, 10\), ([0-9.]+), 600\)", text)
          if not get_match or float(get_match.group(1)) < 2:
              raise SystemExit("EnemyConfig.Get must enforce a minimum Respawn of 2 seconds")
          if "task.delay(config.Respawn" not in Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8"):
              raise SystemExit("Bootstrap must remain the canonical enemy respawn scheduler")
          if "task.delay(1.5" not in npc:
              raise SystemExit("NPCService corpse cleanup boundary changed unexpectedly; review respawn invariant")

          print("Enemy Respawn normalization stays strictly above the 1.5s corpse cleanup boundary.")
