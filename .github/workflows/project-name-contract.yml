name: Project Name Contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Crystal Bound project identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('default.project.json').read_text(encoding='utf-8'))
          if project.get('name') != 'Crystal Bound':
              raise SystemExit('default.project.json must use the Crystal Bound DataModel name')
          PY
