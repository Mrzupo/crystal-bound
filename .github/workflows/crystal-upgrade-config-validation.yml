name: Crystal Upgrade Config Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/crystal-upgrade-contract-current-v2"]
  pull_request:

jobs:
  validate-upgrade-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Crystal mastery costs, bounds and strict ID/ownership handling
        shell: python
        run: |
          import re
          from pathlib import Path
          config = Path("src/ReplicatedStorage/Config/CrystalUpgradeConfig.lua").read_text(encoding="utf-8")
          mastery = Path("src/ReplicatedStorage/Modules/CrystalMastery.lua").read_text(encoding="utf-8")
          inventory = Path("src/ReplicatedStorage/Config/InventoryConfig.lua").read_text(encoding="utf-8")
          required = {"EMBER": "EmberShard", "TIDE": "TidePearl", "GALE": "GaleFeather"}
          for crystal, item in required.items():
              if crystal not in config or item not in config:
                  raise SystemExit(f"Missing mastery cost definition for {crystal}: {item}")
              if f'{item} = ' not in inventory:
                  raise SystemExit(f"Mastery material is not registered in InventoryConfig: {item}")

          max_level = re.search(r"MaxLevel\s*=\s*(-?[0-9]+)", config)
          max_xp = re.search(r"MaxExperience\s*=\s*(-?[0-9]+)", config)
          growth = re.search(r"Growth\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)
          if not max_level or not 1 <= int(max_level.group(1)) <= 100:
              raise SystemExit("MaxLevel must be within 1..100")
          if not max_xp or not 1 <= int(max_xp.group(1)) <= 100000000:
              raise SystemExit("MaxExperience must be within 1..100000000")
          if not growth or not 0.01 <= float(growth.group(1)) <= 10:
              raise SystemExit("Growth must be within 0.01..10")

          bonus_bounds = {
              "DamagePerLevel": (0, 1),
              "AbilityDamagePerLevel": (0, 1),
              "HealthPerLevel": (0, 100),
              "SpeedPerLevel": (0, 10),
          }
          for field, (minimum, maximum) in bonus_bounds.items():
              match = re.search(rf"{field}\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)
              if not match:
                  raise SystemExit(f"Missing mastery bonus field: {field}")
              value = float(match.group(1))
              if not minimum <= value <= maximum:
                  raise SystemExit(f"{field} outside {minimum}..{maximum}: {value}")

          base_costs = config.split("BaseCosts", 1)[1] if "BaseCosts" in config else ""
          costs = re.findall(r"(EmberShard|TidePearl|GaleFeather)\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", base_costs)
          if len(costs) != 3 or any(float(amount) <= 0 or float(amount) > 1000000 or float(amount) % 1 != 0 for _, amount in costs):
              raise SystemExit("Crystal mastery base costs must be positive integers and <= 1000000")

          required_mastery_markers = [
              "local function validCrystalId(crystalId)",
              "local function ownsCrystal(profile, crystalId)",
              "local function ensure(profile, crystalId)",
              "local function readMastery(profile, crystalId)",
              "function CrystalMastery.Get(profile, crystalId)",
              "return readMastery(profile, crystalId) or neutralMastery()",
              "function CrystalMastery.AddXP",
              "function CrystalMastery.GetBonuses(profile, crystalId)",
              "function CrystalMastery.GetUpgradeCost",
              "function CrystalMastery.Upgrade",
              "InventoryConfig.GetItemConfig(itemId)",
              "boundedPositiveConfig(Config.DamagePerLevel, 0, 1)",
              "boundedPositiveConfig(Config.AbilityDamagePerLevel, 0, 1)",
              "boundedPositiveConfig(Config.HealthPerLevel, 0, 100)",
              "boundedPositiveConfig(Config.SpeedPerLevel, 0, 10)",
          ]
          missing = [marker for marker in required_mastery_markers if marker not in mastery]
          if missing:
              raise SystemExit("CrystalMastery strict ID/ownership/read/mutation boundary missing: " + ", ".join(missing))

          read_block_start = mastery.index("function CrystalMastery.Get(profile, crystalId)")
          read_block_end = mastery.index("function CrystalMastery.GetRequiredXP", read_block_start)
          if "ensure(profile, crystalId)" in mastery[read_block_start:read_block_end]:
              raise SystemExit("CrystalMastery.Get must remain side-effect free")

          print("Crystal upgrade config, bonus bounds, material ownership and current CrystalMastery read/write ownership semantics validated.")
