name: Shop Config Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-shop-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared shop config and inventory registration
        shell: python
        run: |
          import re
          from pathlib import Path
          config = Path("src/ReplicatedStorage/Config/ShopConfig.lua").read_text(encoding="utf-8")
          inventory = Path("src/ReplicatedStorage/Config/InventoryConfig.lua").read_text(encoding="utf-8")
          shop = Path("src/ServerScriptService/Services/ShopService.lua").read_text(encoding="utf-8")
          ui = Path("src/StarterPlayer/StarterPlayerScripts/ShopMenu.client.lua").read_text(encoding="utf-8")
          bootstrap = Path("src/StarterPlayer/StarterPlayerScripts/ClientBootstrap.client.lua").read_text(encoding="utf-8")

          if "Offers" not in config or "SellOrder" not in config:
              raise SystemExit("ShopConfig must define Offers and SellOrder")

          prices = [int(value) for value in re.findall(r"Price\s*=\s*(\d+)", config)]
          limits = [int(value) for value in re.findall(r"MaxPerPurchase\s*=\s*(\d+)", config)]
          if not prices or any(value <= 0 for value in prices):
              raise SystemExit("ShopConfig prices must all be positive")
          if not limits or any(value <= 0 for value in limits):
              raise SystemExit("ShopConfig MaxPerPurchase values must all be positive")

          offer_ids = re.findall(r"ItemId\s*=\s*\"([^\"]+)\"", config)
          if not offer_ids:
              raise SystemExit("ShopConfig must define at least one ItemId offer")
          sell_section = config.split("SellOrder", 1)[1]
          sell_ids = re.findall(r'\"([A-Za-z0-9_]+)\"', sell_section)
          all_shop_items = sorted(set(offer_ids + sell_ids))
          for item_id in all_shop_items:
              if f"{item_id} = " not in inventory:
                  raise SystemExit(f"InventoryConfig missing shop item referenced by ShopConfig: {item_id}")

          if "ShopConfig" not in shop:
              raise SystemExit("ShopService must consume shared ShopConfig")
          if "positiveInteger" not in shop:
              raise SystemExit("ShopService must reject invalid purchase amounts")
          if "ShopConfig" not in ui or "InventoryConfig" not in ui:
              raise SystemExit("ShopMenu must consume shared ShopConfig and InventoryConfig")
          if "ShopConfig" not in bootstrap or "local sellOrder = shopConfig.SellOrder" not in bootstrap:
              raise SystemExit("ClientBootstrap must consume shared ShopConfig.SellOrder")
          print("Shop configuration, offer IDs, SellOrder IDs and inventory registration validated.")
