name: Shop Config Validation

on:
  push:
  pull_request:

jobs:
  validate-shop-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared shop config and inventory registration
        shell: python
        run: |
          from pathlib import Path
          import math
          import re

          config = Path('src/ReplicatedStorage/Config/ShopConfig.lua').read_text(encoding='utf-8')
          inventory = Path('src/ReplicatedStorage/Config/InventoryConfig.lua').read_text(encoding='utf-8')
          shop = Path('src/ServerScriptService/Services/ShopService.lua').read_text(encoding='utf-8')
          ui = Path('src/StarterPlayer/StarterPlayerScripts/ShopMenu.client.lua').read_text(encoding='utf-8')
          bootstrap = Path('src/StarterPlayer/StarterPlayerScripts/ClientBootstrap.client.lua').read_text(encoding='utf-8')

          if 'Offers' not in config or 'SellOrder' not in config:
              raise SystemExit('ShopConfig must define Offers and SellOrder')

          numeric = r'-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?'
          for field, minimum, maximum in (('Price', 1, 1_000_000_000), ('MaxPerPurchase', 1, 1000)):
              matches = re.findall(rf'\b{field}\s*=\s*({numeric})', config)
              if not matches:
                  raise SystemExit(f'ShopConfig must define {field}')
              for raw in matches:
                  value = float(raw)
                  if not math.isfinite(value) or value < minimum or value > maximum or value % 1 != 0:
                      raise SystemExit(f'ShopConfig {field} outside bounds: {value}')

          offer_ids = re.findall(r'ItemId\s*=\s*"([^"]+)"', config)
          if not offer_ids:
              raise SystemExit('ShopConfig must define at least one ItemId offer')
          sell_section = config.split('SellOrder', 1)[1]
          sell_ids = re.findall(r'"([A-Za-z0-9_]+)"', sell_section)
          for item_id in sorted(set(offer_ids + sell_ids)):
              if f'{item_id} = ' not in inventory:
                  raise SystemExit(f'InventoryConfig missing shop item: {item_id}')

          for source, markers in {
              'ShopService': ('positiveInteger', 'ShopConfig', 'InventoryConfig.GetMaxStackSize'),
              'ShopMenu': ('ShopConfig', 'InventoryConfig'),
              'ClientBootstrap': ('local sellOrder = shopConfig.SellOrder',),
          }.items():
              text = {'ShopService': shop, 'ShopMenu': ui, 'ClientBootstrap': bootstrap}[source]
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'{source} missing shared-shop marker: {marker}')

          print('Shop prices and per-purchase limits use finite signed parsing and strict positive integer bounds.')
