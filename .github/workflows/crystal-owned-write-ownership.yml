name: Crystal Owned Write Ownership

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate owned-crystal mutation owners
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("src")
          patterns = [
              re.compile(r'table\.insert\(profile\.Crystals\.Owned'),
              re.compile(r'profile\.Crystals\.Owned\s*=')
          ]
          allowed = {
              "ReplicatedStorage/Modules/CrystalSystem.lua",
              "ReplicatedStorage/Modules/PlayerData.lua",
          }
          violations = []
          for path in root.rglob("*.lua"):
              relative = str(path.relative_to(root))
              text = path.read_text(encoding="utf-8")
              if any(pattern.search(text) for pattern in patterns) and relative not in allowed:
                  violations.append(relative)
          if violations:
              raise SystemExit("Owned Crystal writes outside canonical owners: " + ", ".join(violations))
          print("Owned Crystal write ownership validated.")
