name: Client Bootstrap Quest Readiness Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate quest HUD waits for ProfileLoaded
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/StarterPlayer/StarterPlayerScripts/ClientBootstrap.client.lua").read_text(encoding="utf-8")
          required = [
              'if player:GetAttribute("ProfileLoaded") ~= true then return end',
              '"ProfileLoaded", "Level",',
              'questRefreshGeneration ~= requestGeneration',
              'player.Character ~= requestCharacter',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("Client Bootstrap readiness markers missing: " + ", ".join(missing))
          print("ClientBootstrap preserves quest snapshots until both current Character and ProfileLoaded readiness are valid.")
