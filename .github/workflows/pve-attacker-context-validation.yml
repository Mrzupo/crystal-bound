name: PvE Attacker Context Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-pve-attacker-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate NPC and boss damage context
        shell: python
        run: |
          from pathlib import Path

          npc = Path("src/ServerScriptService/Services/NPCService.lua").read_text(encoding="utf-8")
          boss = Path("src/ServerScriptService/Services/BossService.lua").read_text(encoding="utf-8")
          status = Path("src/ServerScriptService/Services/StatusEffectService.lua").read_text(encoding="utf-8")

          problems = []
          if "local function damagePlayer(player, humanoid, amount, attacker, damageType, range)" not in npc:
              problems.append("NPC damage helper must carry attacker, damage type and range")
          for snippet in [
              'damagePlayer(targetPlayer, targetHumanoid, config.AttackDamage, model, "Physical", config.AttackRange)',
              'damagePlayer(player, targetHumanoid, baseDamage + 6, model, "Physical", range)',
              'ApplyBurn(targetHumanoid, 2, 3, 0.6, model, range)',
          ]:
              if snippet not in npc:
                  problems.append(f"missing NPC attacker-context contract: {snippet}")
          if 'DodgeService.ApplyDamage(nearestPlayer, targetHumanoid, phase == 2 and math.floor(config.AttackDamage * 1.35) or config.AttackDamage, model, "Physical", config.AttackRange)' not in boss:
              problems.append("guardian normal attack must preserve attacker context")
          if 'DodgeService.ApplyDamage(player, humanoid, math.max(0, damage), attacker, "Physical", range)' not in status:
              problems.append("player burn ticks must preserve NPC attacker context")

          if problems:
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("PvE attacker context validated.")
