name: PvE Attacker Context Validation

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate-pve-attacker-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate NPC, boss and central damage context
        shell: python
        run: |
          from pathlib import Path

          npc = Path("src/ServerScriptService/Services/NPCService.lua").read_text(encoding="utf-8")
          boss = Path("src/ServerScriptService/Services/BossService.lua").read_text(encoding="utf-8")
          status = Path("src/ServerScriptService/Services/StatusEffectService.lua").read_text(encoding="utf-8")
          player_service = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          damage = Path("src/ServerScriptService/Services/DamageService.lua").read_text(encoding="utf-8")

          problems = []
          if "local function damagePlayer(player, humanoid, amount, attacker, damageType, range)" not in npc:
              problems.append("NPC damage helper must carry attacker, damage type and range")
          for snippet in [
              'damagePlayer(targetPlayer, targetHumanoid, attackDamage, model, "Physical", attackRange)',
              'damagePlayer(player, targetHumanoid',
              'StatusEffectService.ApplyBurn(targetHumanoid, special.BurnDamage, special.BurnTicks, special.BurnInterval, model, range)',
              'StatusEffectService.ApplySlow(targetHumanoid, special.SlowMultiplier, special.SlowDuration)',
              'math.min(1000, baseDamage + bonus)',
          ]:
              if snippet not in npc:
                  problems.append(f"missing NPC attacker-context/runtime bound: {snippet}")
          if 'DodgeService.ApplyDamage(nearestPlayer, targetHumanoid, attackDamage, model, "Physical", attackRange)' not in boss:
              problems.append("guardian normal attack must preserve attacker context and bounded attack range")
          if 'DodgeService.ApplyDamage(player, humanoid, damagePerTick, attacker, "Physical", range)' not in status:
              problems.append("player burn ticks must preserve NPC attacker context")

          for marker in [
              'local function getNPCRoot()',
              'local function isProfileLoaded(player)',
              'return isProfileLoaded(instance) and instance.Parent ~= nil and humanoid ~= nil and humanoid.Health > 0',
              'if not isProfileLoaded(target) then return false end',
              'if owner then return isProfileLoaded(owner) end',
              'if player and isProfileLoaded(player) and player.Parent and Players:GetPlayerByUserId(record.UserId) == player then',
              'instance.Parent == npcFolder',
              '(instance:GetAttribute("Enemy") == true or instance:GetAttribute("BossId") ~= nil)',
              'targetModel:IsDescendantOf(Workspace)',
              'targetModel.Parent == npcFolder',
              'targetModel:GetAttribute("Enemy") == true or targetModel:GetAttribute("BossId") ~= nil',
              '(model:GetAttribute("Enemy") == true or model:GetAttribute("BossId") ~= nil)',
              'if target:IsA("Player") then',
              'targetModel = target.Character',
          ]:
              if marker not in damage:
                  problems.append(f"central DamageService target/attacker boundary missing: {marker}")

          for marker in [
              'player:SetAttribute("ProfileLoaded", false)',
              'player:SetAttribute("ProfileLoaded", true)',
              'if PlayerService.ShuttingDown or PlayerService.Closing[player] or PlayerService.Profiles[player] == nil or not player.Parent',
          ]:
              if marker not in player_service:
                  problems.append(f"PlayerService loaded-state lifecycle marker missing: {marker}")

          if problems:
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("PvE attacker context, boss attacker identity, loaded-player gating and exact Workspace.NPCs model identity are covered by the central DamageService boundary.")
