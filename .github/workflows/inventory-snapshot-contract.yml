name: Inventory Snapshot Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate InventoryService returns a detached snapshot
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/Services/InventoryService.lua").read_text(encoding="utf-8")
          required = [
              "function InventoryService.GetInventory(profile)",
              "local snapshot = {}",
              "snapshot[itemId] = math.clamp",
              "return snapshot",
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("Inventory snapshot contract missing: " + ", ".join(missing))

          if "return profile.Inventory" in text:
              raise SystemExit("InventoryService must not expose the live profile inventory table")

      - name: Validate server-to-client inventory responses use snapshots
        shell: python
        run: |
          from pathlib import Path

          paths = {
              "src/ServerScriptService/ShopRemote.server.lua": "InventoryService.GetInventory(profile)",
              "src/ServerScriptService/UseItemRemote.server.lua": "InventoryService.GetInventory(profile)",
              "src/ServerScriptService/CraftingRemote.server.lua": "InventoryService.GetInventory(profile)",
              "src/ServerScriptService/Services/CombatService.lua": "InventoryService.GetInventory(profile)",
              "src/ServerScriptService/Services/BossService.lua": "InventoryService.GetInventory(profile)",
          }
          problems = []
          for relative, marker in paths.items():
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  problems.append(f"{relative} must use InventoryService.GetInventory(profile) for client snapshots")
              if "FireClient(player, profile.Inventory)" in text:
                  problems.append(f"{relative} must not send live profile.Inventory to the client")
          if problems:
              raise SystemExit("\n".join(problems))

          print("Inventory Service and reward-remote snapshot data-exposure contracts validated.")
