name: Daily Bounty Negative Number Contract V2

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/daily-bounty-negative-contract-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signed DailyBounty numeric coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/DailyBountyConfig.lua").read_text(encoding="utf-8")
          economy = Path("src/ReplicatedStorage/Config/EconomyConfig.lua").read_text(encoding="utf-8")
          max_money_match = re.search(r"MaxMoney\s*=\s*(-?[0-9]+)", economy)
          max_money = int(max_money_match.group(1)) if max_money_match else 1000000000

          rewards = [float(value) for value in re.findall(r"RewardMoney\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)]
          goals = [float(value) for value in re.findall(r"Goal\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)]
          if not rewards or any(value <= 0 or value > max_money or value % 1 != 0 for value in rewards):
              raise SystemExit("Daily bounty rewards must be positive integers within EconomyConfig.MaxMoney")
          if not goals or any(value <= 0 or value > 100 or value % 1 != 0 for value in goals):
              raise SystemExit("Daily bounty goals must be positive integers within 1..100")

          print("DailyBountyConfig signed-number coverage validates RewardMoney and Goal bounds instead of skipping negative values.")
