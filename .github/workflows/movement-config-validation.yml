name: Movement Config Validation

on:
  push:
  pull_request:

jobs:
  validate-movement-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate centralized movement speed and position config
        shell: python
        run: |
          from pathlib import Path
          import math
          import re

          config = Path('src/ReplicatedStorage/Config/MovementConfig.lua').read_text(encoding='utf-8')
          numeric = r'-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?'
          bounds = {
              'BaseWalkSpeed': (1, 200), 'MinWalkSpeed': (1, 200), 'MaxWalkSpeedBonus': (0, 100),
              'MinSlowMultiplier': (0.01, 1), 'MaxSlowMultiplier': (0.01, 10),
              'MaxObservedSpeed': (16, 200), 'ExtraDistanceTolerance': (2, 50),
              'GraceDuration': (0.1, 5), 'PositionCheckInterval': (0.05, 1), 'PortalArrivalTolerance': (4, 50),
          }
          values = {}
          for field, (minimum, maximum) in bounds.items():
              match = re.search(rf'\b{field}\s*=\s*({numeric})', config)
              if not match:
                  raise SystemExit(f'MovementConfig missing {field}')
              value = float(match.group(1))
              if not math.isfinite(value) or value < minimum or value > maximum:
                  raise SystemExit(f'MovementConfig {field} outside bounds: {value}')
              values[field] = value
          if not values['MinWalkSpeed'] <= values['BaseWalkSpeed']:
              raise SystemExit('MinWalkSpeed must not exceed BaseWalkSpeed')
          if not values['MinSlowMultiplier'] <= values['MaxSlowMultiplier']:
              raise SystemExit('Slow multiplier bounds are inconsistent')
          for path in ('src/ServerScriptService/Services/PlayerService.lua', 'src/ServerScriptService/Services/StatusEffectService.lua', 'src/ServerScriptService/StatusSpeedGuardV2.server.lua'):
              if 'MovementConfig' not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'{path} must consume shared MovementConfig')
          print('MovementConfig signed finite bounds and cross-service ownership validated.')
