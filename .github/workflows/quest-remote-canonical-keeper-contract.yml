name: Quest Remote Canonical Keeper Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared canonical NPC identity for quest/shop/mastery interactions
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/Bootstrap.server.lua").read_text(encoding="utf-8")
          markers = [
              'local function getCanonicalInteractableNPC(npcName)',
              'npc:IsA("Model")',
              'npc.Parent ~= folder',
              'npc:GetAttribute("Interactable") ~= true',
              'local npc = getCanonicalInteractableNPC(npcName)',
              'if not isNearNPC(player, "CrystalKeeper") then',
              'if not isNearNPC(player, "MaterialTrader") then',
          ]
          for marker in markers:
              if marker not in text:
                  raise SystemExit(f"missing Bootstrap NPC authority marker: {marker}")

          print("Quest, sell and crystal-upgrade NPC proximity checks share canonical interactable identity validation.")
