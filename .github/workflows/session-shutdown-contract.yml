name: Session Shutdown Contract

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shutdown save and release ownership
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path("src/ServerScriptService/SessionHeartbeat.server.lua").read_text(encoding="utf-8")
          player_service = Path("src/ServerScriptService/Services/PlayerService.lua").read_text(encoding="utf-8")
          required = [
              "game:BindToClose(shutdownProfiles)",
              "PlayerService.HasLoadedProfile(player)",
              "local ok = PlayerService.Remove(player)",
              "SHUTDOWN_TIMEOUT",
              "shuttingDown = true",
              "local ReplicatedStorage = game:GetService(\"ReplicatedStorage\")",
              "ReplicatedStorage:SetAttribute(\"CrystalBoundShuttingDown\", false)",
              "ReplicatedStorage:SetAttribute(\"CrystalBoundShuttingDown\", true)",
              "PlayerService.BeginShutdown()",
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("Shutdown persistence contract missing: " + ", ".join(missing))

          flag_index = text.index('ReplicatedStorage:SetAttribute("CrystalBoundShuttingDown", true)')
          begin_shutdown_index = text.index('PlayerService.BeginShutdown()', flag_index)
          if flag_index > begin_shutdown_index:
              raise SystemExit('The global shutdown flag must be published before PlayerService enters shutdown state')

          shutdown_match = re.search(r'SHUTDOWN_TIMEOUT\s*=\s*(-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)', text)
          if not shutdown_match:
              raise SystemExit('SessionHeartbeat must define numeric SHUTDOWN_TIMEOUT')
          shutdown_timeout = float(shutdown_match.group(1))
          if shutdown_timeout <= 0 or shutdown_timeout > 30:
              raise SystemExit('SHUTDOWN_TIMEOUT must remain within a safe 0..30 second server-shutdown window')

          removal_match = re.search(r'REMOVAL_OPERATION_TIMEOUT\s*=\s*(-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)', player_service)
          if not removal_match:
              raise SystemExit('PlayerService must define REMOVAL_OPERATION_TIMEOUT')
          removal_timeout = float(removal_match.group(1))
          if removal_timeout <= 0 or removal_timeout >= shutdown_timeout:
              raise SystemExit('REMOVAL_OPERATION_TIMEOUT must be positive and strictly shorter than SHUTDOWN_TIMEOUT')

          root = Path("src/ServerScriptService")
          remove_calls = []
          for path in root.rglob("*.lua"):
              content = path.read_text(encoding="utf-8")
              if "PlayerService.Remove(player)" in content:
                  remove_calls.append(str(path))
          if "src/ServerScriptService/SessionHeartbeat.server.lua" not in remove_calls:
              raise SystemExit("Shutdown handler must invoke the canonical PlayerService.Remove path")

          for marker in (
              "RemovalResults = setmetatable({}, { __mode = \"k\" })",
              "function PlayerService.HasLoadedProfile(player)",
              "if PlayerService.Closing[player] then",
              "while PlayerService.Closing[player] and os.clock() - started < REMOVAL_OPERATION_TIMEOUT do",
              "return PlayerService.RemovalResults[player] == true",
              "PlayerService.RemovalResults[player] = true",
              "PlayerService.RemovalResults[player] = false",
              "function PlayerService.GetProfile(player)\n\tif PlayerService.ShuttingDown or PlayerService.Closing[player] or PlayerService.Saving[player] then return nil end",
              "function PlayerService.Heal(player, amount)\n\tif not player or not player:IsA(\"Player\") or not player.Parent or PlayerService.ShuttingDown or PlayerService.Closing[player] or PlayerService.Saving[player] then return 0 end",
          ):
              if marker not in player_service:
                  raise SystemExit("PlayerService missing shutdown guard: " + marker)
          print("Session shutdown persistence, dedicated removal contention timeout, duplicate-remove serialization, global gameplay shutdown guard and ordered published shutdown flag validated.")
