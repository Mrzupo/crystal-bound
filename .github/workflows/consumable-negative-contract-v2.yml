name: Consumable Negative Contract V2

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/consumable-negative-contract-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signed consumable numeric coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path("src/ReplicatedStorage/Config/ConsumableConfig.lua").read_text(encoding="utf-8")
          match = re.search(r"HealAmount\s*=\s*(-?[0-9]+(?:\.[0-9]+)?)", config)
          if not match:
              raise SystemExit("ConsumableConfig must define a numeric HealAmount")
          value = float(match.group(1))
          if not 1 <= value <= 1000 or value % 1 != 0:
              raise SystemExit("HealthPotion HealAmount must be a positive integer within 1..1000")
          print("ConsumableConfig signed-number coverage rejects negative and fractional HealAmount values.")
