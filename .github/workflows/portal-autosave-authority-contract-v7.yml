name: Portal Autosave Authority V7

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate autosave-safe portal profile access
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/WorldTheme.server.lua").read_text(encoding="utf-8")
          required = [
              "local function getLoadedProfileForPortal(player)",
              "PlayerService.ShuttingDown",
              "PlayerService.Closing[player]",
              "return PlayerService.Profiles[player]",
              "local profile = getLoadedProfileForPortal(player)",
              "local function tryArmArrival",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"portal autosave authority marker missing: {marker}")

          if 'local profile = PlayerService.GetProfile(player)' in text:
              raise SystemExit("WorldTheme portal authority must not use GetProfile during autosave")

          print("Portal authority uses the loaded server profile directly while rejecting Closing/Shutdown state.")
