name: Daily Bounty State Write Ownership

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation", "agent/daily-bounty-revision-sync-current"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Daily Bounty mutation owners and revision synchronization
        shell: python
        run: |
          from pathlib import Path

          root = Path("src")
          allowed = {
              "ServerScriptService/Services/DailyBountyService.lua",
              "ReplicatedStorage/Modules/PlayerData.lua",
          }
          tokens = (
              "profile.DailyBounty =",
              "profile.DailyBounty = type(",
          )
          violations = []
          for path in root.rglob("*.lua"):
              relative = str(path.relative_to(root))
              text = path.read_text(encoding="utf-8")
              direct = any(token in text for token in tokens)
              indexed_write = False
              for line in text.splitlines():
                  compact = line.replace(" ", "").replace("\t", "")
                  if compact.startswith("profile.DailyBounty[") and "=" in compact:
                      indexed_write = True
                      break
              if (direct or indexed_write) and relative not in allowed:
                  violations.append(relative)
          if violations:
              raise SystemExit("Daily Bounty writes outside canonical owners: " + ", ".join(violations))

          service = (root / "ServerScriptService/Services/DailyBountyService.lua").read_text(encoding="utf-8")
          progress_write = service.index('bounty.Progress = math.min(bounty.Goal, bounty.Progress + 1)')
          non_completion_sync = service.index('PlayerService.Sync(player)\n\tplayer:SetAttribute("BountyMessage", string.format("Daily Bounty:')
          if non_completion_sync <= progress_write:
              raise SystemExit("Daily Bounty non-completion progress must synchronize ProfileRevisions after mutation")

          print("Daily Bounty write ownership and revision synchronization validated.")
