name: Daily Bounty State Write Ownership

on:
  push:
    branches: ["main", "agent/complete-crystal-bound-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Daily Bounty mutation owners and reward context
        shell: python
        run: |
          from pathlib import Path

          root = Path("src")
          allowed = {
              "ServerScriptService/Services/DailyBountyService.lua",
              "ReplicatedStorage/Modules/PlayerData.lua",
          }
          tokens = (
              "profile.DailyBounty =",
              "profile.DailyBounty = type(",
          )
          indexed_tokens = (
              "profile.DailyBounty[",
          )
          violations = []
          for path in root.rglob("*.lua"):
              relative = str(path.relative_to(root))
              text = path.read_text(encoding="utf-8")
              direct = any(token in text for token in tokens)
              indexed_write = False
              for line in text.splitlines():
                  compact = line.replace(" ", "").replace("\t", "")
                  if compact.startswith("profile.DailyBounty[") and "=" in compact:
                      indexed_write = True
                      break
              if (direct or indexed_write) and relative not in allowed:
                  violations.append(relative)
          if violations:
              raise SystemExit("Daily Bounty writes outside canonical owners: " + ", ".join(violations))

          service = (root / "ServerScriptService/Services/DailyBountyService.lua").read_text(encoding="utf-8")
          for marker in (
              'local function validPlayerProfile(player, profile, PlayerService)',
              'player:GetAttribute("ProfileLoaded") == true',
              'PlayerService.Profiles[player] == profile',
              'if not validPlayerProfile(player, profile, PlayerService) then return false end',
          ):
              if marker not in service:
                  raise SystemExit("Daily Bounty reward context guard missing: " + marker)
          print("Daily Bounty write ownership and loaded-player profile context validated.")
