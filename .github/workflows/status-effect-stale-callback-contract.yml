name: Status Effect Stale Callback Contract

on:
  push:
    branches:
      - "main"
      - "agent/complete-crystal-bound-foundation"
      - "agent/status-effect-stale-callback-contract"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Humanoid-scoped status-effect tokens and shutdown cancellation
        shell: python
        run: |
          from pathlib import Path

          text = Path("src/ServerScriptService/Services/StatusEffectService.lua").read_text(encoding="utf-8")
          heartbeat = Path("src/ServerScriptService/SessionHeartbeat.server.lua").read_text(encoding="utf-8")

          required = [
              "local active = setmetatable({}, { __mode = \"k\" })",
              "local function isShuttingDown()",
              "ReplicatedStorage:GetAttribute(\"CrystalBoundShuttingDown\") == true",
              "local function stateFor(humanoid)",
              "local state = stateFor(humanoid)",
              "local token = {}",
              "state.Slow = token",
              "state.Burn = token",
              "state.Slow == token",
              "state.Burn ~= token",
              "function StatusEffectService.Clear(humanoid)",
              "active[humanoid] = nil",
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("status-effect stale-callback/shutdown guard missing: " + ", ".join(missing))

          slow_index = text.index("task.delay(duration, function()")
          slow_guard = text.index("if not isShuttingDown() and humanoid.Health > 0 and state.BaseWalkSpeed then", slow_index)
          token_guard = text.index("state.Slow == token", slow_index)
          slow_cleanup = text.index("state.Slow = nil", token_guard)
          if not (slow_index < token_guard < slow_cleanup):
              raise SystemExit("slow expiry must validate its current token before cleanup")
          if slow_guard <= token_guard:
              raise SystemExit("slow expiry must decide shutdown restoration before restoring WalkSpeed")

          burn_index = text.index("task.spawn(function()")
          burn_guard = text.index("isShuttingDown() or not humanoid.Parent or humanoid.Health <= 0 or state.Burn ~= token", burn_index)
          burn_cleanup = text.index("if state.Burn == token then state.Burn = nil end", burn_guard)
          if not (burn_index < burn_guard < burn_cleanup):
              raise SystemExit("burn loop must stop on shutdown/replacement/cleared state and only clear its own token")

          for function_start in (text.index("function StatusEffectService.ApplySlow"), text.index("function StatusEffectService.ApplyBurn")):
              guard_window = text[function_start:function_start + 260]
              if "isShuttingDown()" not in guard_window:
                  raise SystemExit("new status effects must be rejected once global shutdown begins")

          if 'ReplicatedStorage:SetAttribute("CrystalBoundShuttingDown", true)' not in heartbeat:
              raise SystemExit('SessionHeartbeat must publish the server shutdown flag before profile removal')

          if "HumanoidRootPart" in text and "Players:GetPlayerFromCharacter" not in text:
              raise SystemExit("player status effects must resolve current character ownership server-side")

          print("Status-effect delayed callbacks are guarded by Humanoid-scoped replacement tokens, lifecycle cleanup and global shutdown cancellation.")
